<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Kingdom</title>
<!-- used when the game is hosted as an installable app; ignored when the file is opened directly -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2B5569">
<style>
:root{
  --paper:#ECF0F1;--card:#FAFBFB;--ink:#1F2A30;--muted:#5A6870;--line:#D3DBDE;
  --sea:#7AA9B5;--sea2:#4F8194;--grass:#AFC98E;--grass2:#9DBB7D;--sand:#DCCB9C;--forest:#5F8E5C;
  --deep:#2B5569;--deep-ink:#fff;--coin:#E2AE2A;--berry:#D2577A;--good:#4E9A5B;--warn:#D98C2B;--bad:#C4505A;
  --o-norvik:#B8C6D4;--o-solenne:#EAD9A6;--o-aurelia:#E2BE9C;--o-wild:#8FB07E;--o-wildf:#6E955F;--side:400px;
  --viz-1:#2a78d6;--viz-2:#eb6834;--viz-3:#1baf7a;--river:#4F93B5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15201F;--card:#1D2A29;--ink:#E3EEEA;--muted:#9AB0AB;--line:#2E3F3D;
  --sea:#2D5E68;--sea2:#264F58;--grass:#4F6E3A;--grass2:#466232;--sand:#7A6A42;--forest:#3E6A3B;
  --deep:#6CC0CF;--deep-ink:#0E1A1C;--coin:#E9C25A;--berry:#E37D9A;--good:#79C286;--warn:#E8A955;--bad:#E07A83;
  --o-norvik:#3E4B58;--o-solenne:#5E5434;--o-aurelia:#5E4634;--o-wild:#35502D;--o-wildf:#2B4424;
  --viz-1:#3987e5;--viz-2:#d95926;--viz-3:#199e70;--river:#5BA8C4;}}
:root[data-theme="dark"]{
  --paper:#15201F;--card:#1D2A29;--ink:#E3EEEA;--muted:#9AB0AB;--line:#2E3F3D;
  --sea:#2D5E68;--sea2:#264F58;--grass:#4F6E3A;--grass2:#466232;--sand:#7A6A42;--forest:#3E6A3B;
  --deep:#6CC0CF;--deep-ink:#0E1A1C;--coin:#E9C25A;--berry:#E37D9A;--good:#79C286;--warn:#E8A955;--bad:#E07A83;
  --o-norvik:#3E4B58;--o-solenne:#5E5434;--o-aurelia:#5E4634;--o-wild:#35502D;--o-wildf:#2B4424;
  --viz-1:#3987e5;--viz-2:#d95926;--viz-3:#199e70;--river:#5BA8C4;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:540px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -14px;padding:12px 18px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.flag{flex:1;min-width:0}
h1{margin:0;font-family:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.85rem;color:var(--muted)}
.stat{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon{background:none;border:0;font-size:1.25rem;padding:4px;color:var(--ink);cursor:pointer;border-radius:8px}
.bar{display:flex;gap:14px;margin-top:6px;font-size:.92rem}
h2{font-family:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;font-size:1.12rem;margin:22px 0 8px}
.sheet h3{font-family:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif}
.hint{color:var(--muted);font-size:.88rem;margin:8px 0}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.need{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:.78rem}
.need b{display:block;font-size:.95rem}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.em{font-size:1.7rem;width:40px;text-align:center;flex:none}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--muted);font-size:.82rem}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pos{color:var(--good)}.neg{color:var(--bad)}
.btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--deep);color:var(--deep-ink);border-color:transparent;font-weight:700}
.btn.wide{width:100%;min-height:48px;margin-top:12px;font-size:1rem}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-pressed="true"]{background:var(--deep)}
.sw[aria-pressed="true"]::after{left:25px}
input[type=range]{width:100%;accent-color:var(--deep);margin:8px 0}
.big{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mood{display:flex;align-items:center;gap:14px;margin-top:14px}
.mood .face{font-size:3rem}
.quote{font-style:italic}
.chart{width:100%;height:120px;display:block}
.endbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:0 14px 8px;pointer-events:none}
.endbar .btn{pointer-events:auto;max-width:512px;width:100%;min-height:50px;font-size:1.02rem;box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:540px}
nav button{flex:1;font:inherit;font-size:.78rem;background:none;border:0;color:var(--muted);padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button span{font-size:1.3rem}
nav button.on{color:var(--deep);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(10,25,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:1.25rem}
.sheet p{margin:8px 0}
.event{text-align:center}
.event .pic{font-size:3.4rem;line-height:1.1;margin:4px 0 6px}
.choice{display:block;width:100%;text-align:left;border-radius:16px;padding:12px 14px;margin-top:10px;white-space:normal;min-height:52px}
.choice small{display:block;color:var(--muted);font-weight:400}
.sheet input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:6px 0}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:70px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.con{background:#12181B;color:#CFE0E6}
.con h3{color:#fff}
.log{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#0A0F11;border-radius:10px;padding:10px;height:240px;overflow:auto;white-space:pre-wrap;margin:0}
.log .e{color:#F29C8F}.log .c{color:#8FC3F2}
.conin{display:flex;gap:8px;margin-top:10px}
.conin input{flex:1;min-width:0;font:15px ui-monospace,Menlo,Consolas,monospace;background:#0A0F11;color:#E6F1F5;border:1px solid #33434A;border-radius:10px;padding:10px}
.con .btn{background:#1E282D;color:#CFE0E6;border-color:#33434A}
.con .btn.primary{background:#6FA8C0;color:#0B1417}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg .btn{min-height:32px;padding:4px 11px;font-size:.85rem}
.seg .btn.on{background:var(--deep);color:var(--deep-ink);border-color:transparent;font-weight:700}
.capbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.capbar i{display:block;height:100%;background:var(--deep)}

.bar{flex-wrap:wrap;gap:10px 14px}
.empty{padding:12px 0}

/* map: one canvas, drawn by drawMap() */
.mappane{display:none}
body.on-isle .mappane{display:block}
.mapwrap{position:relative;height:58vh;height:58dvh;min-height:260px;border-radius:18px;margin-top:10px;background:var(--sea2);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mapwrap canvas.cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab;border-radius:inherit}
.mapwrap canvas.cv:active{cursor:grabbing}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.15rem;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.minimap{position:absolute;left:8px;bottom:8px;border-radius:6px;border:2px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.25);touch-action:none;cursor:pointer;display:none}
.maptip{position:absolute;left:8px;top:8px;max-width:calc(100% - 70px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;pointer-events:none;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lgbar{display:inline-block;width:90px;height:10px;border-radius:5px;vertical-align:middle}
.modes{margin-top:10px}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
@media (min-width:760px){.seg.scroll{flex-wrap:wrap}}
.seg.scroll .btn{flex:none}
button.stat{font:inherit;font-weight:700;background:none;border:0;padding:2px 5px;margin:-2px -5px;border-radius:8px;color:var(--ink);cursor:pointer}
button.stat:hover{background:var(--line)}
.endbar{gap:8px}
.endbar .btn.adv{width:auto;flex:none;min-width:58px;padding:0 16px}
/* charts: 2px lines, 10% area wash, recessive hairline grid; the tooltip is the hover layer */
.chartbox{position:relative;margin:4px 0 2px;outline-offset:4px}
.chartbox svg{display:block;width:100%;overflow:visible}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.chartbox text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chartbox text.end{fill:var(--ink);font-weight:700;font-size:12px}
.chartbox .xh{stroke:var(--muted);stroke-width:1}
.ckeys{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin:2px 0 4px}
.ckeys span{display:inline-flex;align-items:center;gap:6px}
.ckeys i,.ctip i{display:inline-block;width:14px;height:2px;border-radius:1px}
.ctip{position:absolute;top:0;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.78rem;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap;z-index:2}
.ctip .tr{display:flex;align-items:center;gap:6px}
.ctip .tt{color:var(--muted);margin-bottom:2px}
details.tbl{margin:6px 0 0;font-size:.85rem}
details.tbl summary{cursor:pointer;color:var(--muted)}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl th,details.tbl td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--line)}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
.lg i.o-me{background:var(--grass)}.lg i.o-norvik{background:var(--o-norvik)}.lg i.o-solenne{background:var(--o-solenne)}.lg i.o-aurelia{background:var(--o-aurelia)}.lg i.o-wild{background:var(--o-wild)}
.front{position:relative;height:12px;border-radius:6px;margin:8px 0 4px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good))}
.front i{position:absolute;top:-4px;width:6px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}

/* wide screens (unfolded phone, tablet, computer): map on the left, panel on the right */
@media (min-width:760px){
  body{overflow:hidden}
  .app{max-width:none;padding:0;height:100vh;height:100dvh;display:flex;flex-direction:column}
  header{position:static;margin:0;padding:10px 18px}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side)}
  .mappane,body.on-isle .mappane{display:flex;flex-direction:column;min-height:0;padding:0 12px 10px;border-right:1px solid var(--line)}
  .mapwrap{flex:1;height:auto;min-height:0}
  .mappane .hint{margin-bottom:0}
  #view{overflow:auto;padding:0 16px calc(140px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
  nav{left:auto;right:0;width:var(--side);border-left:1px solid var(--line)}
  .endbar{left:auto;right:0;width:var(--side)}
  .toast{left:calc(100% - var(--side)/2)}
  .overlay{justify-content:flex-end;align-items:stretch;background:rgba(10,25,28,.2)}
  .sheet{width:var(--side);max-width:var(--side);max-height:none;height:100%;border-radius:0;border-left:1px solid var(--line)}
}
@media (min-width:1200px){:root{--side:460px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="flag"><h1 id="name"></h1><div class="sub" id="when"></div></div>
      <span id="net" class="tag" hidden>Offline</span>
      <button class="icon" data-act="news" aria-label="News">📰</button>
      <button class="icon" data-act="settings" aria-label="Settings">⚙️</button>
    </div>
    <div class="bar"><button class="stat" id="coins" data-act="tab" data-arg="econ" title="Treasury: open the economy"></button><button class="stat" id="pop" data-act="tab" data-arg="people" title="Population: open your people"></button><button class="stat" id="hap" data-act="why" data-arg="approval" title="What drives approval?"></button><button class="stat" id="leg" data-act="why" data-arg="legitimacy" title="What drives legitimacy?"></button></div>
  </header>
  <div class="main">
    <section class="mappane" aria-label="Map">
      <div class="seg modes" id="modes" role="group" aria-label="Map mode"></div>
      <div class="legend" id="legend"></div>
      <div class="mapwrap" id="mapwrap">
        <canvas class="cv" id="mapcv" tabindex="0" role="img" aria-label="Map of your kingdom and its neighbors. Arrow keys move the cursor, Enter selects, plus and minus zoom."></canvas>
        <div class="maptip" id="maptip" aria-live="polite"></div>
        <div class="mapctl"><button data-act="zoom" data-arg="in" aria-label="Zoom in">+</button><button data-act="zoom" data-arg="out" aria-label="Zoom out">−</button><button data-act="zoom" data-arg="home" aria-label="Center on the capital">⌂</button></div>
        <canvas class="minimap" id="minimap" aria-hidden="true"></canvas>
      </div>
      <p class="hint">Drag to move, pinch or scroll to zoom. Tap your land to build, or a neighbor’s province to buy, claim or contest it. Thick lines are national borders, thin lines are provinces.</p>
    </section>
    <main id="view"></main>
  </div>
</div>
<div class="endbar"><button class="btn primary" data-act="endMonth" id="endBtn">End month</button><button class="btn primary adv" data-act="advance" aria-label="Advance until something happens" title="Keep ending months until something needs you (up to a year)">⏩</button></div>
<nav><div id="nav">
  <button data-act="tab" data-arg="isle"><span>🗺️</span>Map</button>
  <button data-act="tab" data-arg="people"><span>👥</span>People</button>
  <button data-act="tab" data-arg="court"><span>👑</span>Court</button>
  <button data-act="tab" data-arg="econ"><span>🪙</span>Economy</button>
  <button data-act="tab" data-arg="world"><span>🌍</span>World</button>
  <button data-act="tab" data-arg="tech"><span>🔬</span>Research</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="conWrap"><div class="sheet con" role="dialog" aria-modal="true" aria-label="Developer console">
  <h3>Developer console</h3>
  <pre class="log" id="log"></pre>
  <div class="btns">
    <button class="btn" data-act="cmd" data-arg="help">help</button>
    <button class="btn" data-act="cmd" data-arg="add 10000">add 10000</button>
    <button class="btn" data-act="cmd" data-arg="skip 12">skip 12</button>
    <button class="btn" data-act="cmd" data-arg="unlock">unlock</button>
    <button class="btn" data-act="cmd" data-arg="status">status</button>
    <button class="btn" data-act="lastCmd" aria-label="Repeat last command">↑ last</button>
  </div>
  <div class="conin"><input id="conIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a command"><button class="btn primary" data-act="runCon">Run</button></div>
  <div class="btns" id="conSug" aria-label="Suggestions"></div>
  <button class="btn wide" data-act="closeCon">Close</button>
</div></div>
<script>
const $=s=>document.querySelector(s);
const KEY='islandnation.v1';
const store={get(){try{return localStorage.getItem(KEY)}catch(e){return null}},set(v){try{localStorage.setItem(KEY,v)}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>Math.round(n).toLocaleString('en-US');
const esc=t=>String(t).replace(/[<>&"']/g,'');
const roman=n=>['','I','II','III','IV','V','VI','VII','VIII','IX','X'][n]||String(n);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let W=18,H=16;const TS=40;
const WSIZES={small:{n:'Small',W:24,H:20},medium:{n:'Medium',W:36,H:30},large:{n:'Large',W:52,H:42},huge:{n:'Huge',W:72,H:58}};

/* ---------- buildings ---------- */
const B={
  hall:{n:'Royal palace',e:'🏰',fixed:1,jobs:10,d:'The seat of the crown.'},
  cottage:{n:'Cottages',e:'🏠',c:300,u:5,homes:25,d:'Housing for 25 people.'},
  townhouse:{n:'Townhouses',e:'🏘️',c:1000,u:15,homes:80,d:'Housing for 80 people.'},
  apartments:{n:'Apartment blocks',e:'🏢',c:2400,u:35,homes:200,nat:-2,tech:'steel',d:'Housing for 200 people.'},
  farm:{n:'Farm',e:'🌾',c:400,u:10,food:50,jobs:10,d:'Produces food for 50 people.'},
  dock:{n:'Fishing dock',e:'🎣',c:500,u:10,food:45,jobs:8,coast:1,trade:30,d:'Produces food for 45 people. Coast only.'},
  greenhouse:{n:'Glasshouses',e:'🪴',c:1500,u:25,food:140,jobs:15,tech:'glass',d:'Year-round food for 140 people.'},
  market:{n:'Market',e:'🏪',c:600,u:10,jobs:25,inc:60,fun:40,mid:10,d:'Local commerce. Strengthens the merchants.'},
  workshop:{n:'Workshop',e:'🧰',c:1000,u:20,jobs:45,inc:60,goods:25,nat:-3,d:'Makes goods. Strengthens the workers.'},
  factory:{n:'Factory',e:'🏭',c:2500,u:40,jobs:120,inc:150,goods:80,nat:-9,tech:'steam',d:'Large-scale manufacturing. Pollutes.'},

  // terrain: farms depend on the land, windmills catch more wind on hills
  S.map.forEach((c,i)=>{if(c.o!=='me'||!c.b)return;const d=B[c.b];if(!d)return;const f=S.war&&S.war.occ[c.p]==='them'?0:S.dev[c.p]?.5:1;
    const tm=c.b==='farm'?farmMult(i):c.b==='wind'&&c.hl?1.5:1;
    for(const k in t)if(k!=='up'&&d[k])t[k]+=k==='homes'?d[k]:d[k]*f*(k==='food'||k==='power'?tm:1);t.up+=d.u||0});
  t.trade+=S.navy*40;const blockaded=S.war&&S.war.foes.reduce((a,n)=>a+theirNavy(n),0)>S.navy;if(blockaded){t.trade*=.5}
  if(trait('frugal'))t.up*=.9;
  // a lumber camp keeps its forest, but logging halves what it's worth to the environment
  const forests=S.map.reduce((a,c)=>a+(c.o==='me'&&c.t==='f'?(!c.b?1:c.b==='lumber'?.5:0):0),0),D=k=>!!S.dec[k];
  // neighborhoods: how pleasant the average home is, weighted by how many people it houses
  const A=appealMap();let hw=0,ha=0,hp=0;S.map.forEach((x,i)=>{const hm=x.o==='me'&&x.b&&B[x.b]&&B[x.b].homes;if(!hm)return;hw+=hm;ha+=hm*A[i];if(A[i]<0)hp+=hm});
  const hoodAvg=hw?ha/hw:0,polluted=hw?hp/hw:0,hood=clamp(Math.round(hoodAvg*1.5),-5,5);
  const matCap=500+100*(cnt('lumber')+cnt('quarry')+cnt('brickworks')),matSale=Math.max(0,Math.round(((S.mat||0)+t.mat-matCap)*2));
  const coalImp=Math.max(0,cnt('diesel')-cnt('coalmine'))*20;
  const pop=S.pop,soldiers=Math.min(S.troops,Math.round(pop*.2)),workers=Math.max(0,Math.round(pop*.6)-soldiers),employed=Math.min(workers,t.jobs);
  const share={upper:.05+(S.laws.labor==='serfdom'?.02:0)};share.middle=clamp(.08+t.mid/pop*.5,.08,.45);share.lower=1-share.upper-share.middle;
  const foodMult=1+(hasTech('rotation')?.15:0)+(law('labor').food||0)/100+modSum('foodprod')/100,goodsMult=1+(hasTech('workshops')?.25:0);
  const prod={food:t.food*foodMult,energy:t.power,goods:t.goods*goodsMult};
  const rat=D('ration')?.8:1;const dem={food:Math.round(pop*rat),energy:Math.round(pop*rat),goods:Math.round(pop*share.middle+pop*share.upper*3)};
  let cap=t.trade;const tr={};let expV=0,impV=0;
  RES.forEach(({k:r})=>{const diff=prod[r]-dem[r],c=S.trade[r];if(diff<0&&tradeOK(c)){const amt=Math.min(-diff,cap);cap-=amt;const v=amt*buyP(c,r);impV+=v;tr[r]={dir:'import',amt,v,c}}});
  RES.forEach(({k:r})=>{const diff=prod[r]-dem[r],c=S.trade[r];if(diff>0&&tradeOK(c)){const amt=Math.min(diff,cap);cap-=amt;const v=amt*payP(c,r);expV+=v;tr[r]={dir:'export',amt,v,c}}});
  const sup={};RES.forEach(({k:r})=>{const T=tr[r];sup[r]=prod[r]+(T&&T.dir==='import'?T.amt:0)-(T&&T.dir==='export'?T.amt:0)});
  const price={};RES.forEach(({k:r})=>{price[r]=dem[r]<=0?PRICE[r]*.5:PRICE[r]*clamp(Math.pow(dem[r]/Math.max(1,sup[r]),.8),.5,2.5)});
  const occ=pop/Math.max(1,t.homes);let rentIdx=1+clamp((occ-.8)/.2,0,1)*1.2;if(D('rentcap'))rentIdx=Math.min(rentIdx,1.2);

    let v=ws.reduce((a,[n,w])=>a+sc[n]*w,0)/tot+(10-S.tax)*C.tax[S.laws.tax]-(colIdx-1)*C.col+(C.base||0)+((law('labor').cls||{})[k]||0)+((law('welfare').cls||{})[k]||0)-6;
    cls[k]=clamp(Math.round(v),0,100)});

  const fortN=S.map.reduce((a,x)=>a+(x.o==='me'&&x.b==='fort'?(x.hl?2:1):0),0);

  const target=clamp(Math.round(cls.lower*share.lower+cls.middle*share.middle+cls.upper*share.upper+t.hap+hood+(D('festival')?4:0)+(law('press').hap||0)+modSum('hap')-debt-weary-(D('ration')?4:0)-(S.mob?3:0)),0,100);
  // interest groups

    landowners:25+(L.labor==='serfdom'?10:0)+cnt('farm'),
    clergy:15+(L.church==='state'?10:L.church==='secular'?-8:0)+cnt('church')*4,
    merchants:8+(cnt('market')+cnt('harbor')*2+cnt('bank')*3)*3+(L.trade==='free'?5:0),
    intelligentsia:5+(cnt('school')+cnt('library')+cnt('university')*2)*2+(L.press==='free'?5:0),
    workers:6+cnt('factory')*5+cnt('workshop')*2+(L.labor==='free'?5:0)};
  const rsum=IGIDS.reduce((a,k)=>a+Math.max(1,raw[k]),0),clout={},mood={};
  IGIDS.forEach(k=>{clout[k]=Math.max(1,raw[k])/rsum;const G=IGS[k];let m=50;
    Object.entries(G.likes).forEach(([c,o])=>{m+=o[L[c]]||0});

      {l:`Cede ${P.name}`,f(){transfer(i,n,'treaty');tenA(n,-50);relA(n,8);addMod('leg',-10,24,`Ceded ${P.name}`);return`${P.name} passes to ${Nn.n}. Peace holds, but the court is humiliated.`}},
      {l:'Refuse',f(){tenA(n,25);relA(n,-10);addMod('leg',4,12,`Defended ${P.name}`);return`You refuse. ${Nn.n} is furious${S.tension[n]>=90?', and war is now a real risk':''}.`}}];
    if(c.str*c.forts>=th*1.3){const their=borderOf(n,'me').filter(q=>!S.prov[q].heart);if(their.length)ch.push({l:'Refuse, and demand land in return',f(){if(Math.random()<.5){const q=pick(their);transfer(q,'me','treaty');tenA(n,30);addMod('leg',6,12,'Diplomatic triumph');return`Faced with your army, ${Nn.n} backs down and cedes ${S.prov[q].name}.`}tenA(n,40);relA(n,-15);return`${Nn.n} refuses outright. Tension soars.`}})}
    return{id:'crisis',e:Nn.e,t:`${Nn.n} demands ${P.name}`,d:`${Nn.n} claims your province of ${P.name} and demands you hand it over. Tension is at ${Math.round(S.tension[n])}. Their army strength is ${th}, yours is ${c.str}.`,ch}}const dem=pick([['fishing rights in your northern waters','Their fleet wants access to your fishing grounds.'],['lower tariffs on their goods','Their merchants say your markets are unfairly closed.'],['compensation for a harbor incident','One of their ships was damaged in your harbor.'],['the return of a disputed islet','They claim a rocky islet off your coast.']]);
  return{id:'crisis',e:Nn.e,t:`${Nn.n} issues an ultimatum`,d:`${Nn.n} demands ${dem[0]}. ${dem[1]} Tension is at ${Math.round(S.tension[n])}.`,ch:[
    {l:'Concede',c:400,f(){tenA(n,-40);relA(n,5);addMod('leg',-6,12,`Conceded to ${Nn.n}`);return`${Nn.n} is satisfied. Some at court call it weakness.`}},
    {l:'Stand firm',f(){tenA(n,25);relA(n,-10);addMod('leg',5,12,`Stood up to ${Nn.n}`);if(S.tension[n]>=100)return embargoNow(n);return`${Nn.n} backs down for now, but tension rises.`}}]}}

function termCost(k){if(k==='rep1')return 10;if(k==='rep2')return 25;if(k==='renounce')return 10;if(k==='humiliate')return 10;const i=+k.slice(1),P=S.prov[i];return clamp(15+Math.round(provValue(i)/300),15,40)*(P.heart?2:1)}

  const war=S.war?(()=>{const w=warStr(),W_=S.war,sc=W_.score,occ=Object.entries(W_.occ);const bonds=S.mods.filter(m=>m.l==='War bonds').length;

  invade:n=>{if(!NATIONS[n])return E('Usage: invade NATION');if(S.war)return E('Already at war');const g=borderOf('me',n).filter(i=>i!==0)[0];if(g==null)return E('No border province to attack');startWar(n,g,n);return`${NATIONS[n].n} invades ${S.prov[g].name}`},
  score:n=>{if(!S.war)return E('Not at war');S.war.score=clamp(num(n,0),-100,100);return`War score set to ${S.war.score}`},
  peace:()=>{if(!S.war)return E('Not at war');const r=finishWar('Peace',[],[]);return r.d},
  troops:n=>{S.troops=Math.max(0,num(n,troopTarget()));return`Troops set to ${S.troops}`},

  occupy:i=>{i=num(i,-1);if(!S.war||!S.prov[i])return E('Usage: occupy ID (during a war)');S.war.occ[i]=S.prov[i].o==='me'?'them':'me';S.war.occd[i]=1;return`${S.prov[i].name} occupied`},
  general:t=>{const k=GTRAITS[t]?t:pick(Object.keys(GTRAITS));S.general={name:pick(GNAMES),trait:k};return`General ${S.general.name} (${GTRAITS[k].n}) appointed`},
  court:n=>{S.court=clamp(num(n,2),0,4);return`Royal household set to ${COURT[S.court].n.toLowerCase()}`},
  aging:v=>{S.aging=v!=='off';return`Aging and succession ${S.aging?'on':'off'}`},
  goals:()=>{GOALS.forEach(g=>S.goals[g.id]=1);return'All objectives marked complete'},
  status:()=>statusLines(),
  province:i=>{i=num(i,-1);const P=S.prov[i];if(!P)return E('Usage: province ID (see provinces)');const tl=provTiles(i),bl=tl.map(t=>S.map[t].b).filter(b=>b&&B[b]);
    return[`${i}: ${P.name}. Owner ${ownName(P.o)}${P.o!==P.core?`, originally ${ownName(P.core)}`:''}.`,`${tl.length} tiles, ${P.pop} foreign residents${P.heart?', a heartland':''}.`,`Buildings: ${bl.length?bl.join(', '):'none'}.`,`Your claim: ${S.claims[i]?'yes':'no'}. Claimed by: ${S.fclaims[i]?NATIONS[S.fclaims[i]].n:'nobody'}.`,
      `Occupied: ${S.war&&S.war.occ[i]?(S.war.occ[i]==='me'?'by you':'by the enemy'):'no'}. Devastated: ${S.dev[i]?S.dev[i]+' months':'no'}. Settling: ${P.settle?P.settle+' months':'no'}.`,NATIONS[P.o]?`Buy price: ${fmt(buyPrice(i))}.`:'']},
  why:w=>w&&w.startsWith('leg')?whyLegitimacy():w&&w.startsWith('app')?whyApproval():w&&w.startsWith('unr')?whyLines('unrest'):E('Usage: why approval, why legitimacy or why unrest'),
  events:v=>{if(v==='off'||v==='on'){S.noEvents=v==='off';return`Random events ${v}`}return EVENTS.map(e=>e.id).concat('crisis').join(', ')},
  date:(m,y)=>{if(m==null)return E('Usage: date MONTH [YEAR]');S.month=monthIdx(m);if(y!=null)S.year=Math.max(1,num(y,S.year));return`Date set to ${MONTHS[S.month]}, year ${S.year}`},
  next:()=>{endMonth(false);return['A month passes. Details are in the news.'].concat(statusLines())},
  trait:t=>{if(!TRAITS[t])return E('Use '+Object.keys(TRAITS).join(', '));S.monarch.trait=t;return`${monarchName(S.monarch)} is now ${TRAITS[t].n.toLowerCase()}`},
  heir:n=>{S.heir.age=clamp(num(n,S.heir.age),0,90);return`${S.heir.name} is now ${S.heir.age}`},
  marry:n=>{if(!NATIONS[n])return E('Usage: marry NATION');S.heir.age=Math.max(16,S.heir.age);S.heir.spouse=n;relA(n,20);tenA(n,-20);const o=borderOf(n,'me').filter(i=>!S.prov[i].heart);if(o.length)S.claims[pick(o)]=true;return`${S.heir.name} marries into the ${NATIONS[n].n} royal family`},
  settle:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o!=='wild')return E('Usage: settle ID (a frontier province)');transfer(i,'me','settled');return`${S.prov[i].name} settled`},
  devastate:(i,m)=>{i=num(i,-1);if(!S.prov[i])return E('Usage: devastate ID [MONTHS]');S.dev[i]=Math.max(1,num(m,12));return`${S.prov[i].name} devastated for ${S.dev[i]} months`},
  rebuild:a=>{if(a!=='all')return E('Usage: rebuild all');const n=Object.keys(S.dev).length;S.dev={};return`${n} province${n===1?'':'s'} rebuilt`},
  demolish:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o!=='me')return E('Usage: demolish ID (one of your provinces)');let k=0;provTiles(i).forEach(t=>{const x=S.map[t];if(x.b&&!B[x.b].fixed){x.b=null;k++}});return`Demolished ${k} building${k===1?'':'s'} in ${S.prov[i].name}`},
  win:()=>{if(!S.war)return E('Not at war');S.war.score=Math.max(S.war.score,60);const r=autoResolve('win');return[r.t+'.',r.d]},
  lose:()=>{if(!S.war)return E('Not at war');S.war.score=Math.min(S.war.score,-60);const r=autoResolve('lose');return[r.t+'.',r.d]},
  enemy:(n,v)=>{if(!NATIONS[n])return E('Usage: enemy NATION N, or enemy NATION off');S.enemyStr=S.enemyStr||{};if(v==='off'||v==null){delete S.enemyStr[n];return`${NATIONS[n].n} strength back to normal (${theirStr(n)})`}S.enemyStr[n]=Math.max(0,num(v,0));return`${NATIONS[n].n} army strength fixed at ${S.enemyStr[n]}`},
  embargo:(n,m)=>{if(!NATIONS[n])return E('Usage: embargo NATION MONTHS (0 lifts it)');const k=Math.max(0,num(m,12));if(k)S.embargo[n]=k;else delete S.embargo[n];return k?`${NATIONS[n].n} embargo for ${k} months`:`${NATIONS[n].n} embargo lifted`},
  situation:(n,st)=>{if(!NATIONS[n]||!['stable','indebted','troubled'].includes(st))return E('Usage: situation NATION stable|indebted|troubled');S.nsit[n]=st;return`${NATIONS[n].n} is now ${st}`},
  god:()=>{S.god=!S.god;if(S.god)S.coins=Math.max(S.coins,999999);return`God mode ${S.god?'on: infinite money, and unrest can\u2019t rise':'off'}`},
  clear:()=>{LOG.length=0;return[]},
  reset:y=>{if(y!=='yes')return E('Type reset yes to start over');S=newState();return'New nation created'}

function act(a,arg,n){
  switch(a){
    case'tab':tab=arg;window.scrollTo(0,0);$('#view').scrollTop=0;break;
    case'zoom':if(arg==='home')centerOn(capIdx(),TS);else zoomAt(MAP.vw/2,MAP.vh/2,arg==='in'?1.35:1/1.35);drawSoon();return;
    case'wsize':{if(!WSIZES[arg]||S.turn>0)return;const v=($('#nm')||{}).value;setWorld(genWorld(arg));welcome();if(v!=null)$('#nm').value=v;render();return}
    case'tile':tileSheet(+arg);return;
    case'build':{const i=+arg,d=B[n],x=S.map[i];if(!d||x.o!=='me'||x.b||x.t==='w'||placeWhy(n,i))return;const k=priceOf(d.c,matCost(d));if(S.coins<k.coins)return;
      S.coins-=k.coins;S.mat=(S.mat||0)-k.use;x.b=n;if(!d.forest)x.t='l';S.sel=-1;$('#sheetWrap').classList.remove('open');toast(`${d.e} ${d.n} built${k.imp?`, with 🧱${k.imp} imported`:''}`);checkGoals().forEach(g=>setTimeout(()=>toast(`✅ ${g.d}. +🪙${fmt(g.r)}`),1200));break}
    case'upgrade':{const i=+arg,x=S.map[i],d=B[x.b],U=B[UPGR[x.b]];if(!U||placeWhy(UPGR[x.b],i))return;const k=priceOf(Math.max(0,U.c-Math.round(d.c*.5)),Math.max(0,matCost(U)-Math.round(matCost(d)/2)));if(S.coins<k.coins)return;
      S.coins-=k.coins;S.mat=(S.mat||0)-k.use;x.b=UPGR[x.b];S.sel=-1;$('#sheetWrap').classList.remove('open');toast(`${U.e} Upgraded to ${U.n.toLowerCase()}`);checkGoals();break}
    case'demolish':{const i=+arg,x=S.map[i],d=B[x.b];if(!d||d.fixed)return;if(!resetArmed){resetArmed=true;$('#demoBtn').textContent='Tap again to demolish';return}
      S.coins+=Math.round(d.c*.25);x.b=null;S.sel=-1;resetArmed=false;$('#sheetWrap').classList.remove('open');toast(`${d.n} demolished`);break}
    case'dec':S.dec[arg]=!S.dec[arg];toast(`${DEC[arg].n} ${S.dec[arg]?'decreed':'revoked'}`);break;
    case'provInfo':provSheet(+arg);return;
    case'bfilt':{const F=UI.bfilt||(UI.bfilt={cat:'all',afford:false});if(arg==='afford')F.afford=!F.afford;else F.cat=arg;saveUI();tileSheet(+n);return}
    case'settle':{const i=+arg,P=S.prov[i],cost=settleCost(i);if(P.o!=='wild'||P.settle||S.coins<cost||!touches(i,'me'))return;S.coins-=cost;P.settle=hasTech('survey')?4:6;closeSheet();toast(`🧭 Settlers set out for ${P.name}`);break}
    case'buyProv':{const i=+arg,P=S.prov[i];if(!NATIONS[P.o]||atWarWith(P.o))return;const price=buyPrice(i);if(S.coins<price)return;if(!resetArmed){resetArmed=true;$('#buyBtn').textContent='Tap to confirm';return}resetArmed=false;
      const n=P.o;S.coins-=price;transfer(i,'me','bought');relA(n,-3);closeSheet();toast(`💰 ${P.name} is now part of your kingdom`);checkGoals();break}
    case'demandProv':{const i=+arg,P=S.prov[i],n=P.o;if(!NATIONS[n]||S.demandCd[n]||atWarWith(n)||!(S.claims[i]||S.tension[n]>=60))return;S.demandCd[n]=12;const c=calc(),ratio=c.str/Math.max(1,theirStr(n));
      if(ratio>=1.5&&Math.random()<.5+(ratio-1.5)*.3){transfer(i,'me','demand');tenA(n,20);relA(n,-15);addMod('leg',5,12,`Took ${P.name}`);toast(`${NATIONS[n].n} yields ${P.name}`)}
      else{tenA(n,30);relA(n,-15);toast(`${NATIONS[n].n} refuses. Tension rises sharply.`)}closeSheet();break}
    case'declare':{const i=+arg,P=S.prov[i],n=P.o;if(S.war||!NATIONS[n])return;if(!resetArmed){resetArmed=true;$('#warBtn').textContent='Tap to confirm';return}resetArmed=false;
      startWar(n,i,'me');closeSheet();toast(`⚔️ War is declared on ${NATIONS[n].n}${S.war.foes.length>1?`. ${S.war.foes.slice(1).map(o=>NATIONS[o].n).join(' and ')} join${S.war.foes.length>2?'':'s'} against you!`:''}`);tab='world';break}
    case'peaceSheet':peaceSel=[];peaceSheet();return;
    case'term':{const i=peaceSel.indexOf(arg);if(i>=0)peaceSel.splice(i,1);else{if(arg==='rep1')peaceSel=peaceSel.filter(k=>k!=='rep2');if(arg==='rep2')peaceSel=peaceSel.filter(k=>k!=='rep1');peaceSel.push(arg)}peaceSheet();return}
    case'sendTerms':case'white':case'acceptTheirs':{if(!S.war)return;const sc=S.war.score;let res;queue.length=0;
      if(a==='sendTerms'){const used=peaceSel.reduce((x,k)=>x+termCost(k),0);if(used>sc)return;res=finishWar('Peace on your terms',peaceSel.slice(),[])}
      else if(a==='white'){if(sc<-20){toast('They refuse a white peace while winning');return}res=finishWar('A white peace',[],[])}
      else res=finishWar('Peace on their terms',[],theirTerms(-sc));
      peaceSel=[];render();openSheet(`<div class="event"><div class="pic">🕊️</div><h3>${res.t}</h3><p>${res.d}</p></div><button class="btn primary wide" data-act="${queue.length?'nextEvent':'closeSheet'}">${queue.length?'Continue':'Return to the map'}</button>`);return}
    case'strat':if(S.war)S.war.strat=arg;break;
    case'mobilize':{S.mob=!S.mob;if(S.mob)S.troops+=Math.round(S.pop*ARMY[S.army].r*.6);else S.troops=Math.min(S.troops,troopTarget());toast(S.mob?'Reserves are called up':'Reserves are sent home');break}
    case'bonds':{if(!S.war||S.mods.filter(m=>m.l==='War bonds').length>=3)return;S.coins+=2000;addMod('inc',-110,24,'War bonds');toast('War bonds raise 🪙2,000');break}

    case'appoint':{if(arg==='heir'){if(!(S.aging&&S.heir.age>=16))return;S.general={name:S.heir.name,trait:pick(Object.keys(GTRAITS)),heir:true}}else{const g=genCands[+arg];if(!g||S.coins<200)return;S.coins-=200;S.general={name:g.name,trait:g.trait}}genCands=[];closeSheet();toast(`${S.general.heir?'The heir':'General '+S.general.name} takes command`);break}
    case'dismissGen':S.general=null;genCands=[];closeSheet();toast('The general is dismissed');break;
    case'ship':{if(!has('shipyard')||S.coins<400)return;S.coins-=400;S.navy++;toast('🚢 A new warship is launched');break}
    case'rebuild':{const i=+arg,cost=rebuildCost(i);if(!S.dev[i]||S.coins<cost)return;S.coins-=cost;delete S.dev[i];closeSheet();toast(`${S.prov[i].name} is rebuilt`);break}
    case'marry':{const n=arg,h=S.heir;if(h.age<16||h.spouse||S.coins<500||atWarWith(n))return;S.coins-=500;h.spouse=n;relA(n,20);tenA(n,-20);
      const opts=borderOf(n,'me').filter(i=>!S.prov[i].heart);let msg=`${h.name} marries into the ${NATIONS[n].n} royal family.`;
      if(opts.length){const i=pick(opts);if(Math.random()<.3){transfer(i,'me','inherited');msg+=` ${S.prov[i].name} comes as the dowry!`}else{S.claims[i]=true;msg+=` You gain a claim on ${S.prov[i].name}.`}}
      toast(msg);checkGoals();break}
    case'enact':{if(S.enact||!LAWS[arg]||!LAWS[arg].o[n])return;const mo=trait('reformer')?4:6;S.enact={cat:arg,opt:n,left:mo};
      IGIDS.forEach(g=>{const v=(IGS[g].likes[arg]||{})[n]||0,cv=(IGS[g].likes[arg]||{})[S.laws[arg]]||0;if(v<cv)igM(g,-5,mo,`Opposes ${LAWS[arg].o[n].n.toLowerCase()}`)});
      toast(`Debate begins on ${LAWS[arg].o[n].n.toLowerCase()}. It passes in ${mo} months.`);break}
    case'cancelLaw':{if(!S.enact)return;const o=LAWS[S.enact.cat].o[S.enact.opt].n.toLowerCase();S.mods=S.mods.filter(m=>m.l!==`Opposes ${o}`);S.enact=null;addMod('leg',-2,3,'Withdrawn law');toast('The law is withdrawn');break}
    case'favor':{if(S.favorCd[arg]||S.coins<400)return;S.coins-=400;S.favorCd[arg]=6;igM(arg,15,12,'Royal favor');toast(`The ${IGS[arg].n.toLowerCase()} are pleased by the crown\u2019s favor`);break}
    case'research':{if(hasTech(arg))return;const t=techOf(arg);if(t.req&&!hasTech(t.req))return;if(S.tech.cur!==arg){S.tech.cur=arg;S.tech.prog=0}toast(`Scholars begin work on ${t.n.toLowerCase()}`);break}
    case'setTrade':{S.trade[arg]=n||null;toast(n?`${RES.find(r=>r.k===arg).n} agreement signed with ${NATIONS[n].n}`:'Agreement ended');checkGoals();break}
    case'envoy':{if(S.envoy[arg]||S.coins<300)return;S.coins-=300;S.envoy[arg]=1;const tg=hasTech('telegraph');relA(arg,tg?12:8);tenA(arg,tg?-12:-8);toast(`Envoy sent to ${NATIONS[arg].n}. Relations improve and tension eases.`);break}
    case'demand':{if(S.demandCd[arg])return;S.demandCd[arg]=6;tenA(arg,25);const ok=S.rel[arg]>=40&&Math.random()<S.rel[arg]/100;let msg;
      if(ok){const pay=300+Math.round(S.rel[arg]*5);S.coins+=pay;addMod('leg',3,6,`Tribute from ${NATIONS[arg].n}`);relA(arg,-4);msg=`${NATIONS[arg].n} pays 🪙${fmt(pay)} in tribute. Your court is impressed.`}
      else{relA(arg,-10);msg=`${NATIONS[arg].n} refuses, and relations suffer.`}
      if(S.tension[arg]>=100)msg+=' '+embargoNow(arg);toast(msg);break}
    case'aging':{S.aging=!S.aging;const b=$('#sheet [data-act=aging]');if(b)b.setAttribute('aria-pressed',S.aging);toast(`Aging and succession ${S.aging?'on':'off'}`);render();return}
