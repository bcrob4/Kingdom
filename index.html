<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Kingdom</title>
<!-- used when the game is hosted as an installable app; ignored when the file is opened directly -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2B5569">
<style>
:root{
  --paper:#ECF0F1;--card:#FAFBFB;--ink:#1F2A30;--muted:#5A6870;--line:#D3DBDE;
  --sea:#7AA9B5;--sea2:#4F8194;--grass:#AFC98E;--grass2:#9DBB7D;--sand:#DCCB9C;--forest:#5F8E5C;
  --deep:#2B5569;--deep-ink:#fff;--coin:#E2AE2A;--berry:#D2577A;--good:#4E9A5B;--warn:#D98C2B;--bad:#C4505A;
  --o-norvik:#B8C6D4;--o-solenne:#EAD9A6;--o-aurelia:#E2BE9C;--o-wild:#8FB07E;--o-wildf:#6E955F;--side:400px;
  --viz-1:#2a78d6;--viz-2:#eb6834;--viz-3:#1baf7a;--river:#4F93B5;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#15201F;--card:#1D2A29;--ink:#E3EEEA;--muted:#9AB0AB;--line:#2E3F3D;
  --sea:#2D5E68;--sea2:#264F58;--grass:#4F6E3A;--grass2:#466232;--sand:#7A6A42;--forest:#3E6A3B;
  --deep:#6CC0CF;--deep-ink:#0E1A1C;--coin:#E9C25A;--berry:#E37D9A;--good:#79C286;--warn:#E8A955;--bad:#E07A83;
  --o-norvik:#3E4B58;--o-solenne:#5E5434;--o-aurelia:#5E4634;--o-wild:#35502D;--o-wildf:#2B4424;
  --viz-1:#3987e5;--viz-2:#d95926;--viz-3:#199e70;--river:#5BA8C4;}}
:root[data-theme="dark"]{
  --paper:#15201F;--card:#1D2A29;--ink:#E3EEEA;--muted:#9AB0AB;--line:#2E3F3D;
  --sea:#2D5E68;--sea2:#264F58;--grass:#4F6E3A;--grass2:#466232;--sand:#7A6A42;--forest:#3E6A3B;
  --deep:#6CC0CF;--deep-ink:#0E1A1C;--coin:#E9C25A;--berry:#E37D9A;--good:#79C286;--warn:#E8A955;--bad:#E07A83;
  --o-norvik:#3E4B58;--o-solenne:#5E5434;--o-aurelia:#5E4634;--o-wild:#35502D;--o-wildf:#2B4424;
  --viz-1:#3987e5;--viz-2:#d95926;--viz-3:#199e70;--river:#5BA8C4;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:540px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -14px;padding:12px 18px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.flag{flex:1;min-width:0}
h1{margin:0;font-family:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;font-size:1.3rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.85rem;color:var(--muted)}
.stat{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.icon{background:none;border:0;font-size:1.25rem;padding:4px;color:var(--ink);cursor:pointer;border-radius:8px}
.bar{display:flex;gap:14px;margin-top:6px;font-size:.92rem}
h2{font-family:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;font-size:1.12rem;margin:22px 0 8px}
.sheet h3{font-family:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif}
.hint{color:var(--muted);font-size:.88rem;margin:8px 0}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.need{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;font-size:.78rem}
.need b{display:block;font-size:.95rem}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.em{font-size:1.7rem;width:40px;text-align:center;flex:none}
.grow{flex:1;min-width:0}
.grow small{display:block;color:var(--muted);font-size:.82rem}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pos{color:var(--good)}.neg{color:var(--bad)}
.btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--deep);color:var(--deep-ink);border-color:transparent;font-weight:700}
.btn.wide{width:100%;min-height:48px;margin-top:12px;font-size:1rem}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-pressed="true"]{background:var(--deep)}
.sw[aria-pressed="true"]::after{left:25px}
input[type=range]{width:100%;accent-color:var(--deep);margin:8px 0}
svg.arms{flex:none;display:block}
input.txt{width:100%;box-sizing:border-box;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card,transparent);color:inherit;font:inherit}
.big{font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.mood{display:flex;align-items:center;gap:14px;margin-top:14px}
.mood .face{font-size:3rem}
.quote{font-style:italic}
.chart{width:100%;height:120px;display:block}
.endbar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:0 14px 8px;pointer-events:none}
.endbar .btn{pointer-events:auto;max-width:512px;width:100%;min-height:50px;font-size:1.02rem;box-shadow:0 4px 14px rgba(0,0,0,.18)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;justify-content:center}
nav div{display:flex;width:100%;max-width:540px}
nav button{flex:1;font:inherit;font-size:.78rem;background:none;border:0;color:var(--muted);padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
nav button span{font-size:1.3rem}
nav button.on{color:var(--deep);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(10,25,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.sheet h3{margin:0 0 8px;font-size:1.25rem}
.sheet p{margin:8px 0}
.event{text-align:center}
.event .pic{font-size:3.4rem;line-height:1.1;margin:4px 0 6px}
.choice{display:block;width:100%;text-align:left;border-radius:16px;padding:12px 14px;margin-top:10px;white-space:normal;min-height:52px}
.choice small{display:block;color:var(--muted);font-weight:400}
.sheet input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);margin:6px 0}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;min-height:70px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:.75rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.con{background:#12181B;color:#CFE0E6}
.con h3{color:#fff}
.log{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#0A0F11;border-radius:10px;padding:10px;height:240px;overflow:auto;white-space:pre-wrap;margin:0}
.log .e{color:#F29C8F}.log .c{color:#8FC3F2}
.conin{display:flex;gap:8px;margin-top:10px}
.conin input{flex:1;min-width:0;font:15px ui-monospace,Menlo,Consolas,monospace;background:#0A0F11;color:#E6F1F5;border:1px solid #33434A;border-radius:10px;padding:10px}
.con .btn{background:#1E282D;color:#CFE0E6;border-color:#33434A}
.con .btn.primary{background:#6FA8C0;color:#0B1417}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.seg .btn{min-height:32px;padding:4px 11px;font-size:.85rem}
.seg .btn.on{background:var(--deep);color:var(--deep-ink);border-color:transparent;font-weight:700}
.capbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.capbar i{display:block;height:100%;background:var(--deep)}

.bar{flex-wrap:wrap;gap:10px 14px}
.empty{padding:12px 0}

/* map: one canvas, drawn by drawMap() */
.mappane{display:none}
body.on-isle .mappane{display:block}
.mapwrap{position:relative;height:62vh;height:62dvh;min-height:260px;border-radius:18px;margin-top:10px;background:var(--sea2);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.mapwrap canvas.cv{display:block;width:100%;height:100%;touch-action:none;cursor:grab;border-radius:inherit}
.mapwrap canvas.cv:active{cursor:grabbing}
.mapctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1.15rem;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.minimap{position:absolute;left:8px;bottom:8px;border-radius:6px;border:2px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.25);touch-action:none;cursor:pointer;display:none}
.mapover{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100% - 66px);pointer-events:none;z-index:1}
.mapover>*{pointer-events:auto}
.mapbar{display:flex;gap:6px}
.mapbar select,.pill{font:inherit;font-size:.85rem;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 12px;box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--deep);color:var(--deep-ink);border-color:transparent}
.mapover .legend{margin:0;padding:6px 10px;gap:4px 10px;border-radius:12px;font-size:.75rem;max-width:300px;color:var(--ink);background:color-mix(in srgb,var(--card) 92%,transparent);border:1px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.mapover .legend[hidden]{display:none}
.mapctl .wideonly{display:none}
nav .railonly{display:none}
.maptip{position:absolute;right:8px;bottom:8px;max-width:calc(100% - 180px);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;pointer-events:none;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:5px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.lgbar{display:inline-block;width:90px;height:10px;border-radius:5px;vertical-align:middle}
.modes{margin-top:10px}
.seg.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg.scroll::-webkit-scrollbar{display:none}
@media (min-width:760px){.seg.scroll{flex-wrap:wrap}}
.seg.scroll .btn{flex:none}
button.stat{font:inherit;font-weight:700;background:none;border:0;padding:2px 5px;margin:-2px -5px;border-radius:8px;color:var(--ink);cursor:pointer}
button.stat:hover{background:var(--line)}
.endbar{gap:8px}
.endbar .btn.adv{width:auto;flex:none;min-width:58px;padding:0 16px}
/* charts: 2px lines, 10% area wash, recessive hairline grid; the tooltip is the hover layer */
.chartbox{position:relative;margin:4px 0 2px;outline-offset:4px}
.chartbox svg{display:block;width:100%;overflow:visible}
.chartbox .grid{stroke:var(--line);stroke-width:1}
.chartbox text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chartbox text.end{fill:var(--ink);font-weight:700;font-size:12px}
.chartbox .xh{stroke:var(--muted);stroke-width:1}
.ckeys{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin:2px 0 4px}
.ckeys span{display:inline-flex;align-items:center;gap:6px}
.ckeys i,.ctip i{display:inline-block;width:14px;height:2px;border-radius:1px}
.ctip{position:absolute;top:0;pointer-events:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:6px 9px;font-size:.78rem;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap;z-index:2}
.ctip .tr{display:flex;align-items:center;gap:6px}
.ctip .tt{color:var(--muted);margin-bottom:2px}
details.tbl{margin:6px 0 0;font-size:.85rem}
details.tbl summary{cursor:pointer;color:var(--muted)}
details.tbl table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details.tbl th,details.tbl td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--line)}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
.lg i.o-me{background:var(--grass)}.lg i.o-norvik{background:var(--o-norvik)}.lg i.o-solenne{background:var(--o-solenne)}.lg i.o-aurelia{background:var(--o-aurelia)}.lg i.o-wild{background:var(--o-wild)}
.front{position:relative;height:12px;border-radius:6px;margin:8px 0 4px;background:linear-gradient(90deg,var(--bad),var(--line) 50%,var(--good))}
.front i{position:absolute;top:-4px;width:6px;height:20px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}

/* wide screens (unfolded phone, tablet, computer): map on the left, panel on the right */
@media (min-width:760px){
  :root{--side:clamp(300px,34vw,440px);--rail:68px}
  body{overflow:hidden}
  .app{max-width:none;padding:0;height:100vh;height:100dvh;display:flex;flex-direction:column;margin-right:var(--rail)}
  /* one-row header: name and date, then the numbers, then the icons */
  header{position:static;margin:0;padding:6px 14px;display:flex;align-items:center;gap:18px}
  header .top{display:contents}
  header .flag{order:1;flex:none;max-width:32%}
  header .bar{order:2;flex:1;margin-top:0}
  header #net,header .icon{order:3}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--side)}
  body.nopanel .main{grid-template-columns:minmax(0,1fr) 0}
  body.nopanel #view{display:none}
  .mappane,body.on-isle .mappane{display:flex;flex-direction:column;min-height:0;padding:8px;border-right:1px solid var(--line)}
  .mapwrap{flex:1;height:auto;min-height:0;margin-top:0}
  .mapctl .wideonly{display:block}
  #view{overflow:auto;padding:0 16px 24px;overscroll-behavior:contain}
  /* the tab bar becomes a slim strip down the right edge, with End month at the bottom */
  .endbar{display:none}
  nav{top:0;bottom:0;left:auto;right:0;width:var(--rail);border-top:0;border-left:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
  nav div{flex-direction:column;height:100%;max-width:none;gap:2px}
  nav button{flex:none;padding:7px 2px;font-size:.72rem;text-align:center;line-height:1.15}
  nav .railonly{display:flex}
  nav .railonly.first{margin-top:auto}
  nav .railonly.end{background:var(--deep);color:var(--deep-ink);font-weight:700;border-radius:14px;margin:4px 6px 0}
  .toast{left:calc(100% - var(--rail) - var(--side)/2)}
  body.nopanel .toast{left:calc((100% - var(--rail))/2)}
  .overlay{justify-content:flex-end;align-items:stretch;background:rgba(10,25,28,.2);right:var(--rail)}
  .sheet{width:var(--side);max-width:var(--side);max-height:none;height:100%;border-radius:0;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <div class="flag"><h1 id="name"></h1><div class="sub" id="when"></div></div>
      <span id="net" class="tag" hidden>Offline</span>
      <button class="icon" data-act="legacy" aria-label="Legacy and milestones">🏆</button>
      <button class="icon" data-act="news" aria-label="News">📰</button>
      <button class="icon" data-act="settings" aria-label="Settings">⚙️</button>
    </div>
    <div class="bar"><button class="stat" id="coins" data-act="goto" data-arg="econ" title="Treasury: open the economy"></button><button class="stat" id="pop" data-act="goto" data-arg="people" title="Population: open your people"></button><button class="stat" id="hap" data-act="why" data-arg="approval" title="What drives approval?"></button><button class="stat" id="leg" data-act="why" data-arg="legitimacy" title="What drives legitimacy?"></button></div>
  </header>
  <div class="main">
    <section class="mappane" aria-label="Map">
      <div class="mapwrap" id="mapwrap">
        <canvas class="cv" id="mapcv" tabindex="0" role="img" aria-label="Map of your kingdom and its neighbors. Arrow keys move the cursor, Enter selects, plus and minus zoom."></canvas>
        <div class="mapover"><div class="mapbar"><select id="modeSel" aria-label="Map mode"></select><button class="pill" id="legBtn" data-act="legend" aria-pressed="true">Key</button></div><div class="legend" id="legend"></div></div>
        <div class="maptip" id="maptip" aria-live="polite"></div>
        <div class="mapctl"><button data-act="zoom" data-arg="in" aria-label="Zoom in">+</button><button data-act="zoom" data-arg="out" aria-label="Zoom out">−</button><button data-act="zoom" data-arg="home" aria-label="Center on the capital">⌂</button><button data-act="maphelp" aria-label="How the map works">?</button><button class="wideonly" data-act="panel" id="panelBtn" aria-label="Hide the side panel" title="Hide or show the side panel">⤢</button></div>
        <canvas class="minimap" id="minimap" aria-hidden="true"></canvas>
      </div>
    </section>
    <main id="view"></main>
  </div>
</div>
<div class="endbar"><button class="btn primary" data-act="endMonth" id="endBtn">End month</button><button class="btn primary adv" data-act="advance" aria-label="Advance until something happens" title="Keep ending months until something needs you (up to a year)">⏩</button></div>
<nav><div id="nav">
  <button data-act="tab" data-arg="isle"><span>🗺️</span>Map</button>
  <button data-act="tab" data-arg="people"><span>👥</span>People</button>
  <button data-act="tab" data-arg="court"><span>👑</span>Court</button>
  <button data-act="tab" data-arg="econ"><span>🪙</span>Economy</button>
  <button data-act="tab" data-arg="world"><span>🌍</span>World</button>
  <button data-act="tab" data-arg="tech"><span>🔬</span>Research</button>
  <button class="railonly first adv" data-act="advance" aria-label="Advance until something happens" title="Keep ending months until something needs you (up to a year)"><span>⏩</span>Advance</button>
  <button class="railonly end" data-act="endMonth"><span>⏭️</span>End month</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="overlay" id="sheetWrap"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="conWrap"><div class="sheet con" role="dialog" aria-modal="true" aria-label="Developer console">
  <h3>Developer console</h3>
  <pre class="log" id="log"></pre>
  <div class="btns">
    <button class="btn" data-act="cmd" data-arg="help">help</button>
    <button class="btn" data-act="cmd" data-arg="add 10000">add 10000</button>
    <button class="btn" data-act="cmd" data-arg="skip 12">skip 12</button>
    <button class="btn" data-act="cmd" data-arg="unlock">unlock</button>
    <button class="btn" data-act="cmd" data-arg="status">status</button>
    <button class="btn" data-act="lastCmd" aria-label="Repeat last command">↑ last</button>
  </div>
  <div class="conin"><input id="conIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a command"><button class="btn primary" data-act="runCon">Run</button></div>
  <div class="btns" id="conSug" aria-label="Suggestions"></div>

const MNAMES={m:['Aldric','Edmund','Leopold','Frederick','Casimir','Otto','Henrik','Albert','Rupert','Conrad'],f:['Adelaide','Mathilde','Sophia','Charlotte','Beatrice','Eleanor','Isolde','Augusta','Theresa','Margarethe']};
const TRAITS={diligent:{n:'Diligent',d:'Tax income +10%.'},pious:{n:'Pious',d:'The clergy approve, and legitimacy +3.'},reformer:{n:'Reformer',d:'Laws pass in 4 months instead of 6.'},frugal:{n:'Frugal',d:'Building upkeep −10%, and court life 20% cheaper.'},charismatic:{n:'Charismatic',d:'Legitimacy +6.'},scholarly:{n:'Scholarly',d:'Research +25%.'},cautious:{n:'Cautious',d:'Unrest builds 30% more slowly.'}};
function newRoyal(minAge,maxAge){const g=Math.random()<.5?'m':'f';return{name:pick(MNAMES[g]),g,age:minAge+rnd(maxAge-minAge+1)}}
const title=m=>m.g==='f'?'Queen':'King';
const regnal=name=>1+(S.reigns||[]).filter(r=>r.name===name).length;
const trait=k=>S.monarch&&S.monarch.trait===k;

/* ---------- royal family ---------- */
// S.fam = {spouse, kids, heirId, next, tryMore}. A spouse is {name,g,age,from}, where from is a nation id or 'noble'.
// A child is {id,name,g,age,trait,spouse,role,gov,rival}: role is null, 'gov' (governing province gov), 'general' or 'abroad' (married into a foreign house).
// S.heir isn't saved: it always reads the chosen heir, or the eldest child if none is chosen.
const NOHEIR={name:'nobody',g:'m',age:0,none:true};
const kids=()=>S.fam?S.fam.kids:[];
const kidById=id=>kids().find(k=>k.id===id);
const eldest=()=>kids().slice().sort((a,b)=>b.age-a.age||a.id-b.id)[0]||null;
function heirOf(st){const f=st.fam;if(!f||!f.kids.length)return null;return f.kids.find(k=>k.id===f.heirId)||f.kids.slice().sort((a,b)=>b.age-a.age||a.id-b.id)[0]}
function bindHeir(st){const d=Object.getOwnPropertyDescriptor(st,'heir');if(d&&d.get)return;delete st.heir;Object.defineProperty(st,'heir',{get:()=>heirOf(st)||NOHEIR,set(){},configurable:true,enumerable:false})}
const royalT=k=>k.g==='f'?'Princess':'Prince';
const kidName=k=>`${royalT(k)} ${k.name}`;
const isAdult=k=>k.age>=16;
const atHome=k=>k.role!=='abroad';
function royalName(g,taken){let n=pick(MNAMES[g]);for(let t=0;t<12&&taken.has(n);t++)n=pick(MNAMES[g]);return n}
// a spouse's name avoids anyone already in the family
function newSpouse(ofG,age,from,want){const g=want||(ofG==='f'?'m':'f'),taken=new Set();
  if(typeof S!=='undefined'&&S&&S.fam){taken.add(S.monarch.name);(S.pastSp||[]).forEach(n=>taken.add(n));if(S.fam.spouse)taken.add(S.fam.spouse.name);S.fam.kids.forEach(k=>{taken.add(k.name);if(k.spouse)taken.add(k.spouse.name)})}
  const pool=RNAMES[from]||(OVP[from]&&OVP[from].hn);let nm=pool?pick(pool[g]):royalName(g,taken);if(pool)for(let t=0;t<8&&taken.has(nm);t++)nm=pick(pool[g]);
  return{name:nm,g,age:Math.max(16,age),from}}
// a starting family: a local noble spouse and 1–3 children, the eldest aged 6–12
function makeFamily(mo){const f={spouse:newSpouse(mo.g,mo.age-3+rnd(7),'noble'),kids:[],heirId:null,next:1,tryMore:false},taken=new Set([mo.name]);
  let age=6+rnd(7);const n=1+rnd(3);for(let k=0;k<n&&age>=0;k++){const g=Math.random()<.5?'m':'f',name=royalName(g,taken);taken.add(name);f.kids.push({id:f.next++,name,g,age,trait:pick(Object.keys(TRAITS))});age-=2+rnd(3)}
  return f}
function addKid(age,g){const f=S.fam;g=g||(Math.random()<.5?'m':'f');const k={id:f.next++,name:royalName(g,new Set(kids().map(x=>x.name).concat(S.monarch.name))),g,age:age||0,trait:pick(Object.keys(TRAITS))};f.kids.push(k);return k}
// every nation your family has married into
const marriedTo=()=>{const s=new Set(),f=S.fam;if(f&&f.spouse&&NATIONS[f.spouse.from])s.add(f.spouse.from);kids().forEach(k=>{if(k.spouse&&NATIONS[k.spouse.from])s.add(k.spouse.from)});return[...s]};
// a child leaving the family (death or exile) gives up any post
function removeKid(k,how){const f=S.fam;cadetFounderGone(k,how);if(how){f.gone=(f.gone||[]).concat({name:kidName(k),age:k.age,y:S.year,how}).slice(-6)}if(k.role==='office')clearRole(k);if(k.role==='gov'&&S.prov[k.gov])delete S.prov[k.gov].gov;if(S.general&&S.general.kid===k.id)S.general=null;if(f.heirId===k.id)f.heirId=null;f.kids=f.kids.filter(x=>x!==k)}
function clearRole(k){if(k.role==='office'){const o=hh().offices[k.office];if(o&&o.kid===k.id)delete hh().offices[k.office];delete k.office}if(k.role==='gov'&&S.prov[k.gov])delete S.prov[k.gov].gov;if(k.role==='general'&&S.general&&S.general.kid===k.id)S.general=null;k.role=null;delete k.gov}
// older saves had a single heir: they become the first child, with a noble spouse for the monarch
function famFromOld(d){const m=d.monarch||S.monarch,f={spouse:m.spouse?newSpouse(m.g,m.age,m.spouse):newSpouse(m.g,m.age-2,'noble'),kids:[],heirId:null,next:2,tryMore:false};
  if(d.heir&&d.heir.name){const h=d.heir;f.kids.push({id:1,name:h.name,g:h.g,age:h.age,trait:pick(Object.keys(TRAITS)),spouse:h.spouse?newSpouse(h.g,h.age,h.spouse):null})}
  return f}
/* ---------- royal house ---------- */
// S.house = {name, motto, arms:{f,t,o,ch}, ren, total, lg:{track:level}, hl:{heirloom:{y,who}}, cd:{activity:months}, legend, legends}.
// The family's deeds earn renown, which buys house legacies: lasting perks that outlive every monarch.
// Children aged 6–15 can have a tutor, who may shape their trait at 16.
const HNAMES=['Ashford','Blackmoor','Cresthaven','Dunmere','Everly','Fairhollow','Greywater','Harrow','Ironwood','Lindmark','Marlowe','Northcliff','Oakheart','Pennrick','Ravenscar','Stormhold','Thornbury','Valemont','Whitcombe','Wyndham'];
const MOTTOS=['Steadfast in all things','By the sea, for the crown','We hold','Ever upward','Honor before gold','The tide returns','From stone, strength','Loyal to the last','Patience wins kingdoms','Our word is iron','A light in the storm','Our roots run deep','Sword and plough','Wisdom guides the hand','Faith and fire','Nothing without toil'];
// heraldic colors: a metal always sits on a color, or a color on a metal
const METALS=['#E2B33C','#EDEDE6'],COLORS=['#B22D2D','#2B5BA8','#2E7D4F','#6B3A87','#2A2A2A'],TINCTS=[...COLORS,...METALS];
const TNAMES={'#E2B33C':'Gold','#EDEDE6':'Silver','#B22D2D':'Red','#2B5BA8':'Blue','#2E7D4F':'Green','#6B3A87':'Purple','#2A2A2A':'Black'};
const ORDS=['plain','pale','fess','bend','cross','saltire','chevron','quarterly'];
const CHARGES=['🦁','🦅','🐉','🌹','⚜️','⭐','🌙','🐺','🦌','🌲','⚓','🗝️','🐻','🐟','🏰','👑',''];
const isMetal=c=>METALS.includes(c);
function randArms(){const f=pick(TINCTS);return{f,t:pick(isMetal(f)?COLORS:METALS),o:pick(ORDS),ch:Math.random()<.8?pick(CHARGES.filter(Boolean)):''}}
function newHouse(){return{name:pick(HNAMES),motto:pick(MOTTOS),arms:randArms(),ren:0,total:0,lg:{},hl:{},cd:{},legend:null,legends:[]}}
function house(){const H=S.house||(S.house=newHouse());H.hl=H.hl||{};H.cd=H.cd||{};H.legends=H.legends||[];H.lg=H.lg||{};return H}
let armsN=0;
function armsSVG(a,w){const id='sh'+(++armsN),t=a.t,s=`stroke="${t}"`;
  const o={pale:`<rect x="36" y="0" width="28" height="120" fill="${t}"/>`,fess:`<rect x="0" y="40" width="100" height="28" fill="${t}"/>`,
    bend:`<line x1="0" y1="0" x2="100" y2="120" ${s} stroke-width="24"/>`,cross:`<rect x="39" y="0" width="22" height="120" fill="${t}"/><rect x="0" y="42" width="100" height="22" fill="${t}"/>`,
    saltire:`<line x1="0" y1="0" x2="100" y2="120" ${s} stroke-width="18"/><line x1="100" y1="0" x2="0" y2="120" ${s} stroke-width="18"/>`,
    chevron:`<polyline points="-5,100 50,42 105,100" fill="none" ${s} stroke-width="20"/>`,quarterly:`<rect x="0" y="0" width="50" height="58" fill="${t}"/><rect x="50" y="58" width="50" height="62" fill="${t}"/>`}[a.o]||'';
  const P='M6 6H94V56C94 88 72 106 50 115C28 106 6 88 6 56Z';
  return`<svg class="arms" width="${w}" height="${Math.round(w*1.2)}" viewBox="0 0 100 120" role="img" aria-label="Coat of arms"><defs><clipPath id="${id}"><path d="${P}"/></clipPath></defs><g clip-path="url(#${id})"><rect width="100" height="120" fill="${a.f}"/>${o}</g>${a.ch?`<text x="50" y="${a.o==='fess'||a.o==='cross'?64:68}" font-size="40" text-anchor="middle" dominant-baseline="middle">${a.ch}</text>`:''}<path d="${P}" fill="none" stroke="#8a7550" stroke-width="4"/></svg>`}

/* legacies: five tracks of three perks, bought in order with renown */
const LEGACY={
  war:{n:'Warfare',e:'⚔️',p:[{n:'Martial tradition',d:'Army quality +5%.'},{n:'Blood of captains',d:'Army quality +10% more while a prince or princess leads the army.'},{n:'Conquerors',d:'Provinces integrate 50% faster.'}]},
  stew:{n:'Stewardship',e:'🌾',p:[{n:'Careful accounts',d:'Tax income +3%.'},{n:'Crown lands',d:'Royal estates earn 25% more.'},{n:'Builders of the realm',d:'Building upkeep −8%.'}]},
  blood:{n:'Blood',e:'👑',p:[{n:'A fruitful line',d:'Royal births are a third more likely.'},{n:'Born to rule',d:'Royal children hold court offices with one more star.'},{n:'Divine right',d:'Legitimacy +4, and a new reign costs half as much legitimacy.'}]},
  kin:{n:'Kinship',e:'🕊️',p:[{n:'Sought-after matches',d:'Royal weddings cost half as much.'},{n:'Envoys of the blood',d:'Envoys are 20% more effective.'},{n:'Family of nations',d:'A foreign match brings a province as dowry half the time, instead of 30%.'}]},
  learn:{n:'Learning',e:'📚',p:[{n:'Patrons of scholars',d:'Research +5%.'},{n:'Royal tutors',d:'Tutors are a quarter more likely to shape a child.'},{n:'A learned house',d:'Research +10% more, and the intelligentsia +5.'}]}};
const LEGCOST=[150,350,700];
const lg=(k,n)=>((S.house&&S.house.lg&&S.house.lg[k])||0)>=n;
function addRen(n){const H=house();H.ren+=n;H.total+=n}

/* heirlooms: won through activities or commissioned, and kept by the house for good */
const HEIRLOOMS={
  crown:{n:'The ancestral crown',e:'👑',d:'Legitimacy +2.',buy:{c:2000,r:100}},
  tapestry:{n:'The great tapestry',e:'🧵',d:'The landowners +4.',buy:{c:1200,r:60}},
  chronicle:{n:'The house chronicle',e:'📜',d:'Research +3%.',buy:{c:1200,r:60}},
  sword:{n:'The champion’s sword',e:'🗡️',d:'Army quality +3%.',src:'Can be won at a tournament.'},
  antlers:{n:'Antlers of the white stag',e:'🦌',d:'Renown +0.5 a month.',src:'Can be taken on a royal hunt.'},
  relic:{n:'A holy relic',e:'🏺',d:'The clergy +5.',src:'Can be brought home from a pilgrimage.'}};
const hlHas=k=>!!(S.house&&S.house.hl&&S.house.hl[k]);
function gainHeirloom(k){house().hl[k]={y:S.year,who:monarchName(S.monarch)};return` ${HEIRLOOMS[k].e} The house gains an heirloom: ${HEIRLOOMS[k].n}.`}

/* legends: one per reign; it lasts for the rest of that reign, and is remembered afterwards */
const LEGENDS={heroic:{n:'heroic',e:'⚔️',d:'Army quality +3%.'},holy:{n:'holy',e:'✨',d:'The clergy +5.'},wise:{n:'wise',e:'🦉',d:'The intelligentsia +5.'}};
const LEGEND_COST={c:1000,r:50};
const legendWord=()=>era()<2?'legend':era()<3?'biography':'film';
const legendOn=k=>{const L=S.house&&S.house.legend;return!!L&&L.reign===(S.reigns||[]).length&&(!k||L.k===k)};

/* renown each month: a base, high legitimacy, royals serving or married abroad, a grand court, heirlooms and legends */
function renownParts(){const serve=kids().filter(k=>['gov','office','general'].includes(k.role)).length,abroad=kids().filter(k=>k.role==='abroad').length,H=S.house||{};
  return[['The house endures',1.5],[`Legitimacy ${S.leg}`,Math.max(0,Math.floor((S.leg-50)/10))],['Royals serving the realm',serve*.5],['Royals married abroad',abroad*.5],[`${COURT[S.court].n} court`,Math.max(0,S.court-2)*.5],
    ['Antlers of the white stag',hlHas('antlers')?.5:0],[`A ${legendWord()} of the reign`,legendOn()?1:0],['Legends of past reigns',(H.legends||[]).length*.25],['The court chaplain sings the house’s praises',altS('chaplain')*.2],['Loyal cadet branches',cadets().filter(c=>c.loy>=60).length*.5],['A united house',unity()>=80?1:0]].filter(p=>p[1]>0)}
const renownRate=()=>renownParts().reduce((a,p)=>a+p[1],0);

/* tutors: the monarch, the consort, a court officer, or a hired scholar; each teaches a trait */
const TUTORCOST=15;
const spTrait=()=>{const sp=S.fam.spouse;if(!sp)return null;if(!sp.trait)sp.trait=pick(Object.keys(TRAITS));return sp.trait};
function tutorInfo(key){if(key==='monarch')return{n:monarchName(S.monarch),e:'👑',teach:[S.monarch.trait],skill:3,ok:true};
  if(key==='consort'){const sp=S.fam.spouse;return{n:sp?sp.name+', the consort':'The consort',e:'💑',teach:sp?[spTrait()]:[],skill:3,ok:!!sp}}
  if(key==='scholar')return{n:'A hired scholar',e:'🎓',teach:['scholarly'],skill:4,ok:true,cost:TUTORCOST};
  const O=OFFICES[key];if(!O)return null;const s=officeSkill(key),o=hh().offices[key];
  return{n:`The ${O.n.toLowerCase()}${s?`, ${o.kid!=null?kidName(kidById(o.kid)):o.name}`:''}`,e:O.e,teach:O.fit,skill:s,ok:s>0}}
const TUTORKEYS=()=>['monarch','consort',...Object.keys(OFFICES),'scholar'];
const tutorChance=(T,months)=>Math.min(.95,(.25+.12*T.skill)*Math.min(1,months/48)*(lg('learn',2)?1.25:1));
const tutored=()=>kids().filter(k=>k.tutor&&k.age<16);

/* activities: feasts, hunts, tournaments and pilgrimages, each an event with choices */
const ACTS={
  feast:{get n(){return era()<2?'Royal feast':'State banquet'},e:'🍷',c:400,cd:12,r:15,d:'Legitimacy +2 for a year, and a chance to win back a resentful royal.'},
  hunt:{n:'Royal hunt',e:'🦌',c:250,cd:12,r:10,d:'A day’s sport, with a small chance of a legendary trophy.'},
  tourney:{get n(){return era()<2?'Tournament':era()<3?'Royal regatta':'Royal games'},e:'🏇',c:800,cd:24,r:20,d:'A royal champion may win glory, and perhaps a famous prize.'},
  pilgrim:{get n(){return era()<2?'Pilgrimage':'Royal tour'},e:'🙏',c:300,cd:24,r:10,get d(){return era()<2?'The clergy are pleased, and a holy relic may come home with you.':'The monarch tours the provinces: approval rises for a while.'}}};
function actEvent(key){const A=ACTS[key],m=S.monarch,ad=kids().filter(k=>isAdult(k)&&atHome(k));
  if(key==='feast'){const r=kids().filter(k=>k.rival&&isAdult(k)&&atHome(k));
    return{e:A.e,t:`The ${A.n.toLowerCase()}`,d:'The great hall is full. Where the guests sit will be remembered.',ch:[
      {l:'Honor the landowners',f(){igM('landowners',8,12,'Royal feast');return'The old families feel valued.'}},
      {l:'Seat the merchants beside them',f(){igM('merchants',6,12,'Royal feast');igM('landowners',3,12,'Royal feast');return'New money and old money share a table.'}},
      ...(r.length?[{l:`Seat ${kidName(r[0])} at your side`,f(){if(Math.random()<.6){r[0].rival=false;return`${kidName(r[0])} is touched, and the old grievance fades.`}return`${kidName(r[0])} is polite, but still resentful.`}}]:[])]}}
  if(key==='hunt')return{e:A.e,t:'The royal hunt',d:'The hounds pick up the trail of a great white stag, deep in the royal forest.',ch:[
    {l:'Chase the white stag',f(){if(dramaOn()&&Math.random()<.06){addMod('leg',-2,6,'The monarch was hurt hunting');return`${monarchName(m)} is thrown from the saddle, and spends weeks recovering.`}
      if(!hlHas('antlers')&&Math.random()<.15)return'After a long chase, the stag is taken.'+gainHeirloom('antlers');addRen(5);return'The stag escapes, but it was a fine day’s sport. 🏅+5.'}},
    {l:'Keep to a safe day’s sport',f(){addMod('leg',1,6,'Royal hunt');return'A pleasant day, and a good dinner.'}}]};
  if(key==='tourney'){const champ=[...ad.map(k=>({nm:kidName(k),k})),...(m.age<45?[{nm:monarchName(m),k:null}]:[])];
    const run=(nm,k,p)=>()=>{if(Math.random()<p){addRen(25);addMod('leg',3,12,`${nm} wins the ${A.n.toLowerCase()}`);let s=`${nm} wins! The crowd roars. 🏅+25.`;if(!hlHas('sword')&&Math.random()<.35)s+=gainHeirloom('sword');return s}
      if(k&&dramaOn()&&Math.random()<.08)return`${nm} is wounded, though not badly, and loses.`;return`${nm} does well, but loses in the final rounds.`};
    return{e:A.e,t:`The ${A.n.toLowerCase()}`,d:'Competitors from every corner of the island have come. Who will carry the royal colors?',ch:[
      ...champ.slice(0,3).map(c=>({l:`${c.nm} competes`,f:run(c.nm,c.k,c.k?.35:.3)})),
      {l:'Sponsor a champion',f:run('The royal champion',null,.25)}]}}
  return{e:A.e,t:`The ${A.n.toLowerCase()}`,d:era()<2?'The royal party sets out for the great shrine.':'The royal party sets out across the provinces.',ch:[
    {l:'Travel humbly',f(){if(era()<2){igM('clergy',10,12,'Royal pilgrimage');if(!hlHas('relic')&&Math.random()<.15)return'The faithful are moved by your humility.'+gainHeirloom('relic');return'The faithful are moved by your humility.'}addMod('hap',2,6,'Royal tour');return'Crowds turn out along the way.'}},
    {l:'Travel in state',c:200,f(){addMod('leg',2,12,era()<2?'A splendid pilgrimage':'A splendid royal tour');if(era()<2)igM('clergy',5,12,'Royal pilgrimage');else addMod('hap',1,6,'Royal tour');return'The splendor of the procession is talked about for months.'}}]}}

/* pretenders: exiled or resentful royals with a claim; their support grows while legitimacy is low */
// S.pret = [{name,g,age,sup,why}]
function addPret(name,g,age,sup,why){S.pret=S.pret||[];if(S.pret.length>=3||S.pret.some(p=>p.name===name))return;S.pret.push({name,g,age,sup,why})}
function pretMonth(notes,stop){if(!S.pret||!S.pret.length)return;
  S.pret.forEach(p=>{p.sup=clamp(p.sup+(S.leg<50?(50-S.leg)/25:-.4)+(S.hap<35?(35-S.hap)/30:0)+(unity()<20?.2:0)+(S.drama==='lots'?.1:0),0,100);if(S.month===0)p.age++});
  S.pret=S.pret.filter(p=>{if(p.age>55&&Math.random()<Math.pow(p.age-55,2)/40000){notes.push(['🕯️',`The pretender ${p.name} has died`,'Their claim dies with them.']);return false}
    if(p.sup<=0&&Math.random()<.03){notes.push(['🕊️',`The pretender ${p.name} gives up`,'With no one left to back them, they renounce their claim.']);return false}return true});
  const p=S.pret.find(p=>p.sup>=60);if(p&&!S.war&&Math.random()<.04&&!queue.some(e=>e.id==='pretender'))queue.push(pretEvent(p))}
function pretEvent(p){const win=clamp(.35+(S.leg-40)/100+offT('marshal')*.05+(S.army-1)*.05,.2,.9),bribe=Math.round(p.sup*30);
  const gone=()=>{S.pret=(S.pret||[]).filter(x=>x!==p)};
  return{id:'pretender',e:'⚔️',t:`The pretender ${p.name} rises`,d:`${p.name}, ${p.why}, has raised supporters and demands the crown. Their support: ${Math.round(p.sup)}.`,ch:[
    {l:`Crush them (${Math.round(win*100)}% chance)`,f(){if(Math.random()<win){gone();addRen(15);addMod('leg',4,12,'Pretender defeated');return`The rising is crushed and ${p.name} is captured. 🏅+15.`}
      p.sup=40;addMod('leg',-10,24,'A pretender’s rising');S.unrest=Math.min(100,S.unrest+15);return`Your forces are routed. ${p.name} escapes to fight another day.`}},
    {l:'Buy them off',c:bribe,f(){gone();addMod('leg',-2,12,'Paid off a pretender');return`Gold and a quiet estate abroad persuade ${p.name} to renounce the claim.`}},
    {l:'Offer a pardon and a place at court',f(){gone();igM('landowners',-5,12,'Pardoned a pretender');addMod('leg',-3,12,'Pardoned a pretender');return`${p.name} kneels before the throne. Not everyone at court approves.`}}]}}

/* royal bastards (family drama on Lots): they can be legitimized with renown, and otherwise may one day press a claim */
const LEGIT_COST=100;
function bastEvent(){if(S.drama!=='lots'||!S.aging)return null;const m=S.monarch;if(m.age<20||m.age>60)return null;const g=Math.random()<.5?'m':'f',age=rnd(Math.min(12,m.age-18)),
    name=royalName(g,new Set(kids().map(x=>x.name).concat(m.name)));
  return{e:'🤫',t:'Whispers of a royal bastard',d:`Everyone at court is talking: ${monarchName(m)} is said to have a child, ${name}, aged ${age}, by a lady of the court.`,ch:[
    {l:'Acknowledge the child',f(){S.fam.bast=S.fam.bast||[];S.fam.bast.push({name,g,age});igM('clergy',-5,12,'A royal bastard');addMod('leg',-1,12,'A royal bastard');return`${name} is acknowledged, and raised in comfort away from court.`}},
    ...(house().ren>=LEGIT_COST?[{l:`Legitimize them (🏅${LEGIT_COST})`,f(){house().ren-=LEGIT_COST;const k=addKid(age,g);k.name=name;k.legit=1;igM('clergy',-8,12,'A bastard legitimized');igM('landowners',-4,12,'A bastard legitimized');addMod('leg',-2,12,'A bastard legitimized');return`${kidName(k)} joins the royal family, and can one day inherit.`}}]:[]),
    {l:'Deny everything',f(){if(Math.random()<.4){addMod('leg',-4,12,'Royal scandal');return'Nobody believes the denial. It’s a scandal.'}return'The rumors fade.'}}]}}

/* at a succession: the past reign's legend is remembered, and resentful siblings or bastards may become pretenders */
function houseSucceed(h,cousin,passed){const H=house();cadets().forEach(c=>{const k=c.kid!=null&&kidById(c.kid);if(k){c.kid=null;c.head={name:k.name,g:k.g,age:k.age}}});if(h&&h.cadet!=null){const c=cadetById(h.cadet);if(c){H.cadets=cadets().filter(x=>x!==c);provsOf('me').forEach(i=>{if(S.prov[i].app===c.id)delete S.prov[i].app});chron('🌿',`House ${c.name} rejoins the main line`,'Its head has taken the throne.')}}if(!cousin)addRen(10);
  if(H.legend){H.legends.push({k:H.legend.k,who:H.legend.who});H.legend=null}
  if(S.drama==='lots'){kids().forEach(k=>{if(k!==h&&k!==passed&&k.rival&&isAdult(k)&&atHome(k))addPret(k.name,k.g,k.age,15,`a resentful sibling of the new ${title(h).toLowerCase()}`)});
    (S.fam.bast||[]).forEach(b=>{if(b.age>=16&&Math.random()<.5)addPret(b.name,b.g,b.age,10,'a royal bastard')})}}

/* each month: renown, activity cooldowns, lessons, coming of age, and the chancellor's diplomacy */
function houseMonth(notes,stop){const H=house(),r=renownRate();H.ren+=r;H.total+=r;
  Object.keys(H.cd).forEach(k=>{H.cd[k]--;if(H.cd[k]<=0)delete H.cd[k]});
  if(S.month===0)(S.fam.bast||[]).forEach(b=>b.age++);
  const fa=altS('chancellor');if(fa)liveNations().forEach(n=>{relA(n,fa*.1);tenA(n,-fa*.1)});
  tutored().forEach(k=>{const T=tutorInfo(k.tutor);if(T&&T.ok&&k.age>=6)k.tm=(k.tm||0)+1});
  // coming of age: lessons may shape the child's trait
  kids().forEach(k=>{if(k.age<16||!k.tutor)return;stop.push(`${kidName(k)} comes of age`);const T=tutorInfo(k.tutor),ch=T&&T.teach.length?tutorChance(T,k.tm||0):0,was=k.trait;
    if(Math.random()<ch){const opts=T.teach.filter(x=>x!==was);k.trait=opts.length?pick(opts):was;k.edu=1;addRen(5);
      notes.push(['🎓',`${kidName(k)} comes of age`,`Taught by ${T.n.replace(/^The /,'the ')}, ${k.name} is now ${TRAITS[k.trait].n.toLowerCase()} and well educated.`])}
    else{k.edu=0;notes.push(['🎓',`${kidName(k)} comes of age`,`The lessons never quite took: ${k.name} remains ${TRAITS[was].n.toLowerCase()}.`])}
    delete k.tutor;delete k.tm})}

/* ---------- house unity, standing and cadet branches ---------- */
// S.house.unity (0–100), S.house.cadets = [{id,name,motto,arms,kid,head:{name,g,age},loy,since,favCd}]; a province held as an appanage has P.app = cadet id.
const UNITY=[[80,'United','🤝'],[60,'Harmonious','🙂'],[40,'Steady','😐'],[20,'Divided','😒'],[0,'Hostile','😠']];
const unity=()=>{const H=house();if(H.unity==null)H.unity=60;return H.unity};
const unityLvl=()=>UNITY.find(u=>unity()>=u[0]);
const unityA=v=>{const H=house();H.unity=clamp(Math.round((unity()+v)*10)/10,0,100)};
const cadets=()=>{const H=house();return H.cadets||(H.cadets=[])};
const cadetById=id=>cadets().find(c=>c.id===id);
const appanages=()=>provsOf('me').filter(i=>S.prov[i].app!=null&&cadetById(S.prov[i].app));
const APP_COST=40,CADET_COST=100,MAXCADETS=3;
// what pulls the family together or apart
function unityParts(){const K=kids().filter(k=>isAdult(k)&&atHome(k)),al=hh().allow,C=cadets();
  return[['A royal family',55],['Royals serving the realm',kids().filter(k=>['gov','office','general'].includes(k.role)).length*3],
    [`${(ALLOW[al]||ALLOW.fair).n} allowances`,al==='generous'?10:al==='modest'?-10:0],
    ['Resentful royals',-12*K.filter(k=>k.rival).length],
    ['Loyal cadet branches',4*C.filter(c=>c.loy>=60).length],['Disloyal cadet branches',-8*C.filter(c=>c.loy<30).length],
    ['Pretenders from the family',-6*(S.pret||[]).length]].filter(p=>p[1])}
const unityTarget=()=>clamp(unityParts().reduce((a,p)=>a+p[1],0),0,100);
// standing grows with all the renown the house has ever earned
const STAND=[{n:'Minor',r:0},{n:'Noble',r:500},{n:'Illustrious',r:2000},{n:'Great',r:5000},{n:'Legendary',r:12000}];
const standTier=()=>{const t=(S.house&&S.house.total)||0;let i=0;STAND.forEach((s,k)=>{if(t>=s.r)i=k});return{i,...STAND[i],next:STAND[i+1]||null,leg:i}};
const ovMarryNeed=()=>50-standTier().i*5;
// a cadet branch: a new house name, and the royal arms with a new emblem (a mark of cadency)
function newCadet(k){const H=house(),used=new Set([H.name,...cadets().map(c=>c.name)]);let nm=pick(HNAMES);for(let t=0;t<20&&used.has(nm);t++)nm=pick(HNAMES);
  const ch=CHARGES.filter(x=>x&&x!==H.arms.ch);const c={id:(H.cadNext=(H.cadNext||0)+1),name:nm,motto:pick(MOTTOS),arms:{...H.arms,ch:pick(ch)},kid:k.id,head:{name:k.name,g:k.g,age:k.age},loy:65,since:S.year,favCd:0};
  cadets().push(c);k.cadet=c.id;return c}
const cadetHead=c=>{const k=c.kid!=null?kidById(c.kid):null;return k?kidName(k):`${c.head.g==='f'?'Lady':'Lord'} ${c.head.name}`};
function cadetLoyTarget(c){return clamp(50+(appanages().some(i=>S.prov[i].app===c.id)?15:0)+(unity()-50)/2+(c.kid!=null&&kidById(c.kid)&&kidById(c.kid).rival?-20:0),0,100)}
// each month: unity drifts, branch loyalty drifts, heads age and pass on, and a disloyal branch may press a claim
function unityMonth(notes,stop){const H=house();H.unity=Math.round((unity()+(unityTarget()-unity())*.05)*10)/10;
  cadets().forEach(c=>{c.loy=Math.round((c.loy+(cadetLoyTarget(c)-c.loy)*.04)*10)/10;if(c.favCd)c.favCd--;
    if(c.kid!=null&&!kidById(c.kid))c.kid=null;
    if(c.kid==null){if(S.month===0)c.head.age++;if(c.head.age>55&&Math.random()<Math.pow(c.head.age-55,2)/40000){const old=c.head.name,g=Math.random()<.5?'m':'f';c.head={name:royalName(g,new Set([old])),g,age:Math.max(18,c.head.age-28)};
      notes.push(['🕯️',`The head of House ${c.name} has died`,`${old} is succeeded by ${cadetHead(c)}.`])}}
    if(c.loy<25&&S.drama==='lots'&&Math.random()<.01&&(S.pret||[]).length<3){addPret(c.head.name,c.head.g,c.head.age,30,`head of the cadet House ${c.name}`);const t=`House ${c.name} claims the throne`;notes.push(['🗡️',t,`The disloyal cadet branch now backs its own head as rightful ruler.`]);stop.push(t)}})}

function cadetFounderGone(k,how){const c=k.cadet!=null&&cadetById(k.cadet);if(!c)return;c.kid=null;const g=Math.random()<.5?'m':'f';

  if(bad.length&&S.drama==='lots'&&Math.random()<.4){const c=pick(bad);return{e:'🗡️',t:`House ${c.name} plots`,d:`Your spies report that the cadet House ${c.name}, led by ${cadetHead(c)}, is gathering support against the crown.`,ch:[
    {l:'Strip them of rank',f(){house().cadets=cadets().filter(x=>x!==c);provsOf('me').forEach(i=>{if(S.prov[i].app===c.id)delete S.prov[i].app});const k=c.kid!=null&&kidById(c.kid);if(k){delete k.cadet;k.rival=true}unityA(-15);igM('landowners',-5,12,'A royal branch disgraced');return`House ${c.name} is dissolved and its lands return to the crown. The family is shaken.`}},
    {l:'Buy their loyalty',c:800,f(){c.loy=Math.min(100,c.loy+25);return`Gifts and honors quiet House ${c.name}, for now.`}}]}}
  if(C.length>=2&&Math.random()<.3){const [a,b]=C.slice().sort(()=>Math.random()-.5);return{e:'⚔️',t:`Houses ${a.name} and ${b.name} feud`,d:'Two branches of the royal house are quarrelling over precedence at court, and the whole family is taking sides.',ch:[
    {l:'Mediate between them',c:300,f(){unityA(5);return'A formal reconciliation is staged. The family breathes again.'}},
    {l:'Let them settle it',f(){unityA(-8);a.loy-=5;b.loy-=5;return'The feud drags on, souring every family gathering.'}}]}}
  if(lo.length){const c=pick(lo);return{e:'🎖️',t:`House ${c.name} seeks greater honors`,d:`${cadetHead(c)}, head of the cadet House ${c.name}, asks for a grander title and a place of honor at court.`,ch:[
    ...(house().ren>=50?[{l:'Grant a grander title (🏅50)',f(){house().ren-=50;c.loy=Math.min(100,c.loy+20);unityA(3);return`House ${c.name} is delighted with its new dignity.`}}]:[]),
    {l:'Refuse',f(){c.loy=Math.max(0,c.loy-15);return`House ${c.name} bows, but the slight is remembered.`}}]}}
  return null}

function autoResolve(r){const W_=S.war;

let peaceSel=[],genCands=[];

let peaceSel2=0;

  if(sc>10){const opts=ourTermOptions(),used=peaceSel.reduce((a,k)=>a+termCost(k),0);
    openSheet(`<h3>🕊️ Your peace terms</h3><p class="hint">Your war score of ${sc} lets you demand up to ${sc} points. Pick your terms. Occupied provinces and your war goal can be claimed.</p><div class="card">${opts.map(k=>{const on=peaceSel.includes(k),cost=termCost(k);return `<div class="row"><div class="grow"><b>${termLabel(k)}</b><small>${cost} points</small></div><button class="btn ${on?'primary':''}" data-act="term" data-arg="${k}" ${!on&&used+cost>sc?'disabled':''}>${on?'Selected':'Add'}</button></div>`}).join('')}</div>

function embargoNow(n){S.embargo[n]=12;S.tension[n]=60;relA(n,-20);return`${NATIONS[n].n} breaks off trade and imposes an embargo for a year.`}

/* ---------- living neighbors ---------- */
// S.rulers[n] = {name,g,age,pers,since,heir:{name,g,age}|null}; S.nrel['a|b'] = relations between two neighbors;

const PERS={aggressive:{n:'Aggressive',e:'⚔️',d:'Quick to make demands and start wars.'},cautious:{n:'Cautious',e:'🛡️',d:'Slow to anger and reluctant to fight.'},
  greedy:{n:'Greedy',e:'💰',d:'Always after a better deal, and prone to ultimatums.'},honorable:{n:'Honorable',e:'🤝',d:'Keeps their word and stands by allies.'}};
const RNAMES={norvik:{m:['Harald','Sigurd','Eirik','Olav','Magnus','Leif','Ragnar','Torvald'],f:['Astrid','Ingrid','Sigrid','Freya','Helga','Solveig','Ragnhild','Thyra']},

function newRuler(n,minA,maxA){const g=Math.random()<.5?'m':'f';return{name:pick(RNAMES[n][g]),g,age:minA+rnd(maxA-minA+1),pers:pick(Object.keys(PERS)),since:typeof S!=='undefined'&&S?S.year:1}}
function newHeir(n,age,avoid){if(age<22)return null;const g=Math.random()<.5?'m':'f';let nm=pick(RNAMES[n][g]);for(let t=0;t<8&&nm===avoid;t++)nm=pick(RNAMES[n][g]);return{name:nm,g,age:Math.max(0,age-20-rnd(12))}}
function rulers(){if(!S.rulers){S.rulers={};NIDS.forEach(n=>{const r=newRuler(n,30,55);r.heir=newHeir(n,r.age,r.name);S.rulers[n]=r})}return S.rulers}
const ruler=n=>rulers()[n];
const pers=(n,k)=>ruler(n).pers===k;
const rTitle=r=>r.g==='f'?'Queen':'King';
const rName=n=>`${rTitle(ruler(n))} ${ruler(n).name}`;
const nkey=(a,b)=>a<b?a+'|'+b:b+'|'+a;
function nrel(a,b){S.nrel=S.nrel||{};const k=nkey(a,b);if(S.nrel[k]==null)S.nrel[k]=40+rnd(21);return S.nrel[k]}
function nrelA(a,b,v){const k=nkey(a,b);S.nrel[k]=clamp(Math.round((nrel(a,b)+v)*10)/10,0,100)}
const pact=n=>{const p=(S.pacts||{})[n];return p&&p.until>S.turn?p:null};
const allied=n=>{const p=pact(n);return!!p&&p.t==='ally'};
const nwars=()=>S.nwars||(S.nwars=[]);
const nwarOf=n=>nwars().find(w=>w.a===n||w.b===n);
const nBorder=(a,b)=>provsOf(a).some(i=>adjProvs(i).some(j=>S.prov[j].o===b));
// a war goal against n: one of their provinces next to yours, or any of theirs
const goalAgainst=n=>{const o=provsOf(n),b=o.filter(i=>adjProvs(i).some(j=>S.prov[j].o==='me'));return b.length?pick(b):pick(o)};
function breakPact(n,why){const p=pact(n);if(!p)return;delete S.pacts[n];relA(n,-25);if(why==='attack'){addMod('leg',p.t==='ally'?-10:-6,24,`Broke a treaty with ${NATIONS[n].n}`);liveNations().filter(o=>o!==n).forEach(o=>relA(o,-10))}
  chron('📜',`The treaty with ${NATIONS[n].n} is broken`,why==='attack'?'The crown turned on its own treaty partner.':'')}

/* each month: rulers age, die and are succeeded; personalities shape tension; neighbors fight each other; proposals arrive */
function succeedNation(n,notes,stop){const old=ruler(n),h=old.heir,r=h?{name:h.name,g:h.g,age:h.age,pers:pick(Object.keys(PERS)),since:S.year}:newRuler(n,25,45);

function neighborMonth(notes,stop){const live=liveNations();rulers();

/* proposals and calls to arms */
function allyOffer(n){return{id:'nprop',e:NATIONS[n].e,t:`${NATIONS[n].n} proposes an alliance`,d:`${rName(n)} offers an alliance for twenty years: each side joins the other’s wars, and neither will attack the other.`,ch:[

function alliesJoin(){if(!S.war)return;liveNations().filter(o=>allied(o)&&!S.war.foes.includes(o)&&!(S.war.allies||[]).includes(o)).forEach(o=>{

  else{delete S.pacts[o];relA(o,-10);chron(NATIONS[o].e,`${NATIONS[o].n} stays out of the war`,'They refused the call, and the alliance is over.');toast(`${NATIONS[o].n} refuses to join, ending the alliance`)}})}

function ov(){if(!S.ov)S.ov={known:false,rel:{},routes:{},isl:[],prot:null,adv:0,loan:0,block:0,cd:{},evCd:0};const O=S.ov;OVIDS.forEach(p=>{if(O.rel[p]==null)O.rel[p]=45+rnd(11)});return O}

const harbors=()=>cnt('harbor');
const ovRoutes=()=>S.ov?Object.keys(S.ov.routes).filter(p=>S.ov.routes[p]):[];
const routeLive=p=>{const r=S.ov&&S.ov.routes[p];return!!r&&!(r.off>0)&&!(S.ov.block>0)};
const routeInc=p=>Math.round(OVP[p].trade*(1+(era()>=2?.5:0)+(era()>=3?.5:0))*(.6+ov().rel[p]/125));
const ovTradeInc=()=>ovRoutes().filter(routeLive).reduce((a,p)=>a+routeInc(p),0);
const myColonies=()=>(S.ov?S.ov.isl:[]).filter(I=>I.o==='me');
const colInc=()=>Math.round(myColonies().reduce((a,I)=>a+ISLRES[I.res].inc,0)*(era()>=2?1.3:1)*(msHas('g6')?1.2:1));
const PROT_COST=150;
// outer islands sit on open sea tiles well away from land, spread apart
function genIslands(){const O=ov();if(O.isl.length)return;const far=i=>{const r=i/W|0,c=i%W;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=H||cc>=W)continue;if(S.map[rr*W+cc].t!=='w')return false}return true};
  const cand=S.map.map((x,i)=>i).filter(i=>S.map[i].t==='w'&&i%W>=1&&i%W<=W-2&&(i/W|0)>=1&&(i/W|0)<=H-2&&far(i)).sort(()=>Math.random()-.5),picked=[],names=ISLN.slice().sort(()=>Math.random()-.5);
  cand.forEach(i=>{if(picked.length>=4)return;if(picked.every(j=>Math.max(Math.abs((i/W|0)-(j/W|0)),Math.abs(i%W-j%W))>=5))picked.push(i)});
  O.isl=picked.map((t,k)=>({n:names[k],t,res:pick(Object.keys(ISLRES)),o:null,prog:0}))}

/* each month overseas */
function overseasMonth(notes,stop){const O=ov();
  if(!O.known){if(hasTech('navigation')){O.known=true;genIslands();const t='Lands beyond the sea';notes.push(['🧭',t,'Your navigators have charted the ocean. Three great powers lie beyond it, and outer islands wait to be claimed. See the Overseas section of the World tab.']);stop.push(t)}return}
  OVIDS.forEach(p=>{O.rel[p]=Math.round((O.rel[p]+(50-O.rel[p])*.02)*10)/10;if(O.cd[p])O.cd[p]--});
  if(O.block>0){O.block--;if(!O.block)notes.push(['⚓','The blockade is lifted','Ships can come and go again.'])}
  if(O.prot)liveNations().forEach(n=>tenA(n,-.5));
  // pirates prey on sea routes when your navy is weak
  ovRoutes().forEach(p=>{const r=O.routes[p];if(r.off>0){r.off--;return}if(S.navy<2+era()&&Math.random()<(era()>=3?.01:.03)){r.off=3;notes.push(['🏴‍☠️',`Pirates prey on the route to ${OVP[p].n}`,`The route earns nothing for three months. A navy of ${2+era()} or more keeps pirates away.`])}});
  // colonies being founded
  O.isl.forEach(I=>{if(I.o==='pending'){I.prog--;if(I.prog<=0){I.o='me';const t=`A colony is founded on ${I.n}`;notes.push(['🏝️',t,`${ISLRES[I.res].e} ${ISLRES[I.res].n} will bring 🪙${Math.round(ISLRES[I.res].inc*(era()>=2?1.3:1))} a month.`]);stop.push(t)}}});
  // once a year the powers may claim a free island
  if(S.month===0)OVIDS.forEach(p=>{const free=O.isl.filter(I=>!I.o);if(free.length&&Math.random()<.12){const I=pick(free);I.o=p;notes.push([OVP[p].e,`${OVP[p].n} claims ${I.n}`,'Another outer island is taken.'])}});
  // a hostile power may back a claimant to your throne
  OVIDS.forEach(p=>{if(O.rel[p]<20&&Math.random()<.01&&(S.pret||[]).length<3){const g=Math.random()<.5?'m':'f',nm=royalName(g,new Set());addPret(nm,g,20+rnd(20),40,`a claimant backed by ${OVP[p].n}`);const t=`${OVP[p].n} backs a claimant to your throne`;notes.push([OVP[p].e,t,`${nm} now presses a claim with foreign gold behind them.`]);stop.push(t)}});
  // great-power pressure, more often in later ages
  if(O.evCd>0){O.evCd--;return}if(queue.some(e=>e.id==='ovev'))return;
  const ch=[0,.02,.035,.04][era()];if(Math.random()>=ch)return;const ev=pick([tributeEvent,landingEvent,rivalryEvent,globalEvent].map(f=>f()).filter(Boolean).concat([null]));if(ev){O.evCd=10;queue.push(ev);stop.push(ev.t)}}

/* great-power events */
function tributeEvent(){const p=OVIDS.filter(x=>ov().rel[x]<50).sort((a,b)=>OVP[b].navy-OVP[a].navy)[0];if(!p)return null;const amt=800+era()*400,strong=S.navy>=ovNavy(p)*.6;
  return{id:'ovev',e:OVP[p].e,t:`${OVP[p].n} demands tribute`,d:`A squadron of ${OVP[p].n} warships drops anchor off your coast. Their admiral demands 🪙${fmt(amt)}. Their fleet: ${ovNavy(p)} ships. Yours: ${S.navy}.`,ch:[
    {l:'Pay the tribute',c:amt,f(){ovRelA(p,5);addMod('leg',-3,12,`Paid tribute to ${OVP[p].n}`);return'The squadron sails away, and the court grumbles about the humiliation.'}},
    {l:'Refuse',f(){ovRelA(p,-10);if(strong){addMod('leg',3,12,`Defied ${OVP[p].n}`);return'Your fleet shadows theirs until they give up and sail home. The kingdom is proud.'}
      ov().block=6;addMod('leg',-2,12,'Blockaded');return`${OVP[p].n} blockades your ports for six months: sea routes stop, and trade capacity is halved.`}}]}}
function landingEvent(){if(era()<2)return null;const p=OVIDS.filter(x=>ov().rel[x]<35)[0];if(!p)return null;const coast=provsOf('me').filter(i=>i!==0&&provTiles(i).some(t=>isCoast(t)));if(!coast.length)return null;
  const i=pick(coast),c=calc(),win=clamp(.35+(c.forts-1)*1.2+(S.navy>=ovNavy(p)*.8?.2:0)+(S.army-1)*.05,.15,.9);
  return{id:'ovev',e:OVP[p].e,t:`${OVP[p].n} lands troops`,d:`${OVP[p].n} marines have landed near ${S.prov[i].name}, claiming an insult to their flag. They demand compensation.`,ch:[
    {l:`Drive them into the sea (${Math.round(win*100)}% chance)`,f(){if(Math.random()<win){addMod('leg',4,12,'Repelled a landing');addRen(10);ovRelA(p,-5);return'Your soldiers throw the invaders back to their ships. 🏅+10.'}
      S.dev[i]=12;S.coins-=1500;addMod('leg',-6,24,'A foreign landing');return`The landing force wins. ${S.prov[i].name} is plundered, and you pay 🪙1,500 before they leave.`}},
    {l:'Pay compensation',c:2000,f(){addMod('leg',-4,12,'Bought off a landing');ovRelA(p,5);return'The marines re-embark. The court calls it wisdom, or cowardice.'}}]}}
function rivalryEvent(){if(era()<2)return null;const [a,b]=OVIDS.slice().sort(()=>Math.random()-.5);
  return{id:'ovev',e:'⚖️',t:`${OVP[a].n} and ${OVP[b].n} compete for your favor`,d:`Both powers want your harbors and your friendship, and each asks you to turn the other away.`,ch:[
    {l:`Side with ${OVP[a].n}`,f(){ovRelA(a,20);ovRelA(b,-20);return`${OVP[a].n} is pleased. ${OVP[b].n} is not.`}},
    {l:`Side with ${OVP[b].n}`,f(){ovRelA(b,20);ovRelA(a,-20);return`${OVP[b].n} is pleased. ${OVP[a].n} is not.`}},
    {l:'Stay neutral',f(){ovRelA(a,-5);ovRelA(b,-5);return'Neither is satisfied, but neither is your enemy.'}}]}}
function globalEvent(){if(era()<3)return null;const [a,b]=OVIDS.slice().sort(()=>Math.random()-.5);
  return{id:'ovev',e:'🌍',t:'A great war overseas',d:`${OVP[a].n} and ${OVP[b].n} are at war, and the conflict is spreading across the oceans. Both would welcome your help.`,ch:[
    {l:'Sell supplies to both sides',f(){addMod('inc',150,24,'Wartime trade');ovRelA(a,-10);ovRelA(b,-10);igM('merchants',8,12,'Wartime trade');return'Your factories and farms work day and night for foreign armies.'}},
    {l:`Join ${OVP[a].n}`,f(){ovRelA(a,25);ovRelA(b,-30);addMod('leg',3,24,'A world war');S.troops=Math.max(0,S.troops-Math.round(S.troops*.15));return`Your soldiers sail to fight beside ${OVP[a].n}. Some will not come home.`}},
    {l:'Stay neutral',f(){return'The kingdom watches the world burn, and keeps its sons at home.'}}]}}

/* the World tab: overseas */
function overseasHTML(){if(!ovKnown())return`<h2>🌊 Overseas</h2><div class="card"><div class="row"><span class="em">🧭</span><div class="grow"><b>Rumors from beyond the sea</b><small>Sailors speak of great empires across the ocean, and of islands no one has claimed. Research Navigation to chart the way to them.</small></div></div></div>`;
  const O=ov(),H=harbors(),used=ovRoutes().length;
  const cards=OVIDS.map(p=>{const P=OVP[p],r=ovRel(p),has=!!O.routes[p],live=routeLive(p);
    const help=P.help==='loan'?`<button class="btn" data-act="ovHelp" data-arg="${p}" ${O.loan>S.turn||r<50?'disabled':''}>${O.loan>S.turn?`Loan repaid in ${O.loan-S.turn} mo`:'Borrow 🪙5,000'}</button>`
      :P.help==='advisor'?`<button class="btn" data-act="ovHelp" data-arg="${p}" ${O.adv>S.turn||r<60||S.coins<1500?'disabled':''}>${O.adv>S.turn?`Advisors for ${Math.ceil((O.adv-S.turn)/12)} more years`:'Hire advisors 🪙1,500'}</button>`
      :`<button class="btn" data-act="ovHelp" data-arg="${p}" ${O.prot!==p&&(r<70||O.prot)?'disabled':''}>${O.prot===p?'End protection':'Seek protection'}</button>`;
    const helpTxt=P.help==='loan'?'Their bankers lend 🪙5,000, repaid at 🪙260 a month for two years (relations 50).':P.help==='advisor'?'Their scholars add 15% to research for five years (relations 60).':`While protected, your neighbors will not declare war on you and tension with them eases, for 🪙${PROT_COST} a month (relations 70).`;
    return`<div class="card" style="margin-bottom:10px"><div class="row"><span class="em">${P.e}</span><div class="grow"><b>${P.n}</b> <span class="tag">${relWord(r)}</span>${O.prot===p?' <span class="tag" style="color:var(--good)">Protector</span>':''}<small>${P.d} Their fleet: ${ovNavy(p)} ships.</small>${bar(r)}</div></div>
      <div class="row"><span class="em">⛵</span><div class="grow"><b>${has?(live?`Trade route: 🪙${routeInc(p)} a month`:`Trade route disrupted${O.routes[p].off>0?` for ${O.routes[p].off} more months`:' by the blockade'}`):'No trade route'}</b><small>${has?'Better relations mean richer trade.':`A route needs a free harbor: ${H?`${H-used} of ${H} free`:'build a harbor first'}.`}</small></div>${has?'':`<button class="btn" data-act="ovRoute" data-arg="${p}" ${H-used<1||S.coins<1000||O.block>0?'disabled':''}>Open 🪙1,000</button>`}</div>
      <div class="row"><div class="grow btns" style="margin-top:0"><button class="btn" data-act="embassy" data-arg="${p}" ${O.cd[p]||S.coins<500?'disabled':''}>${O.cd[p]?`Embassy again in ${O.cd[p]} mo`:'Send an embassy 🪙500'}</button>${help}</div><small>${helpTxt} A royal marriage into their house is arranged from the Court tab.</small></div></div>`}).join('');
  const isl=O.isl.length?O.isl.map((I,k)=>{const R=ISLRES[I.res],own=I.o==='me'?'Your colony':I.o==='pending'?`Settlers arriving in ${I.prog} months`:I.o?`Claimed by ${OVP[I.o].n}`:'Unclaimed';
    return`<div class="row"><span class="em">🏝️</span><div class="grow"><b>${I.n}</b> <span class="tag">${R.e} ${R.n}</span><small>${own}.${I.o==='me'?` Earns 🪙${Math.round(R.inc*(era()>=2?1.3:1)*(msHas('g6')?1.2:1))} a month.`:!I.o?` Would earn about 🪙${Math.round(R.inc*(era()>=2?1.3:1))} a month.`:''}</small></div>${!I.o?`<button class="btn" data-act="colony" data-arg="${k}" ${!H||S.navy<1||S.coins<2000?'disabled':''}>Found a colony 🪙2,000</button>`:''}</div>`}).join('')
    :'<div class="row"><div class="grow"><small>There is no open sea around your island for outer islands.</small></div></div>';
  return`<h2>🌊 Overseas</h2><p class="hint">Great powers beyond the sea. Sea routes need harbors, and a navy keeps pirates and tribute-hungry admirals at bay.${O.block>0?` <b>Your ports are blockaded for ${O.block} more months.</b>`:''}</p>${cards}
    <h2>🏝️ Outer islands</h2><p class="hint">A colony needs a harbor, at least one warship and 🪙2,000, and takes a year to settle. The powers claim islands too. They are shown in the sea around your island.</p><div class="card">${isl}</div>`}
// the islets on the map, with a flag in the owner's color
function drawIslets(ctx,X,Y,z,c0,c1,r0,r1,P){if(!ovKnown())return;S.ov.isl.forEach(I=>{const col=I.t%W,r=I.t/W|0;if(col<c0-1||col>c1+1||r<r0-1||r>r1+1)return;
  const x0=X(col),y0=Y(r),w=X(col+1)-x0,cx=x0+w/2,cy=y0+w/2;
  ctx.fillStyle=P.sand;ctx.beginPath();ctx.ellipse(cx,cy+w*.05,w*.44,w*.3,0,0,7);ctx.fill();ctx.fillStyle='#7FAF62';ctx.beginPath();ctx.ellipse(cx-w*.04,cy,w*.26,w*.17,0,0,7);ctx.fill();
  const fc=I.o==='me'||I.o==='pending'?'#E2AE2A':I.o?OVP[I.o].c:'#EEEEE8';ctx.strokeStyle='#4a3b2c';ctx.lineWidth=Math.max(1,w*.035);ctx.beginPath();ctx.moveTo(cx+w*.12,cy+w*.02);ctx.lineTo(cx+w*.12,cy-w*.36);ctx.stroke();
  ctx.fillStyle=fc;ctx.beginPath();ctx.moveTo(cx+w*.12,cy-w*.36);ctx.lineTo(cx+w*.34,cy-w*.29);ctx.lineTo(cx+w*.12,cy-w*.22);ctx.closePath();ctx.fill();
  if(z>=20){ctx.fillStyle='rgba(255,255,255,.9)';ctx.font=`${Math.round(Math.max(9,w*.22))}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(I.n,cx,y0+w*.92)}})}

  if(window.ResizeObserver)new ResizeObserver(mapResize).observe($('#mapwrap'));else addEventListener('resize',mapResize);
  const ptr=new Map();let g=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  // One finger (or the mouse) pans, two fingers pinch-zoom; a press that barely moves is a tap on a tile.
  const begin=moved=>{const p=[...ptr.values()],c=MAP.cam;if(!p.length){g=null;return}
    if(p.length===1)g={pinch:false,x:p[0].x,y:p[0].y,cx:c.cx,cy:c.cy,moved};
    else{const[a,b]=p,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;g={pinch:true,d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:c.z,wx:c.cx+(mx-MAP.vw/2)/c.z,wy:c.cy+(my-MAP.vh/2)/c.z,moved:true}}};
  cv.addEventListener('pointerdown',e=>{if(e.button>0)return;try{cv.setPointerCapture(e.pointerId)}catch(err){}ptr.set(e.pointerId,pos(e));begin(ptr.size>1)});
  cv.addEventListener('pointermove',e=>{const q=pos(e);
    if(!ptr.has(e.pointerId)){if(e.pointerType==='mouse')showTip(tileLabel(tileAt(q.x,q.y)));return}
    ptr.set(e.pointerId,q);const c=MAP.cam,p=[...ptr.values()];
    if(!g.pinch){const dx=q.x-g.x,dy=q.y-g.y;if(!g.moved&&Math.hypot(dx,dy)>8)g.moved=true;if(g.moved){c.cx=g.cx-dx/c.z;c.cy=g.cy-dy/c.z;clampCam();drawSoon()}}
    else if(p.length>1){const[a,b]=p,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;c.z=clamp(g.z*Math.hypot(a.x-b.x,a.y-b.y)/g.d,minZ(),MAXZ);c.cx=g.wx-(mx-MAP.vw/2)/c.z;c.cy=g.wy-(my-MAP.vh/2)/c.z;clampCam();drawSoon()}});
  // A tap opens its tile on the click that follows, not on pointerup: on phones that click arrives just after the finger lifts,
  // and if the panel were already open it would land on the backdrop and close it again. The timer covers a click that never comes.
  const fireTap=()=>{clearTimeout(MAP.tapT);const i=MAP.tap;MAP.tap=-1;if(i>=0){MAP.kc=i;act('tile',i)}};
  const end=e=>{if(!ptr.has(e.pointerId))return;const q=ptr.get(e.pointerId),tap=e.type==='pointerup'&&g&&!g.pinch&&!g.moved&&ptr.size===1;ptr.delete(e.pointerId);begin(true);
    if(tap){const i=tileAt(q.x,q.y);if(i>=0&&S.map[i].t!=='w'){MAP.tap=i;clearTimeout(MAP.tapT);MAP.tapT=setTimeout(fireTap,400)}}};
  cv.addEventListener('click',()=>{if(MAP.tap>=0)fireTap()});
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')showTip('')});
  cv.addEventListener('wheel',e=>{e.preventDefault();const q=pos(e);zoomAt(q.x,q.y,Math.exp(-e.deltaY*(e.deltaMode?.05:.0015)))},{passive:false});
  cv.addEventListener('keydown',e=>{const k=e.key,mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];
    if(mv){e.preventDefault();let i=MAP.kc;if(i<0)i=tileAt(MAP.vw/2,MAP.vh/2);if(i<0)i=capIdx();
      const col=clamp(i%W+mv[0],0,W-1),row=clamp((i/W|0)+mv[1],0,H-1);i=row*W+col;MAP.kc=i;
      const c=MAP.cam,hw=MAP.vw/2/c.z-1,hh=MAP.vh/2/c.z-1;if(Math.abs(col+.5-c.cx)>hw)c.cx+=mv[0];if(Math.abs(row+.5-c.cy)>hh)c.cy+=mv[1];clampCam();showTip(tileLabel(i));drawSoon()}
    else if((k==='Enter'||k===' ')&&MAP.kc>=0&&S.map[MAP.kc].t!=='w'){e.preventDefault();act('tile',MAP.kc)}
    else if(k==='+'||k==='='){e.preventDefault();zoomAt(MAP.vw/2,MAP.vh/2,1.25)}
    else if(k==='-'||k==='_'){e.preventDefault();zoomAt(MAP.vw/2,MAP.vh/2,.8)}});
  cv.addEventListener('focus',drawSoon);cv.addEventListener('blur',()=>{showTip('');drawSoon()});
  const jump=e=>{const r=MAP.mini.getBoundingClientRect(),s=MAP.miniScale||1;MAP.cam.cx=(e.clientX-r.left)/s;MAP.cam.cy=(e.clientY-r.top)/s;clampCam();drawSoon()};
  MAP.mini.addEventListener('pointerdown',e=>{e.stopPropagation();MAP.mini.setPointerCapture(e.pointerId);jump(e)});
  MAP.mini.addEventListener('pointermove',e=>{if(MAP.mini.hasPointerCapture(e.pointerId))jump(e)});
  if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{MAP.dirty=true;drawSoon()})}

const niceMax=v=>{const p=Math.pow(10,Math.floor(Math.log10(Math.max(1,v)))),f=v/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p};

      lineChart(box,{min:0,max:top,ticks:[0,top/2,top],fmtv:fmt,series:[{n:'Population',c:'var(--viz-3)',v:h.map(x=>x[0]),area:1}]})}

function lineChart(box,o){const w=Math.max(220,box.clientWidth),hh=130,m={l:36,r:40,t:8,b:20},n=o.series[0].v.length;

  const line=v=>v.map((y,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(y).toFixed(1)}`).join('');
  const ends=o.series.map(s=>Y(s.v[n-1])),apart=ends.length<2||Math.abs(ends[0]-ends[1])>=14;
  let svg=`<svg width="${w}" height="${hh}" viewBox="0 0 ${w} ${hh}" aria-hidden="true">`;
  o.ticks.forEach(t=>{svg+=`<line class="grid" x1="${m.l}" x2="${w-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-6}" y="${Y(t)+4}" text-anchor="end">${o.fmtv(t)}</text>`});
  svg+=`<text x="${m.l}" y="${hh-4}">${histDate(0,n)}</text><text x="${w-m.r}" y="${hh-4}" text-anchor="end">${histDate(n-1,n)}</text>`;
  o.series.forEach(s=>{if(s.area)svg+=`<path d="${line(s.v)}L${X(n-1)},${bottom}L${X(0)},${bottom}Z" fill="${s.c}" opacity=".1"/>`;
    svg+=`<path d="${line(s.v)}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`});
  o.series.forEach((s,k)=>{svg+=`<circle cx="${X(n-1)}" cy="${ends[k]}" r="4" fill="${s.c}" stroke="var(--card)" stroke-width="2"/>`;
    if(apart)svg+=`<text class="end" x="${X(n-1)+8}" y="${ends[k]+4}">${o.fmtv(s.v[n-1])}${s.suf||''}</text>`});
  svg+=`<line class="xh" y1="${m.t}" y2="${bottom}" visibility="hidden"/>${o.series.map(s=>`<circle class="hd" r="4" fill="${s.c}" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`).join('')}</svg>`;
  box.innerHTML=svg+'<div class="ctip" hidden></div>';
  const xh=box.querySelector('.xh'),dots=box.querySelectorAll('.hd'),tip=box.querySelector('.ctip');
  // Crosshair snaps to the nearest month and lists every series there; the same readout follows arrow keys when the chart has focus.
  const show=i=>{i=clamp(i,0,n-1);box.dataset.i=i;const x=X(i);xh.setAttribute('x1',x);xh.setAttribute('x2',x);xh.setAttribute('visibility','visible');
    dots.forEach((d,k)=>{d.setAttribute('cx',x);d.setAttribute('cy',Y(o.series[k].v[i]));d.setAttribute('visibility','visible')});
    tip.replaceChildren();const t=document.createElement('div');t.className='tt';t.textContent=histDate(i,n);tip.append(t);
    o.series.forEach(s=>{const r=document.createElement('div');r.className='tr';const k=document.createElement('i');k.style.background=s.c;const b=document.createElement('b');b.textContent=o.fmtv(s.v[i])+(s.suf||'');r.append(k,b,document.createTextNode(' '+s.n));tip.append(r)});

  const hide=()=>{xh.setAttribute('visibility','hidden');dots.forEach(d=>d.setAttribute('visibility','hidden'));tip.hidden=true;delete box.dataset.i};
  const at=e=>{const r=box.getBoundingClientRect();show(Math.round((e.clientX-r.left-m.l)/(w-m.l-m.r)*(n-1)))};

  box.onkeydown=e=>{if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;e.preventDefault();const i=box.dataset.i!=null?+box.dataset.i:n-1;show(i+(e.key==='ArrowLeft'?-1:1))}}
function provRows(c){return provsOf('me').sort((a,b)=>(S.prov[b].pop||0)-(S.prov[a].pop||0)).map(i=>{const P=S.prov[i],p=c.pv[i],m=P.hap??p.target,u=Math.round(P.unrest||0);
