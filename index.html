const CMDS={
  help:()=>['money N           set the treasury','add N             add to the treasury','era 0-3           jump to an era (0 Crowns, 1 Enlightenment, 2 Industry, 3 Modern)','mat N             set building materials','child [m|f] [AGE] add a royal child','gender m|f        make the monarch a king or queen','consort m|f       the consort becomes a husband or wife (new name, same age)','rulers            list neighboring rulers and their personalities','overseas          reveal the overseas powers and outer islands','nwar A B          nation A declares war on nation B','renown N          add renown to the royal house','heirloom KEY      give the house an heirloom ('+Object.keys(HEIRLOOMS).join(', ')+')','pretender         a pretender appears, with support 70','bastard           the monarch has an acknowledged bastard','kids              list the royal children with IDs','makeheir ID       name a child heir','drama off|some|lots  family drama level','spouse            marry the monarch to a noble','punrest ID N      set a province’s unrest','integ ID N        set a province’s integration','revolt ID         start a revolt in a province','pop N             set population','approval N        set approval','legitimacy N      set legitimacy','unrest N          set unrest','skip N            skip N months (auto-resolves events)','build ID [N]      build on free tiles, free of charge','buildings         list building IDs','unlock            research every technology','tech ID           research one technology','techs             list technology IDs','law CAT OPT       pass a law instantly','laws              list law categories and options','mood IG N         shift an interest group\u2019s mood for a year','event ID          trigger an event','events            list event IDs','rel NATION N      set relations','tension NATION N  set tension','age N             set the monarch\u2019s age','die               the monarch dies now','aging on|off      toggle aging and succession','court 0-4         set royal household spending','provinces         list provinces with IDs','take ID           take a province','give ID NATION    give away a province','claim ID          gain a claim','army 0-4          set army size','war NATION [ID]   declare war','invade NATION     a neighbor attacks you','score N           set the war score','peace             end the war with a white peace','troops N          set current soldiers','navy N            set your warships','mobilize          toggle mobilization','support N         set war support','occupy ID         occupy a province in the current war','general [TRAIT]   appoint a general (aggressive, cautious, quartermaster, brilliant, inspiring)','status            summary of the kingdom','province ID       everything about one province','why approval|legitimacy|unrest  what\u2019s driving the number','events on|off     turn random events on or off','date MONTH [YEAR] jump to a date','next              end one month from the console','trait NAME        change the monarch\u2019s trait','heir N            set the heir\u2019s age','marry NATION      instant royal marriage','settle ID         settle a frontier province now','devastate ID [N]  devastate a province','rebuild all       clear all devastation','demolish ID       clear buildings in your province','win / lose        end the war now','enemy NATION N|off  fix a neighbor\u2019s army strength','embargo NATION N  set an embargo (0 lifts it)','situation NATION STATE  stable, indebted or troubled','god               infinite money, no rising unrest','goals             complete every objective','clear             clear this log','reset yes         start a new nation'],
  money:n=>{S.coins=num(n,0);return`Treasury set to ${fmt(S.coins)}`},
  era:n=>{const e=clamp(num(n,era()+1),0,3);S.era=e;return`The kingdom is now in the ${ERAS[e].n}`},
  mat:n=>{S.mat=Math.max(0,num(n,500));return`Building materials set to ${fmt(S.mat)}`},
  child:(g,a)=>{const gg=g==='m'||g==='f'?g:undefined,age=num(gg?a:g,0);const k=addKid(Math.max(0,age),gg);return`${kidName(k)} (ID ${k.id}), aged ${k.age}, joins the royal family`},
  kids:()=>kids().length?kids().map(k=>`${k.id}: ${kidName(k)}, ${k.age}, ${TRAITS[k.trait].n}${k===heirOf(S)?', heir':''}${kidRole(k)?', '+kidRole(k):''}${k.spouse?', married':''}${k.rival?', resentful':''}`):'No children',
  makeheir:id=>{const k=kidById(num(id,-1));if(!k)return E('Usage: makeheir ID (see kids)');makeHeir(k);return`${kidName(k)} is now heir`},
  drama:v=>{if(!['off','some','lots'].includes(v))return E('Usage: drama off|some|lots');S.drama=v;return`Family drama: ${v}`},
  spouse:()=>{if(S.fam.spouse)return E('The monarch is already married');S.fam.spouse=newSpouse(S.monarch.g,S.monarch.age,'noble');return`${monarchName(S.monarch)} marries ${S.fam.spouse.name}`},
  punrest:(i,n)=>{i=num(i,-1);const P=S.prov[i];if(!P||P.o!=='me')return E('Usage: punrest ID N (one of your provinces)');P.unrest=clamp(num(n,50),0,100);return`${P.name} unrest set to ${P.unrest}`},
  integ:(i,n)=>{i=num(i,-1);const P=S.prov[i];if(!P||P.o!=='me')return E('Usage: integ ID N (one of your provinces)');P.integ=clamp(num(n,100),0,100);return`${P.name} integration set to ${P.integ}%`},
  revolt:i=>{i=num(i,-1);const P=S.prov[i];if(!P||P.o!=='me'||i===0)return E('Usage: revolt ID (one of your provinces, not the capital)');P.unrest=100;P.revolt={m:0,prog:0,str:rebelStr(P),sup:false};return`${P.name} rises in revolt`},
  add:n=>{S.coins+=num(n,10000);return`Treasury now ${fmt(S.coins)}`},
  pop:n=>{setPop(Math.max(10,num(n,S.pop)));S.best=Math.max(S.best,S.pop);return`Population set to ${fmt(S.pop)}`},
  approval:n=>{S.hap=clamp(num(n,S.hap),0,100);return`Approval set to ${S.hap}%`},
  legitimacy:n=>{S.leg=clamp(num(n,S.leg),0,100);return`Legitimacy set to ${S.leg}`},
  unrest:n=>{S.unrest=clamp(num(n,0),0,100);return`Unrest set to ${S.unrest}`},
  skip:n=>{const k=clamp(num(n,1),1,240);for(let i=0;i<k;i++)endMonth(true);return`Skipped ${k} months. Now ${MONTHS[S.month]}, year ${S.year}`},
  build:(id,n)=>{if(!B[id]||B[id].fixed)return E('Unknown building. Try buildings.');let k=clamp(num(n,1),1,50),b=0;while(k--){const i=freeTile(id);if(i<0)break;S.map[i].b=id;if(!B[id].forest)S.map[i].t='l';b++}return b?`Built ${b} ${B[id].n.toLowerCase()}`:E('No free tile available')},
  buildings:()=>Object.keys(B).filter(k=>!B[k].fixed).join(', '),
  unlock:()=>{TECH.forEach(t=>{if(!hasTech(t.id))S.tech.done.push(t.id)});S.era=3;S.tech.cur=null;S.tech.q=[];S.tech.pp={};return'Every technology researched'},
  tech:id=>{const t=techOf(id);if(!t)return E('Unknown technology. Try techs.');if(!hasTech(id))S.tech.done.push(id);S.tech.q=techQ().filter(x=>x!==id);if(S.tech.pp)delete S.tech.pp[id];if(S.tech.cur===id){S.tech.cur=null;S.tech.prog=0}return`${t.n} researched`},
  techs:()=>TECH.map(t=>t.id).join(', '),
  law:(c,o)=>{if(!LAWS[c]||!LAWS[c].o[o])return E('Try laws for valid options');S.laws[c]=o;if(S.enact&&S.enact.cat===c)S.enact=null;S.lawsPassed++;return`${LAWS[c].o[o].n} is now law`},
  laws:()=>Object.entries(LAWS).map(([c,L])=>`${c}: ${Object.keys(L.o).join(', ')}`),
  mood:(g,n)=>{if(!IGS[g])return E('Use '+IGIDS.join(', '));igM(g,num(n,20),12,'Console');return`${IGS[g].n} mood shifted by ${num(n,20)}`},
  event:id=>{const e=id==='crisis'?crisisEvent(pick(NIDS)):EVENTS.find(x=>x.id===id);if(!e)return E('Unknown event. Try events.');queue.length=0;queue.push(e);$('#conWrap').classList.remove('open');showNext();return`Showing ${id}`},
  events:()=>EVENTS.map(e=>e.id).concat('crisis').join(', '),
  rel:(c,n)=>{if(!NATIONS[c])return E('Use norvik, solenne or aurelia');S.rel[c]=clamp(num(n,50),0,100);return`${NATIONS[c].n} relations: ${S.rel[c]}`},
  tension:(c,n)=>{if(!NATIONS[c])return E('Use norvik, solenne or aurelia');S.tension[c]=clamp(num(n,50),0,100);S.crisisCd[c]=0;return`${NATIONS[c].n} tension: ${S.tension[c]}`},
  age:n=>{S.monarch.age=clamp(num(n,S.monarch.age),0,120);return`${monarchName(S.monarch)} is now ${S.monarch.age}`},
  die:()=>{queue.length=0;const old=succeed('died');queueSuccession(old,'died');$('#conWrap').classList.remove('open');showNext();return`${monarchName(old)} has died`},
  provinces:()=>S.prov.map((P,i)=>`${i}: ${P.name} (${ownName(P.o)})`),
  take:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o==='me')return E('Use provinces to find an ID you don\u2019t own');transfer(i,'me','console');return`${S.prov[i].name} is yours`},
  give:(i,n)=>{i=num(i,-1);if(!S.prov[i]||i===0||!(NATIONS[n]||n==='wild'))return E('Usage: give ID NATION');transfer(i,n,'console');return`${S.prov[i].name} given to ${ownName(n)}`},
  claim:i=>{i=num(i,-1);if(!S.prov[i])return E('Unknown province');S.claims[i]=true;return`Claim on ${S.prov[i].name}`},
  army:n=>{S.army=clamp(num(n,1),0,4);return`Army set to ${ARMY[S.army].n.toLowerCase()}`},
  war:(n,i)=>{if(!NATIONS[n])return E('Usage: war NATION [PROVINCE_ID]');if(S.war)return E('Already at war');const g=i!=null?num(i,-1):(borderOf(n,'me')[0]);if(g==null||!S.prov[g]||S.prov[g].o!==n)return E('No valid target province');startWar(n,g,'me');return`War declared on ${NATIONS[n].n} over ${S.prov[g].name}`},
  invade:n=>{if(!NATIONS[n])return E('Usage: invade NATION');if(S.war)return E('Already at war');const g=borderOf('me',n).filter(i=>i!==0)[0];if(g==null)return E('No border province to attack');startWar(n,g,n);return`${NATIONS[n].n} invades ${S.prov[g].name}`},
  score:n=>{if(!S.war)return E('Not at war');S.war.score=clamp(num(n,0),-100,100);return`War score set to ${S.war.score}`},
  peace:()=>{if(!S.war)return E('Not at war');const r=finishWar('Peace',[],[]);return r.d},
  troops:n=>{S.troops=Math.max(0,num(n,troopTarget()));return`Troops set to ${S.troops}`},
  navy:n=>{S.navy=Math.max(0,num(n,5));return`Navy set to ${S.navy} ships`},
  mobilize:()=>{S.mob=!S.mob;return`Mobilization ${S.mob?'on':'off'}`},
  support:n=>{if(!S.war)return E('Not at war');S.war.support=clamp(num(n,50),0,100);return`War support ${S.war.support}%`},
  occupy:i=>{i=num(i,-1);if(!S.war||!S.prov[i])return E('Usage: occupy ID (during a war)');S.war.occ[i]=S.prov[i].o==='me'?'them':'me';S.war.occd[i]=1;return`${S.prov[i].name} occupied`},
  general:t=>{const k=GTRAITS[t]?t:pick(Object.keys(GTRAITS));S.general={name:pick(GNAMES),trait:k};return`General ${S.general.name} (${GTRAITS[k].n}) appointed`},
  court:n=>{S.court=clamp(num(n,2),0,4);return`Royal household set to ${COURT[S.court].n.toLowerCase()}`},
  aging:v=>{S.aging=v!=='off';return`Aging and succession ${S.aging?'on':'off'}`},
  goals:()=>{GOALS.forEach(g=>S.goals[g.id]=1);return'All objectives marked complete'},
  status:()=>statusLines(),
  province:i=>{i=num(i,-1);const P=S.prov[i];if(!P)return E('Usage: province ID (see provinces)');const tl=provTiles(i),bl=tl.map(t=>S.map[t].b).filter(b=>b&&B[b]);
    return[`${i}: ${P.name}. Owner ${ownName(P.o)}${P.o!==P.core?`, originally ${ownName(P.core)}`:''}.`,`${tl.length} tiles, ${P.pop} foreign residents${P.heart?', a heartland':''}.`,`Buildings: ${bl.length?bl.join(', '):'none'}.`,`Your claim: ${S.claims[i]?'yes':'no'}. Claimed by: ${S.fclaims[i]?NATIONS[S.fclaims[i]].n:'nobody'}.`,
      `Occupied: ${S.war&&S.war.occ[i]?(S.war.occ[i]==='me'?'by you':'by the enemy'):'no'}. Devastated: ${S.dev[i]?S.dev[i]+' months':'no'}. Settling: ${P.settle?P.settle+' months':'no'}.`,NATIONS[P.o]?`Buy price: ${fmt(buyPrice(i))}.`:'']},
  why:w=>w&&w.startsWith('leg')?whyLegitimacy():w&&w.startsWith('app')?whyApproval():w&&w.startsWith('unr')?whyLines('unrest'):E('Usage: why approval, why legitimacy or why unrest'),
  events:v=>{if(v==='off'||v==='on'){S.noEvents=v==='off';return`Random events ${v}`}return EVENTS.map(e=>e.id).concat('crisis').join(', ')},
  date:(m,y)=>{if(m==null)return E('Usage: date MONTH [YEAR]');S.month=monthIdx(m);if(y!=null)S.year=Math.max(1,num(y,S.year));return`Date set to ${MONTHS[S.month]}, year ${S.year}`},
  next:()=>{endMonth(false);return['A month passes. Details are in the news.'].concat(statusLines())},
  gender:g=>{if(!['m','f'].includes(g))return E('Use gender m or gender f');S.monarch.g=g;return`Now ${monarchName(S.monarch)}`},
  consort:g=>{const sp=S.fam.spouse;if(!sp)return E('The monarch is unmarried');if(!['m','f'].includes(g))return E('Use consort m or consort f');sp.g=g;sp.name=royalName(g,new Set([S.monarch.name,...kids().map(k=>k.name)]));return`${sp.name} is now the ${g==='m'?'husband':'wife'}`},
  overseas:()=>{const O=ov();O.known=true;genIslands();return`Overseas powers revealed, with ${O.isl.length} outer islands`},
  rulers:()=>liveNations().map(n=>`${NATIONS[n].n}: ${rName(n)}, ${ruler(n).age}, ${ruler(n).pers}${ruler(n).heir?`, heir ${ruler(n).heir.name}`:', no heir'}${pact(n)?`, ${pact(n).t}`:''}`),
  nwar:(a,b)=>{if(!NATIONS[a]||!NATIONS[b]||a===b)return E('Usage: nwar norvik solenne');if(nwarOf(a)||nwarOf(b))return E('One of them is already at war');nwars().push({a,b,m:0,sc:0});return`${NATIONS[a].n} declares war on ${NATIONS[b].n}`},
  renown:v=>{addRen(num(v,100));return`Renown ${Math.floor(house().ren)}`},
  heirloom:k=>{if(!HEIRLOOMS[k])return E('Use '+Object.keys(HEIRLOOMS).join(', '));gainHeirloom(k);return`${HEIRLOOMS[k].n} added`},
  pretender:()=>{const g=Math.random()<.5?'m':'f',nm=royalName(g,new Set());addPret(nm,g,20+rnd(20),70,'a claimant from a forgotten branch of the family');return`${nm} claims the throne`},
  bastard:()=>{const g=Math.random()<.5?'m':'f',nm=royalName(g,new Set(kids().map(x=>x.name)));S.fam.bast=S.fam.bast||[];S.fam.bast.push({name:nm,g,age:rnd(14)});return`${nm} is acknowledged`},
  trait:t=>{if(!TRAITS[t])return E('Use '+Object.keys(TRAITS).join(', '));S.monarch.trait=t;return`${monarchName(S.monarch)} is now ${TRAITS[t].n.toLowerCase()}`},
  heir:n=>{const h=heirOf(S);if(!h)return E('No children. Try child.');h.age=clamp(num(n,h.age),0,90);return`${kidName(h)} is now ${h.age}`},
  marry:n=>{if(!NATIONS[n]&&n!=='noble')return E('Usage: marry NATION or marry noble (marries the heir)');const h=heirOf(S);if(!h)return E('No children. Try child.');h.age=Math.max(16,h.age);h.spouse=null;return marryKid(h,n)},
  settle:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o!=='wild')return E('Usage: settle ID (a frontier province)');transfer(i,'me','settled');return`${S.prov[i].name} settled`},
  devastate:(i,m)=>{i=num(i,-1);if(!S.prov[i])return E('Usage: devastate ID [MONTHS]');S.dev[i]=Math.max(1,num(m,12));return`${S.prov[i].name} devastated for ${S.dev[i]} months`},
  rebuild:a=>{if(a!=='all')return E('Usage: rebuild all');const n=Object.keys(S.dev).length;S.dev={};return`${n} province${n===1?'':'s'} rebuilt`},
  demolish:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o!=='me')return E('Usage: demolish ID (one of your provinces)');let k=0;provTiles(i).forEach(t=>{const x=S.map[t];if(x.b&&!B[x.b].fixed){x.b=null;k++}});return`Demolished ${k} building${k===1?'':'s'} in ${S.prov[i].name}`},
  win:()=>{if(!S.war)return E('Not at war');S.war.score=Math.max(S.war.score,60);const r=autoResolve('win');return[r.t+'.',r.d]},
  lose:()=>{if(!S.war)return E('Not at war');S.war.score=Math.min(S.war.score,-60);const r=autoResolve('lose');return[r.t+'.',r.d]},
  enemy:(n,v)=>{if(!NATIONS[n])return E('Usage: enemy NATION N, or enemy NATION off');S.enemyStr=S.enemyStr||{};if(v==='off'||v==null){delete S.enemyStr[n];return`${NATIONS[n].n} strength back to normal (${theirStr(n)})`}S.enemyStr[n]=Math.max(0,num(v,0));return`${NATIONS[n].n} army strength fixed at ${S.enemyStr[n]}`},
  embargo:(n,m)=>{if(!NATIONS[n])return E('Usage: embargo NATION MONTHS (0 lifts it)');const k=Math.max(0,num(m,12));if(k)S.embargo[n]=k;else delete S.embargo[n];return k?`${NATIONS[n].n} embargo for ${k} months`:`${NATIONS[n].n} embargo lifted`},
  situation:(n,st)=>{if(!NATIONS[n]||!['stable','indebted','troubled'].includes(st))return E('Usage: situation NATION stable|indebted|troubled');S.nsit[n]=st;return`${NATIONS[n].n} is now ${st}`},
  god:()=>{S.god=!S.god;if(S.god)S.coins=Math.max(S.coins,999999);return`God mode ${S.god?'on: infinite money, and unrest can\u2019t rise':'off'}`},
  clear:()=>{LOG.length=0;return[]},
  reset:y=>{if(y!=='yes')return E('Type reset yes to start over');S=newState();return'New nation created'}
};
CMDS.coins=CMDS.money;
const CHIST=[];let chIdx=-1;
function suggest(){const v=$('#conIn').value.trim().toLowerCase(),box=$('#conSug');if(!v||v.includes(' ')){box.innerHTML='';return}
  const m=Object.keys(CMDS).filter(k=>k.startsWith(v)&&k!==v).slice(0,6);box.innerHTML=m.map(k=>`<button class="btn" data-act="sug" data-arg="${k}">${k}</button>`).join('')}
function runCmd(line){line=line.trim();if(!line)return;if(CHIST[CHIST.length-1]!==line)CHIST.push(line);chIdx=-1;if($('#conSug'))$('#conSug').innerHTML='';out('> '+line,'c');const [c,...a]=line.split(/\s+/);const f=CMDS[c.toLowerCase()];
  if(!f)out('Unknown command. Type help.','e');else{const r=f(...a);if(r&&r.err)out(r.err,'e');else out(r)}render();renderLog()}
function openCon(){$('#sheetWrap').classList.remove('open');$('#conWrap').classList.add('open');renderLog();setTimeout(()=>$('#conIn').focus(),50)}

/* ---------- actions ---------- */
function act(a,arg,n){
  switch(a){
    // On wide screens, tapping the tab that's already open hides the side panel; any other tab brings it back.
    case'tab':if(isWide()){if(arg===tab&&!document.body.classList.contains('nopanel')){setPanel(false);return}setPanel(true)}
      tab=arg;window.scrollTo(0,0);$('#view').scrollTop=0;break;
    case'goto':setPanel(true);tab=arg;window.scrollTo(0,0);$('#view').scrollTop=0;break;
    case'panel':setPanel(document.body.classList.contains('nopanel'));return;
    case'legend':UI.legend=!keyShown();saveUI();renderModes();return;
    case'icons':{UI.icons=!UI.icons;saveUI();const b=$('#sheet [data-act=icons]');if(b)b.setAttribute('aria-pressed',!!UI.icons);MAP.dirty=true;drawSoon();return}
    case'maphelp':openSheet(`<h3>🗺️ The map</h3><div class="card">
      <div class="row"><span class="em">👆</span><div class="grow"><b>Moving around</b><small>Drag to move. Pinch, scroll, or use + and − to zoom. ⌂ returns to your capital, and the small map in the corner jumps anywhere.</small></div></div>
      <div class="row"><span class="em">🏗️</span><div class="grow"><b>Tapping tiles</b><small>Tap your own land to build or upgrade. Tap a neighbor’s province to buy, claim or contest it, or frontier to settle it.</small></div></div>
      <div class="row"><span class="em">🧭</span><div class="grow"><b>Borders</b><small>Thick lines are national borders, thin lines are provinces. Sand-coloured edges mark your coastline.</small></div></div>
      <div class="row"><span class="em">🎨</span><div class="grow"><b>Map modes</b><small>The menu at the top left recolours the map: Land shows terrain and deposits, Pollution shows how pleasant your neighborhoods are, and Relations, Tension and Claims show diplomacy. Key shows or hides the legend.</small></div></div>
      ${isWide()?'<div class="row"><span class="em">⤢</span><div class="grow"><b>More room</b><small>⤢ hides the side panel for a full-screen map. Tap any tab to bring it back, or the open tab again to hide it.</small></div></div>':''}</div>
      <button class="btn primary wide" data-act="closeSheet">Done</button>`);return;
    case'zoom':if(arg==='home')centerOn(capIdx(),TS);else zoomAt(MAP.vw/2,MAP.vh/2,arg==='in'?1.35:1/1.35);drawSoon();return;
    case'pact':{const t=n;if(!NATIONS[arg]||isFallen(arg)||atWarWith(arg)||pact(arg)||!['ally','nonagg'].includes(t))return;const cost=t==='ally'?300:150,need=t==='ally'?(pers(arg,'aggressive')?75:65):45;if(S.coins<cost||S.rel[arg]<need)return;
      S.coins-=cost;S.pacts=S.pacts||{};S.pacts[arg]={t,until:S.turn+(t==='ally'?240:120)};relA(arg,3);tenA(arg,-10);chron(NATIONS[arg].e,t==='ally'?`An alliance with ${NATIONS[arg].n}`:`A non-aggression pact with ${NATIONS[arg].n}`,t==='ally'?'Signed for twenty years.':'Signed for ten years.');
      toast(t==='ally'?`${NATIONS[arg].n} is now your ally`:`A non-aggression pact with ${NATIONS[arg].n}`);render();return}
    case'endPact':{const p=pact(arg);if(!p)return;delete S.pacts[arg];relA(arg,-15);chron(NATIONS[arg].e,`The ${p.t==='ally'?'alliance':'pact'} with ${NATIONS[arg].n} ends`,'Ended by the crown.');toast(`The ${p.t==='ally'?'alliance':'pact'} with ${NATIONS[arg].n} is over`);render();return}

      toast(`Debate begins on ${LAWS[arg].o[n].n.toLowerCase()}. It passes in ${mo} months.`);break}
    case'cancelLaw':{if(!S.enact)return;const o=LAWS[S.enact.cat].o[S.enact.opt].n.toLowerCase();S.mods=S.mods.filter(m=>m.l!==`Opposes ${o}`);S.enact=null;addMod('leg',-2,3,'Withdrawn law');toast('The law is withdrawn');break}
    case'favor':{if(S.favorCd[arg]||S.coins<400)return;S.coins-=400;S.favorCd[arg]=6;igM(arg,15,12,'Royal favor');toast(`The ${IGS[arg].n.toLowerCase()} are pleased by the crown\u2019s favor`);render();groupSheet(arg);return}
    case'group':if(IGS[arg])groupSheet(arg);return;
    case'stipend':{const was=stipend(arg),v=+n;if(!IGS[arg]||!(v in STIP))return;S.stip=S.stip||{};S.stip[arg]=v;if(v<was)igM(arg,-3*(was-v),6,'Stipend cut');
      toast(v?`A ${v===1?'small':'large'} stipend for the ${IGS[arg].n.toLowerCase()}`:`The ${IGS[arg].n.toLowerCase()}\u2019s stipend ends`);render();groupSheet(arg);return}
    case'coopt':{if(!IGS[arg]||coopted(arg)||S.coins<COOPT_COST)return;S.coins-=COOPT_COST;S.coopt=S.coopt||{};S.coopt[arg]=S.turn+COOPT_MONTHS;toast(`The ${IGS[arg].n.toLowerCase()}\u2019s leaders accept a place at court`);render();groupSheet(arg);return}
    case'suppressGroup':{if(!IGS[arg]||suppressed(arg)||suppressWhy())return;if(!resetArmed){resetArmed=true;$('#supBtn').textContent='Tap again to suppress';return}resetArmed=false;
      S.supp=S.supp||{};S.supp[arg]=S.turn+SUPP_MONTHS;addMod('leg',-6,24,`Suppressed the ${IGS[arg].n.toLowerCase()}`);S.unrest=Math.min(100,S.unrest+10);if(arg!=='intelligentsia')igM('intelligentsia',-8,12,'Political repression');
      toast(`The ${IGS[arg].n.toLowerCase()}\u2019s organizations are outlawed`);render();groupSheet(arg);return}
    // rejecting a reform: a lasting, deliberate choice; promising one: two years' grace, or a broken promise
    case'reject':{const E=EXPECT.find(x=>x.k===arg);if(!E||expState(E)==='met')return;if(!resetArmed){resetArmed=true;const b=$('#rej-'+arg);if(b)b.textContent='Tap again to reject';return}resetArmed=false;
      pr()[arg]={p:rejectLevel()*(expState(E)==='half'?.5:1),st:'rejected'};toast(`The crown rejects ${wantTxt(E)}`);break}
    case'promise':{const E=EXPECT.find(x=>x.k===arg);if(!E||expState(E)==='met')return;const s=pr()[arg]||(pr()[arg]={p:0});s.st='promised';s.until=S.turn+24;toast(`The crown promises ${wantTxt(E)} within two years`);break}
    // start now (progress on the previous technology is kept), or add to the queue
    case'research':{if(hasTech(arg))return;const t=techOf(arg);if(!t||!techOpen(t)||t.req&&!hasTech(t.req))return;const had=S.tech.cur;if(had!==arg)startTech(arg);
      toast(had&&had!==arg?`Scholars switch to ${t.n.toLowerCase()}. Progress on ${techOf(had).n.toLowerCase()} is kept.`:`Scholars begin work on ${t.n.toLowerCase()}`);break}
    case'queue':{const t=techOf(arg);if(!t||!canQueue(t))return;if(!S.tech.cur&&(!t.req||hasTech(t.req))){startTech(arg);toast(`Scholars begin work on ${t.n.toLowerCase()}`)}else{techQ().push(arg);toast(`${t.n} added to the queue`)}break}
    case'unqueue':{const q=techQ(),i=q.indexOf(arg);if(i<0)return;q.splice(i,1);
      // anything that needed it has to go too
      for(let k=q.length-1;k>=0;k--){const x=techOf(q[k]);if(x.req&&!hasTech(x.req)&&S.tech.cur!==x.req&&!q.slice(0,k).includes(x.req))q.splice(k,1)}break}
    case'qup':{const q=techQ(),i=q.indexOf(arg);if(i<=0)return;const x=techOf(arg);if(x.req&&q[i-1]===x.req)return;[q[i-1],q[i]]=[q[i],q[i-1]];break}
    case'setTrade':{S.trade[arg]=n||null;toast(n?`${RES.find(r=>r.k===arg).n} agreement signed with ${NATIONS[n].n}`:'Agreement ended');checkGoals();break}
    case'envoy':{if(S.envoy[arg]||S.coins<300||isFallen(arg))return;S.coins-=300;S.envoy[arg]=1;const tg=hasTech('telegraph'),eb=(msHas('g1')?1.2:1)*(lg('kin',2)?1.2:1);relA(arg,(tg?12:8)*eb);tenA(arg,-(tg?12:8)*eb);toast(`Envoy sent to ${NATIONS[arg].n}. Relations improve and tension eases.`);break}
    case'demand':{if(S.demandCd[arg]||isFallen(arg))return;S.demandCd[arg]=6;tenA(arg,25);const ok=S.rel[arg]>=40&&Math.random()<S.rel[arg]/100;let msg;
      if(ok){const pay=300+Math.round(S.rel[arg]*5);S.coins+=pay;addMod('leg',3,6,`Tribute from ${NATIONS[arg].n}`);relA(arg,-4);msg=`${NATIONS[arg].n} pays 🪙${fmt(pay)} in tribute. Your court is impressed.`}
      else{relA(arg,-10);msg=`${NATIONS[arg].n} refuses, and relations suffer.`}
      if(S.tension[arg]>=100)msg+=' '+embargoNow(arg);toast(msg);break}
    case'aging':{S.aging=!S.aging;const b=$('#sheet [data-act=aging]');if(b)b.setAttribute('aria-pressed',S.aging);toast(`Aging and succession ${S.aging?'on':'off'}`);render();return}
    case'abdicate':{if(S.heir.age<16)return;if(!resetArmed){resetArmed=true;$('#abdBtn').textContent='Tap again';return}resetArmed=false;queue.length=0;queueSuccession(succeed('abdicated'),'abdicated');render();showNext();return}
    case'endMonth':{const r=endMonth(false);render();afterMonths([r]);return}
    case'advance':{const rs=[];for(let k=0;k<12;k++){const r=endMonth(false);rs.push(r);const cr=crisisNow();if(cr&&!r.stop.length)r.stop.push(`${cr}. ⏩ goes one month at a time until it is dealt with`);if(queue.length||r.stop.length||S.war)break}render();afterMonths(rs);return}
    case'news':newsSheet();return;
    case'legacy':legacySheet();return;
    case'why':whySheet(arg);return;
    case'mapmode':if(!MODES[arg])return;mapMode=UI.mapMode=arg;saveUI();renderModes();MAP.dirty=true;drawSoon();return;
    case'report':{S.showReport=!S.showReport;const b=$('#sheet [data-act=report]');if(b)b.setAttribute('aria-pressed',!!S.showReport);save();return}
    case'nextEvent':showNext();return;
    case'choose':{const Ev=curEvent;if(!Ev)return;const ch=Ev.ch[+arg];if(ch.c)S.coins-=ch.c;const res=ch.f();curEvent=null;logNews(Ev.e,`${Ev.t}: ${ch.l}`,res);chron(Ev.e,Ev.t,`${ch.l}. ${res}`);
      openSheet(`<div class="event"><div class="pic" aria-hidden="true">${Ev.e}</div><h3>${ch.l}</h3><p>${res}</p></div><button class="btn primary wide" data-act="${queue.length?'nextEvent':'closeSheet'}">${queue.length?'Continue':'Return to the map'}</button>`);break}
    case'settings':settings();return;
    case'closeSheet':closeSheet();break;
    case'openCon':openCon();return;
    case'closeCon':$('#conWrap').classList.remove('open');break;
    case'runCon':{const i=$('#conIn');runCmd(i.value);i.value='';i.focus();return}
    case'cmd':runCmd(arg);return;
    case'lastCmd':{if(!CHIST.length)return;const i=$('#conIn');chIdx=chIdx<=0?CHIST.length-1:chIdx-1;i.value=CHIST[chIdx];i.focus();return}
    case'sug':{const i=$('#conIn');i.value=arg+' ';suggest();i.focus();return}
    case'start':case'rename':{const v=esc(($('#nm')||{}).value||'').trim();if(v)S.name=v;closeSheet();if(a==='rename')toast('Nation renamed');break}
    case'copyCode':{const t=$('#code');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('Save code copied'),()=>{try{document.execCommand('copy');toast('Save code copied')}catch(e){toast('Select the code and copy it')}});return}
    case'loadCode':{try{const d=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));if(!d||!(d.v===1||d.v===2)||!Array.isArray(d.map))throw 0;adopt(d);closeSheet();toast('Nation loaded')}catch(e){toast('That code didn\u2019t work. Check it was copied in full.')}break}
    case'reset':{if(!resetArmed){resetArmed=true;$('#resetBtn').textContent='Tap again to start over';return}S=newState();tab='isle';queue.length=0;curEvent=null;closeSheet();render();welcome();return}
  }
  render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;act(b.dataset.act,b.dataset.arg,b.dataset.n)});
const blocking=()=>!!$('#sheet .choice')||!!$('#sheet [data-act=start]')||!!$('#sheet [data-act=nextEvent]');
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap'&&!blocking())closeSheet()});
$('#conWrap').addEventListener('click',e=>{if(e.target.id==='conWrap')$('#conWrap').classList.remove('open')});
$('#conIn').addEventListener('keydown',e=>{const el=e.target;
  if(e.key==='Enter'){runCmd(el.value);el.value='';return}
  if(e.key==='ArrowUp'&&CHIST.length){e.preventDefault();chIdx=chIdx<0?CHIST.length-1:Math.max(0,chIdx-1);el.value=CHIST[chIdx];return}
  if(e.key==='ArrowDown'&&chIdx>=0){e.preventDefault();chIdx++;if(chIdx>=CHIST.length){chIdx=-1;el.value=''}else el.value=CHIST[chIdx];return}
  if(e.key==='Tab'){const f=$('#conSug button');if(f){e.preventDefault();el.value=f.dataset.arg+' ';suggest()}}});
$('#conIn').addEventListener('input',suggest);
document.addEventListener('keydown',e=>{if(e.key==='`'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();openCon()}
  if(e.key==='Escape'){$('#conWrap').classList.remove('open');if($('#sheetWrap').classList.contains('open')&&!blocking())closeSheet()}});
const net=()=>{$('#net').hidden=navigator.onLine};addEventListener('online',net);addEventListener('offline',net);
// Offline support when hosted (https or localhost); a file opened from Drive skips this.
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
let chartT;addEventListener('resize',()=>{clearTimeout(chartT);chartT=setTimeout(()=>{if(tab==='people')drawCharts();renderModes()},150)});
function setPanel(show){document.body.classList.toggle('nopanel',!show);UI.nopanel=!show;saveUI();const b=$('#panelBtn');b.setAttribute('aria-label',show?'Hide the side panel':'Show the side panel');b.textContent=show?'⤢':'⤡'}
$('#modeSel').addEventListener('change',e=>act('mapmode',e.target.value));
// folding or unfolding the phone crosses the wide/narrow line; the key's default follows it
if(window.matchMedia)matchMedia('(min-width:760px)').addEventListener('change',renderModes);
mapInit();renderModes();setPanel(!UI.nopanel);const had=load();net();render();if(!had)welcome();
else if(S.migrated){delete S.migrated;save();openSheet(`<div class="event"><div class="pic" aria-hidden="true">🗺️</div><h3>Your kingdom now has neighbors</h3><p>The kingdom has been redrawn on a larger map with land borders. Your buildings have been rebuilt around the capital, and you also hold two more provinces to grow into. Norvik lies to the north, Aurelia to the east and Solenne to the south, with unclaimed frontier between you.</p></div><button class="btn primary wide" data-act="closeSheet">Explore the map</button>`)}
</script>
</body>
