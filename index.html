/* ---------- the budget: taxes by class, spending priorities, spending groups and history ---------- */
// each class pays its own rate; the wealthier a class, the more each point of its tax raises
const TAXW={lower:1,middle:2.5,upper:6},TAXK=['lower','middle','upper'];
const CLN={lower:'Lower class',middle:'Middle class',upper:'Upper class'};
function taxc(){if(!S.taxc)S.taxc={lower:S.tax,middle:S.tax,upper:S.tax};return S.taxc}
// the tax law shapes the rates: per-capita tax means one rate for everyone; progressive tax means the wealthy never pay a lower rate than the poor
function taxFit(changed){const T=taxc(),L=S.laws.tax;
  if(L==='percapita'){const v=T[changed||'lower'];TAXK.forEach(k=>T[k]=v)}
  else if(L==='progressive'){if(changed==='upper'){T.middle=Math.min(T.middle,T.upper);T.lower=Math.min(T.lower,T.middle)}else if(changed==='middle'){T.lower=Math.min(T.lower,T.middle);T.upper=Math.max(T.upper,T.middle)}else{T.middle=Math.max(T.middle,T.lower);T.upper=Math.max(T.upper,T.middle)}}
  S.tax=Math.round((T.lower+T.middle+T.upper)/3)}
// spending priorities: each area's funding level scales its cost and its results
const FUNDL=['Minimal','Low','Standard','High','Lavish'],FUNDM=[.4,.7,1,1.4,1.9];
const FUND={
  health:{n:'Health',e:'🏥',v:[-20,-10,0,8,15],eff:['Healthcare −20.','Healthcare −10.','The usual care.','Healthcare +8.','Healthcare +15.']},
  edu:{n:'Education',e:'📚',v:[-20,-10,0,8,15],rp:[.8,.9,1,1.1,1.2],eff:['Education −20, research −20%.','Education −10, research −10%.','The usual schooling.','Education +8, research +10%.','Education +15, research +20%.']},
  infra:{n:'Infrastructure',e:'🛤️',v:[-15,-5,0,8,12],eff:['Transport −15, and buildings produce 10% less as they fall into disrepair.','Transport −5.','The usual upkeep.','Transport +8.','Transport +12, and the population grows 5% faster.']},
  def:{n:'Defense',e:'🛡️',q:[.7,.85,1,1.1,1.2],eff:['Army quality −30%.','Army quality −15%.','The usual training and supplies.','Army quality +10%.','Army quality +20%, and the landowners +5.']}};
const fund=k=>{const F=S.fund||(S.fund={});return F[k]==null?2:F[k]};
// spending falls into four groups
const BGRP={Crown:['Court life','Court offices','Royal allowances','Palace upkeep','Royal tutors','Appanages','Stipends','Co-opted leaders'],Defense:['Army and navy','Foreign protection'],Debt:['Debt interest','Obligations and repayments']};
const BCOL={Crown:'#7F77DD',State:'#1D9E75',Defense:'#D85A30',Debt:'#888780'};
function budgetGroups(c){const g={Crown:0,State:0,Defense:0,Debt:0};c.costs.forEach(([l,v])=>{const k=Object.keys(BGRP).find(k=>BGRP[k].includes(l))||'State';g[k]+=v});return g}
function budgetHTML(c){const T=taxc(),pc=S.laws.tax==='percapita';
  const taxRow=(k,lab,sub)=>`<div class="row"><div class="grow"><b>${lab} <span data-taxv="${k}">${T[k==='all'?'lower':k]}%</span></b><small>${sub}</small><input type="range" data-tax="${k}" min="0" max="30" step="1" value="${T[k==='all'?'lower':k]}" aria-label="${lab} tax rate"></div></div>`;
  const taxes=pc?taxRow('all','Everyone pays',`Per-capita tax: one rate for all. Raises 🪙${fmt(c.tax)} a month. It falls hardest on the lower class (mood ${c.cls.lower}).`)
    :TAXK.map(k=>taxRow(k,CLN[k],`Raises 🪙${fmt(c.taxBy[k])} a month. Mood ${c.cls[k]}.`)).join('');
  const fundRow=(k,F)=>{const lv=fund(k);return`<div class="row"><span class="em">${F.e}</span><div class="grow"><b>${F.n}</b> <span class="num" style="float:right">🪙${fmt(c.fundCost[k])}</span><small>${F.eff[lv]}</small><div class="seg">${FUNDL.map((l,j)=>`<button class="btn ${j===lv?'on':''}" data-act="fund" data-arg="${k}" data-n="${j}" aria-pressed="${j===lv}">${l}</button>`).join('')}</div></div></div>`};
  const court=`<div class="row"><span class="em">🎩</span><div class="grow"><b>Court and administration</b> <span class="num" style="float:right">🪙${fmt(courtCost())}</span><small>${COURT[S.court].d}</small><div class="seg">${COURT.map((C,j)=>`<button class="btn ${j===S.court?'on':''}" data-act="courtLvl" data-n="${j}" aria-pressed="${j===S.court}">${C.n}</button>`).join('')}</div></div></div>`;
  const g=budgetGroups(c),tot=Object.values(g).reduce((a,b)=>a+b,0)||1;
  const barH=`<div style="display:flex;height:14px;border-radius:4px;overflow:hidden;margin:10px 0 8px">${Object.entries(g).filter(([,v])=>v>0).map(([k,v])=>`<div style="width:${v/tot*100}%;background:${BCOL[k]}" title="${k}"></div>`).join('')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)">${Object.entries(g).map(([k,v])=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${BCOL[k]}"></span> ${k} ${Math.round(v/tot*100)}% (🪙${fmt(v)})</span>`).join('')}</div>`;
  // yearly averages of monthly income and spending
  const F=S.fin||[],yrs=[];for(let e=F.length;e>0&&yrs.length<5;e-=12){const s=F.slice(Math.max(0,e-12),e);yrs.unshift([s.reduce((a,x)=>a+x[0],0)/s.length,s.reduce((a,x)=>a+x[1],0)/s.length])}
  const mx=Math.max(1,...yrs.flat())*1.1,bw=Math.min(60,340/Math.max(1,yrs.length));
  const hist=yrs.length?`<svg viewBox="0 0 360 130" width="100%" role="img" aria-label="Average monthly income and spending, year by year">${yrs.map(([a,b],k)=>{const x=10+k*(bw+12),ha=a/mx*100,hb=b/mx*100,y=S.year-(yrs.length-1-k);
      return`<rect x="${x}" y="${108-ha}" width="${bw/2-2}" height="${ha}" rx="3" fill="#1D9E75"><title>Income ${fmt(a)}</title></rect><rect x="${x+bw/2}" y="${108-hb}" width="${bw/2-2}" height="${hb}" rx="3" fill="#D85A30"><title>Spending ${fmt(b)}</title></rect><text x="${x+bw/2}" y="124" text-anchor="middle" font-size="11" fill="currentColor">${k===yrs.length-1?'This year':'Year '+y}</text>`}).join('')}</svg>
    <div style="display:flex;gap:14px;font-size:.85rem;color:var(--muted)"><span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#1D9E75"></span> Income</span><span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:#D85A30"></span> Spending</span><span>Average per month</span></div>`
    :'<p class="hint">The chart fills in as the months pass.</p>';
  return`<h2>🧾 Taxes by class</h2><p class="hint">${pc?'Your tax law is per-capita tax, so everyone pays the same rate. Change the tax law in the Court tab to tax each class separately.':S.laws.tax==='progressive'?'Under progressive tax, a wealthier class never pays a lower rate than a poorer one.':'Under proportional tax, each class can be taxed at its own rate.'} Heavier taxes anger the class that pays them.</p><div class="card">${taxes}</div>
    <h2>⚖️ Spending priorities</h2><p class="hint">Fund each area more for better results, or less to save money. Costs grow with the buildings you have.</p><div class="card">${Object.entries(FUND).map(([k,F])=>fundRow(k,F)).join('')}${court}</div>
    <h2>📊 Where the money goes</h2><div class="card"><div class="row"><div class="grow">${barH}</div></div></div>
    <h2>📈 The last five years</h2><div class="card"><div class="row"><div class="grow">${hist}</div></div></div>`}

/* ---------- society: literacy and rising classes, luxuries, culture and faith, age structure, incidents, heritage ---------- */
// S.soc = {lit, mid, up, midT, upT, kids, adults, old, bM, mM}
function soc(){if(!S.soc)S.soc={lit:10,mid:null,up:null,kids:.38,adults:.55,old:.07,bM:0,mM:0};return S.soc}
// heritage: chosen when a kingdom is founded, a lasting mark on its people
const HERIT={mariners:{n:'Mariners',e:'⚓',d:'Trade capacity +20%, and overseas routes earn 20% more.'},farmers:{n:'Farmers',e:'🌾',d:'Food +15%, and the population grows 10% faster.'},
  warriors:{n:'Warriors',e:'⚔️',d:'Army quality +15%.'},scholars:{n:'Scholars',e:'📜',d:'Research +15%, and literacy rises faster.'},merchants:{n:'Merchants',e:'💰',d:'Tax income +8%, and business revenue +15%.'}};
const heritage=k=>typeof S!=='undefined'&&S&&S.herit===k;
// luxuries: each different one cheers the middle and upper classes
const LUX={spices:{n:'Spices',e:'🌶️',src:'A trade route to Carthen, or a spice colony'},sugar:{n:'Sugar',e:'🍬',src:'A trade route to Carthen, or a sugar colony'},
  silk:{n:'Silk',e:'🧣',src:'A trade route to Serenth'},tea:{n:'Tea',e:'🍵',src:'A trade route to Serenth'},porcelain:{n:'Porcelain',e:'🏺',src:'A trade route to Serenth, from the Enlightenment'},
  furs:{n:'Furs',e:'🦊',src:'A trade route to Valdor'},wine:{n:'Wine',e:'🍷',src:'A vineyard on the hills'},finery:{n:'Fine goods',e:'💎',src:'A luxury workshop, from the Age of Industry'}};
function luxHave(){const h=new Set(),O=S.ov;
  if(O&&O.known){if(routeLive('serenth')){h.add('silk');h.add('tea');if(era()>=1)h.add('porcelain')}if(routeLive('carthen')){h.add('spices');h.add('sugar')}if(routeLive('valdor'))h.add('furs');
    O.isl.forEach(I=>{if(I.o==='me'){if(I.res==='spice')h.add('spices');if(I.res==='sugar')h.add('sugar')}})}
  if(has('vineyard')&&!expAll('wine'))h.add('wine');if(has('atelier')&&!expAll('finery'))h.add('finery');return h}
const luxCount=()=>luxHave().size;
// culture and faith: provinces won from a neighbor keep that neighbor's people, who adopt your ways over time
const FAITH={me:'the Island Church',norvik:'the Northern Rite',solenne:'the Island Church',aurelia:'the Sun Creed'};
const CULN={norvik:'Norvik',solenne:'Solennais',aurelia:'Aurelian'};
const MINI=()=>({tolerance:0,assimilation:1,suppression:2}[S.laws.minorities]??1);
const minC=P=>P&&P.cul?1-(P.cult??100)/100:0,minF=P=>P&&P.cul?1-(P.fth??100)/100:0;
const minPen=P=>{const l=MINI();return minC(P)*[1,4,12][l]+minF(P)*[1,3,8][l]};
function newPeople(P,from){if(NATIONS[from]&&P.core!=='me'){P.cul=from;P.cult=0;P.fth=FAITH[from]===FAITH.me?100:0}else{delete P.cul;delete P.cult;delete P.fth}}
// incidents: fires and epidemics strike dense provinces that lack watchmen, fire engines, clean water and good health
const provDens=i=>(S.prov[i].pop||0)/Math.max(1,provTiles(i).length);
const bIn=(i,b)=>provTiles(i).filter(t=>S.map[t].b===b).length;
const fireProt=i=>Math.min(.9,bIn(i,'watch')*.35+bIn(i,'firestation')*.7+adjProvs(i).filter(j=>S.prov[j].o==='me').reduce((a,j)=>a+bIn(j,'firestation')*.3,0));

/* each month */
function socMonth(c,notes,stop){const s=soc(),own=provsOf('me');
  // literacy rises toward what your schools teach; families rise into the middle and upper classes as literacy, prosperity and jobs allow
  const litT=clamp(c.sc.learn*.85+era()*4+(heritage('scholars')?8:0),3,99);s.lit=Math.round((s.lit+(litT-s.lit)*.015*(heritage('scholars')?1.25:1))*100)/100;
  const prosp=(c.sc.homes+c.sc.goods+c.sc.health+c.sc.jobs)/400,serf=S.laws.labor==='serfdom';
  s.midT=clamp(.04+s.lit/100*.25*prosp+c.t.mid/Math.max(1,S.pop)*.5,.05,.55);s.upT=clamp(.025+s.lit/100*.05*prosp+luxCount()*.006+(serf?.02:0),.03,.16);
  const mob=serf?.004:.012;s.mid+= (s.midT-s.mid)*mob;s.up+=(s.upT-s.up)*mob;
  // the generations: children grow up, adults age, and the old pass on sooner or later depending on health and the age
  const P=Math.max(1,S.pop),b=s.bM/P,m=s.mM/P;s.bM=0;s.mM=0;const life=8+Math.min(100,c.sc.health)/10+era()*3;
  const dO=s.old/(life*12),k=s.kids+b+m*.35+dO-s.kids/192,a=s.adults+s.kids/192-s.adults/480+m*.6,o=s.old+s.adults/480+m*.05-dO,tot=k+a+o;s.kids=k/tot;s.adults=a/tot;s.old=o/tot;
  // culture and faith
  const L=MINI(),rate=[.5,1,2.2][L];
  own.forEach(i=>{const Pr=S.prov[i];if(!Pr.cul)return;const p=c.pv[i];const hasChurch=bIn(i,'church')>0;
    Pr.cult=Math.min(100,(Pr.cult??0)+(.25+(govKid(Pr)?.3:0)+(p&&p.sc.learn>=60?.25:0)+((Pr.integ??100)>=100?.15:0))*rate);
    Pr.fth=Math.min(100,(Pr.fth??0)+(.25+(hasChurch?.35:0)+(S.laws.church==='state'?.2:0))*rate);
    const mm=minC(Pr)+minF(Pr);if(mm>0&&NATIONS[Pr.cul]&&!isFallen(Pr.cul)&&L>0){relA(Pr.cul,-mm*[0,.05,.3][L]);if(L===2)tenA(Pr.cul,mm*.3)}
    if(Pr.cult>=100&&Pr.fth>=100){notes.push(['🤝',`${Pr.name} has adopted your ways`,`Its ${CULN[Pr.cul]} people now share your language and faith.`]);delete Pr.cul;delete Pr.cult;delete Pr.fth}});
  // incidents, at most one a year in each province
  own.forEach(i=>{const Pr=S.prov[i];if(!Pr.pop||Pr.revolt||(Pr.incCd>S.turn))return;const d=provDens(i),p=c.pv[i];if(!p)return;
    const pF=Math.min(.08,d/400*.03)*(1-fireProt(i))*(era()>=2?1.2:1);
    if(Math.random()<pF){const tl=provTiles(i).filter(t=>S.map[t].hs);let lost=0,homes=0;tl.sort(()=>Math.random()-.5).slice(0,1+rnd(3)).forEach(t=>{S.map[t].hs=null;delete S.map[t].hp;homes++});
      const bt=provTiles(i).filter(t=>{const x=S.map[t];return x.b&&B[x.b]&&!B[x.b].fixed&&x.b!=='hall'});let bn='';if(bt.length&&Math.random()<.3){const t=pick(bt);bn=B[S.map[t].b].n;S.map[t].b=null}
      lost=Math.min(Pr.pop,Math.ceil(Pr.pop*.01));Pr.pop-=lost;Pr.incCd=S.turn+12;const t=`Fire in ${Pr.name}`;
      notes.push(['🔥',t,`${homes} block${homes===1?'':'s'} of homes${bn?` and a ${bn.toLowerCase()}`:''} burned down, and ${lost} people died. Watch houses and fire stations make fires rarer.`]);stop.push(t);return}
    const pE=Math.min(.05,d/400*.02)*(1-Math.min(100,p.sc.health)/100)*(1-Math.min(100,p.sc.water)/200)*(campOn('health')?.5:1);
    if(Math.random()<pE){const lost=Math.min(Pr.pop,Math.ceil(Pr.pop*(.04+Math.random()*.06)));Pr.pop-=lost;Pr.incCd=S.turn+12;
      adjProvs(i).filter(j=>S.prov[j].o==='me'&&S.prov[j].pop).forEach(j=>{S.prov[j].pop-=Math.ceil(S.prov[j].pop*.02)});addMod('health',-10,3,'Epidemic');
      const t=`Epidemic in ${Pr.name}`;notes.push(['🦠',t,`${lost} people died, and the sickness spread to neighboring provinces. Clean water, healthcare and hospitals keep epidemics away.`]);stop.push(t)}});
  syncPop()}

/* screens */
function societyHTML(c){const s=soc(),ar=v=>v>.002?' ↑':v<-.002?' ↓':'';
  const age=[['Children',s.kids,'#85B7EB'],['Working age',s.adults,'#1D9E75'],['Elderly',s.old,'#BA7517']];
  return`<h2>📚 Literacy and the classes</h2><div class="card"><div class="row"><span class="em">📖</span><div class="grow"><b>Literacy ${Math.round(s.lit)}%</b><small>Rises slowly with schooling (education ${c.sc.learn}). Literate kingdoms research faster, and literacy lets families rise into the middle and upper classes.</small>${bar(s.lit)}</div></div>
    ${c.skill?`<div class="row"><span class="em">🎓</span><div class="grow"><b>Skilled workers: ${fmt(c.skill.sw)} for ${fmt(c.skill.sj)} skilled jobs</b><small>${c.skill.f<1?`Schools, infirmaries, banks and other skilled buildings run at ${Math.round(c.skill.f*100)}% strength. Raise literacy and grow the middle class to staff them.`:'Schools, infirmaries, banks and other skilled buildings are fully staffed by the middle and upper classes and literate workers.'}</small>${bar(Math.min(100,c.skill.sj?c.skill.sw/c.skill.sj*100:100))}</div></div>`:''}
    <div class="row"><div class="grow"><small>Middle class ${Math.round((s.mid??c.share.middle)*100)}%${ar((s.midT??s.mid)-s.mid)}, heading for ${Math.round((s.midT??s.mid??0)*100)}%. Upper class ${Math.round((s.up??c.share.upper)*100)}%${ar((s.upT??s.up)-s.up)}, heading for ${Math.round((s.upT??s.up??0)*100)}%. Classes grow with literacy, prosperity, middle-class jobs and luxuries, and change over decades.${S.laws.labor==='serfdom'?' Serfdom keeps families tied to their station.':''}</small></div></div></div>
    <h2>👪 The generations</h2><div class="card"><div class="row"><div class="grow"><div style="display:flex;height:14px;border-radius:4px;overflow:hidden;margin:4px 0 8px">${age.map(([n,v,col])=>`<div style="width:${v*100}%;background:${col}" title="${n}"></div>`).join('')}</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;color:var(--muted)">${age.map(([n,v,col])=>`<span><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${col}"></span> ${n} ${Math.round(v*100)}%</span>`).join('')}</div>
      <small style="margin-top:6px">Only those of working age can work. Births swell the young, peace brings baby booms, and better health lets people live longer, which in the modern age makes pensions dearer.</small></div></div></div>`}
function luxHTML(){const h=luxHave();return`<h2>💎 Luxuries</h2><p class="hint">The middle and upper classes prize variety: each different luxury raises their mood. You have ${h.size} of ${Object.keys(LUX).length}.</p><div class="card">${Object.entries(LUX).map(([k,L])=>`<div class="row"><span class="em" ${h.has(k)?'':'style="opacity:.4"'}>${L.e}</span><div class="grow"><b>${L.n}</b><small>${h.has(k)?'Available.':L.src+'.'}</small></div>${h.has(k)?'<span class="tag" style="color:var(--good)">Have</span>':''}</div>`).join('')}</div>`}
function peopleRow(i){const P=S.prov[i];if(!P.cul)return'';const cu=Math.round(P.cult??0),fa=Math.round(P.fth??0);
  return`<div class="row"><span class="em">🗣️</span><div class="grow"><b>A ${CULN[P.cul]} ${cu>=50?'minority':'province'}</b><small>${cu}% share your culture, ${100-cu}% are ${CULN[P.cul]}. ${fa}% follow ${FAITH.me}${fa<100?`, ${100-fa}% ${FAITH[P.cul]}`:''}. Under ${law('minorities').n.toLowerCase()}, minorities cost ${Math.round(minPen(P))} mood here. Schools, a governor, a church and integration speed their adoption of your ways.</small>${bar(cu,'var(--deep)')}</div></div>`}

/* ---------- settlements ---------- */
// Groups of touching homes (corners count) inside one province form a settlement. S.setl = {id:{name,f,q:[quarter names],ch,r}}; tiles with homes carry x.sid.
const SRANK=[{n:'Hamlet',p:0,need:[]},{n:'Village',p:100,need:[]},{n:'Town',p:500,need:['market']},{n:'City',p:2000,need:['market','church','school','water']},{n:'Great city',p:10000,need:['market','church','school','water','hospital','culture']},{n:'Metropolis',p:50000,need:['market','church','school','water','hosp2','uni','rail','commerce']}];
const SNEED={market:{n:'a market',b:['market','deptstore']},church:{n:'a church',b:['church']},school:{n:'a school or library',b:['school','library','university','polytechnic','printhouse']},
  water:{n:'clean water',b:['well','waterworks']},hospital:{n:'an infirmary or hospital',b:['clinic','hospital']},culture:{n:'a university, assembly hall or cinema',b:['university','tent','cinema']},
  hosp2:{n:'a hospital',b:['hospital']},uni:{n:'a university',b:['university']},rail:{n:'a railway',b:['rail']},commerce:{n:'a department store or bank',b:['deptstore','bank']}};
// homes on farmland, fishing docks, vineyards, forests and mines are farmsteads: they house people but belong to the countryside, not to a town
const RURAL=['farm','dock','greenhouse','vineyard','lumber','quarry','mine','coalmine','charcoal'];
const SEMO=['🛖','🏡','🏘️','🏙️','🌆','🌃'],CHARTER=1500;
const setls=()=>S.setl||(S.setl={});
const homeTile=x=>(x.o==='me'||!!NATIONS[x.o])&&x.t!=='w'&&!!(x.hs||(x.b&&B[x.b]&&B[x.b].homes))&&!(x.b&&RURAL.includes(x.b));
function setlName(cul){const N=NAMEP[cul]||NAMEP.me,used=new Set([...S.prov.map(P=>P.name),...Object.values(setls()).flatMap(s=>[s.name,...(s.q||[])])]);
  for(let t=0;t<80;t++){const nm=pick(N.a)+pick(N.b);if(!used.has(nm))return nm}return pick(N.a)+pick(N.b)}
let SETLC=null;const setlDirty=()=>{SETLC=null};
// regroup the homes each month: new settlements are founded, touching ones merge (the bigger keeps its name), cut-off parts split away
function setlUpdate(notes,stop){const Sx=setls(),all=notes;
  // every nation's homes form settlements; only your own are announced
  S.map.forEach(x=>{if(x.sid!=null&&!homeTile(x))delete x.sid});
  // a town you capture stays whole: its scattered homes keep belonging to it, and new homes beside any of them join it
  S.map.forEach(x=>{const X=x.sid!=null&&Sx[x.sid];if(X&&x.o==='me'&&X.o&&X.o!=='me')X.loose=true});
  const done=new Uint8Array(S.map.length),groups=[];
  const flood=(seeds,p)=>{const g=[],st=[...seeds];seeds.forEach(i=>{done[i]=1});
    while(st.length){const t=st.pop();g.push(t);const r=t/W|0,cc=t%W;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,c2=cc+dc;if(rr<0||c2<0||rr>=H||c2>=W)continue;const j=rr*W+c2;if(done[j])continue;const y=S.map[j];if(y.o==='me'&&homeTile(y)&&y.p===p){done[j]=1;st.push(j)}}}
    groups.push(g)};
  Object.keys(Sx).forEach(id=>{if(!Sx[id].loose)return;const byP={};S.map.forEach((x,i)=>{if(!done[i]&&x.sid===id&&x.o==='me'&&homeTile(x))(byP[x.p]=byP[x.p]||[]).push(i)});
    const ps=Object.keys(byP);if(!ps.length)delete Sx[id].loose;ps.forEach(p=>flood(byP[p],+p))});
  S.map.forEach((x,i)=>{if(done[i]||!homeTile(x))return;
    if(x.o!=='me'){const g=provTiles(x.p).filter(t=>homeTile(S.map[t])&&S.map[t].o===x.o);g.forEach(t=>{done[t]=1});groups.push(g);return} // a neighbor's scattered homes make one town per province
    flood([i],x.p)});
  groups.sort((a,b)=>b.length-a.length);const claimed=new Set();
  groups.forEach(g=>{const own=S.map[g[0]].o,notes=own==='me'?all:[];const cnt={};g.forEach(t=>{const s=S.map[t].sid;if(s!=null&&Sx[s])cnt[s]=(cnt[s]||0)+1});
    const ids=Object.keys(cnt).filter(s=>!claimed.has(s)).sort((a,b)=>cnt[b]-cnt[a]);let id;
    if(!ids.length){const prev=Object.keys(cnt)[0],par=prev&&Sx[prev];let nm=par&&par.q&&par.q.length?par.q.pop():null;const back=!!nm;
      const P=S.prov[S.map[g[0]].p],cul=own!=='me'?own:P.cul||(P.core&&P.core!=='me'&&NATIONS[P.core]?P.core:'me');
      if(!nm){const byHall=own==='me'&&g.some(t=>S.map[t].b==='hall'||NB(t).some(j=>S.map[j].b==='hall'));nm=byHall&&!Object.values(Sx).some(s=>s.name===S.name)?S.name:setlName(cul)}
      id=String(S.setlN=(S.setlN||0)+1);Sx[id]={name:nm,f:S.year,q:[],r:0};notes.push(back?['🏘️',`${nm} becomes its own settlement again`,`Cut off from ${par.name}, the old quarter stands alone once more.`]:['🏘️',`${nm} is founded`,`A new settlement grows in ${P.name}.`])}
    else{id=ids[0];ids.slice(1).forEach(o=>{const O=Sx[o];Sx[id].q=[...(Sx[id].q||[]),O.name,...(O.q||[])];if(O.ch)Sx[id].ch=true;
      notes.push(['🏙️',`${O.name} merges into ${Sx[id].name}`,`${O.name} is now one of ${Sx[id].name}’s quarters.`]);delete Sx[o]})}
    claimed.add(id);Sx[id].o=own;g.forEach(t=>{S.map[t].sid=id})});
  Object.keys(Sx).forEach(id=>{if(!claimed.has(id)){if(Sx[id].o==='me')notes.push(['🏚️',`${Sx[id].name} is abandoned`,'Its last homes are gone.']);delete Sx[id]}});
  setlDirty();const st=setlStats(true);
  Object.values(st).forEach(s=>{const X=Sx[s.id];if(!X)return;if(s.o==='me'&&s.r>(X.r||0)&&s.r>=2){const t=`${X.name} becomes a ${SRANK[s.r].n.toLowerCase()}`;notes.push([SEMO[s.r],t,`It now has ${fmt(s.pop)} people and the services a ${SRANK[s.r].n.toLowerCase()} needs.`]);stop.push(t)}X.r=s.r})}
// size, services and rank of each settlement (cached until the month changes or something is built)
function setlStats(noInit){if(!noInit&&!S.setlInit){S.setlInit=1;setlUpdate([],[])}
  if(SETLC&&SETLC.turn===S.turn&&SETLC.map===S.map)return SETLC.v;
  const Sx=setls(),v={};S.map.forEach((x,i)=>{const id=x.sid;if(id==null||!Sx[id])return;const s=v[id]||(v[id]={id,t:[],homes:0,p:x.p,o:x.o,bs:new Set()});s.t.push(i);s.homes+=homesOf(x)});
  Object.values(v).forEach(s=>{s.t.forEach(t=>{const r=t/W|0,c=t%W;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=H||cc>=W)continue;const y=S.map[rr*W+cc];if(y.o===s.o){if(y.b)s.bs.add(y.b);if(y.sm)s.bs.add(y.sm)}}});
    s.pop=Math.round((S.prov[s.p].pop||0)*s.homes/Math.max(1,homesIn(s.p)));const ok=k=>SNEED[k].b.some(b=>s.bs.has(b));let r=0,block=null;
    for(let k=1;k<SRANK.length;k++){const R=SRANK[k];if(s.pop<R.p)break;const miss=s.o==='me'?R.need.filter(n=>!ok(n)):[];if(miss.length){block={r:k,miss};break}r=k}
    s.r=r;s.block=block;s.cx=s.t.reduce((a,t)=>a+t%W,0)/s.t.length;s.cy=s.t.reduce((a,t)=>a+(t/W|0),0)/s.t.length;
    if(s.o!=='me'){const k=s.t.reduce((b,t)=>Math.hypot(t%W-s.cx,(t/W|0)-s.cy)<Math.hypot(b%W-s.cx,(b/W|0)-s.cy)?t:b);s.cx=k%W;s.cy=k/W|0}});
  SETLC={turn:S.turn,map:S.map,v};return v}
const setlCount=r=>Object.values(setlStats()).filter(s=>s.o==='me'&&s.r>=r).length;

/* ---------- migration ---------- */
// people move between you and your neighbors toward the better life. S.mig = {n: net flow last month (+ to you)}, S.migY = {in,out} this year
const MIGL=()=>({open:1.5,selective:.6,closed:.1}[S.laws.immigration]??.6);
const nPop=n=>provsOf(n).reduce((a,i)=>a+(S.prov[i].pop||0),0);
const sRound=v=>Math.floor(v)+(Math.random()<v%1?1:0);
const takeFrom=(n,k)=>{provsOf(n).sort((a,b)=>(S.prov[b].pop||0)-(S.prov[a].pop||0)).forEach(i=>{const t=Math.min(k,S.prov[i].pop||0);S.prov[i].pop=(S.prov[i].pop||0)-t;k-=t})};
// how appealing life is: approval, work and homes at home; peace, stability and their ruler abroad
function attrMe(c){const room=c.t.homes-S.pop;return S.hap+(c.sc.jobs>=90?5:c.sc.jobs<60?-10:0)+(room>0?5:-10)+(S.war?-15:0)+(c.sc.food<30?-25:0)}
function attrN(n){return 50+{stable:0,indebted:-10,troubled:-20}[S.nsit[n]||'stable']+(nwarOf(n)||atWarWith(n)?-25:0)+(pers(n,'cautious')?5:pers(n,'greedy')?-5:0)+era()*2}
// newcomers settle where there is room, as a minority of their own culture and faith
function settleIn(n,count,lit){count=Math.round(count);if(count<=0)return 0;const own=provsOf('me').map(i=>[i,homesIn(i)*1.1-(S.prov[i].pop||0)]).filter(([,r])=>r>0).sort((a,b)=>b[1]-a[1]);let left=count;
  own.forEach(([i,room])=>{if(left<=0)return;const k=Math.min(left,Math.ceil(room));const P=S.prov[i],old=P.pop||0;P.pop=old+k;left-=k;
    if(!P.cul){P.cul=n;P.cult=100;P.fth=100}P.cult=(P.cult*old)/(old+k);P.fth=((P.fth??100)*old+(FAITH[n]===FAITH.me?100:0)*k)/(old+k)});
  const got=count-left;if(got>0){const s=soc(),pop=Math.max(1,S.pop);s.lit=Math.min(99,(s.lit*pop+(lit??35)*got)/(pop+got));s.mM+=got}syncPop();return got}
function migMonth(c,notes,stop){S.mig={};S.migY=S.migY||{in:0,out:0};const me=attrMe(c),L=MIGL(),pop=Math.max(1,S.pop);
  liveNations().forEach(n=>{const d=me-attrN(n),np=nPop(n);let net=0;
    if(d>5&&np>20){const want=sRound(Math.min(np*.0015*(d-5)/20*L,np*.02));const got=settleIn(n,want,S.laws.immigration==='selective'?75:35);
      if(got){const tl=provsOf(n);let left=got;tl.forEach(i=>{if(left<=0)return;const k=Math.min(left,Math.ceil((S.prov[i].pop||0)*got/np));S.prov[i].pop=Math.max(0,(S.prov[i].pop||0)-k);left-=k});net=got}}
    else if(d<-5){const out=Math.min(sRound(pop*.001*(-d-5)/20*(S.laws.immigration==='closed'?.4:1)),Math.max(0,S.pop-10));if(out>0){removePop(out);const tl=provsOf(n);if(tl.length){const i=tl.sort((a,b)=>(S.prov[b].pop||0)-(S.prov[a].pop||0))[0];S.prov[i].pop=(S.prov[i].pop||0)+out}net=-out}}
    S.mig[n]=net;if(net>0)S.migY.in+=net;else S.migY.out-=net;
    // refugees flee wars and troubles
    if(!(S.refCd&&S.refCd[n]>S.turn)&&(nwarOf(n)||S.nsit[n]==='troubled')&&np>40&&Math.random()<.02&&!queue.some(e=>e.id==='refugees')){S.refCd=S.refCd||{};S.refCd[n]=S.turn+24;queue.push(refugeeEvent(n));stop.push(`Refugees from ${NATIONS[n].n}`)}});
  if(S.month===0&&(S.migY.in||S.migY.out)){notes.push(['🧳','Migration last year',`${fmt(S.migY.in)} people came from neighboring kingdoms, and ${fmt(S.migY.out)} left for them. Under ${law('immigration').n.toLowerCase()}, newcomers settle as minorities of their own culture.`]);S.migY={in:0,out:0}}}
function refugeeEvent(n){const np=nPop(n),size=Math.max(10,Math.round(np*.04)),why=nwarOf(n)?'war':'turmoil';
  return{id:'refugees',e:'🧳',t:`Refugees from ${NATIONS[n].n}`,d:`Fleeing ${why}, about ${fmt(size)} people from ${NATIONS[n].n} are at your borders, asking to be taken in.`,ch:[
    {l:'Take them all in',f(){const got=settleIn(n,size,30);takeFrom(n,got);
      relA(n,5);igM('workers',-5,12,'Refugees competing for work');igM('clergy',3,12,'Christian charity');igM('intelligentsia',4,12,'A humane welcome');return`${fmt(got)} refugees settle in your provinces, keeping their own language and faith.`}},
    {l:'Take only the skilled',f(){const got=settleIn(n,Math.round(size*.3),85);takeFrom(n,got);relA(n,-2);igM('merchants',3,12,'Skilled newcomers');return`${fmt(got)} craftsmen, clerks and physicians are admitted. The rest are turned away.`}},
    {l:'Turn them away',f(){relA(n,-8);igM('intelligentsia',-5,12,'Refugees turned away');igM('workers',3,12,'Borders kept closed');return'The border stays shut, and the refugees go elsewhere.'}}]}}
const migLine=n=>{const v=(S.mig||{})[n]||0;return v>0?`${fmt(v)} people moved here from ${NATIONS[n].n} last month.`:v<0?`${fmt(-v)} of your people moved to ${NATIONS[n].n} last month.`:'No one moved between you last month.'};
/* ---------- neighbors grow ---------- */
// Foreign provinces grow toward what their land can hold. That rises with the age, and with how densely your own kingdom is settled, so they keep pace.
// P.ng tracks their natural growth; only part of it adds to their armies, since their strength already rises with time.
const NCAP=[10,16,28,45];
const landOf=i=>provTiles(i).filter(t=>S.map[t].t!=='w').length;
function nCap(i){const own=provsOf('me'),myLand=own.reduce((a,j)=>a+landOf(j),0)||1;return landOf(i)*Math.max(NCAP[Math.min(3,era())],S.pop/myLand*.6)}
function nGrowMonth(){const r0=[.012,.018,.03,.025][Math.min(3,era())]/12;
  liveNations().forEach(n=>{const f=nwarOf(n)||atWarWith(n)?0:{stable:1,indebted:.8,troubled:.5}[S.nsit[n]||'stable'];if(!f)return;
    provsOf(n).forEach(i=>{const P=S.prov[i];if(!P.pop)return;const cap=nCap(i);if(P.pop>=cap)return;
      const g=sRound(P.pop*r0*f*(1-P.pop/cap));if(g>0){P.pop+=g;P.ng=(P.ng||0)+g}})})}

/* ---------- why a need stands where it does ---------- */
// what you have against what your people need, which provinces fall short, and what you could build
const NLOC={health:'Infirmaries and hospitals care for',learn:'Schools and libraries teach',fun:'Leisure places entertain',move:'Transport serves',water:'Wells and waterworks supply'};
function needWhy(k,c){const t=c.t,p=fmt(c.pop);let s='';
  const res=r=>{const T=c.tr[r],short=c.sup[r]<c.dem[r]-.5;return`You produce ${fmt(c.prod[r])} and need ${fmt(c.dem[r])}${T&&T.dir==='import'?`, and import ${fmt(T.amt)}`:T&&T.dir==='export'?`, and export ${fmt(T.amt)}`:''}.${short?' '+tradeWhy(r,c):''}`};
  if(k==='homes')s=`Homes for ${fmt(t.homes)} and ${p} people, so homes are ${Math.round(c.occ*100)}% full. Above 80% full, rents rise and this falls. Private builders add homes where there is work and calm.`;
  else if(k==='jobs')s=`${fmt(t.jobs)} jobs, counting private trades, for ${fmt(c.workers)} people of working age.`;
  else if(k==='food')s=res('food');else if(k==='goods')s=res('goods');else if(k==='power')s=res('energy');
  else if(k==='nature')s=`Starts at 55. Forests and parks raise it; smoky industry and run-down neighborhoods lower it.`;
  else if(NLOC[k])s=`${NLOC[k]} ${fmt(t[k])} of your ${p} people${k==='move'?'. In the capital, the first 100 can walk, and in other provinces the first 40':k==='water'?'. The capital’s springs supply 50, and other provinces 20':''}.${c.needBonus&&c.needBonus[k]?` Technology, decrees and funding add ${c.needBonus[k]>0?'+':''}${Math.round(c.needBonus[k])}.`:''}`;
  if(k==='health'&&c.sc.water<100)s+=' Poor water lowers health.';
  if(k==='health'&&c.polluted>.05)s+=' Pollution lowers health.';
  // local needs are counted province by province: name the ones that fall short
  if(['homes','jobs','health','learn','fun','move','water'].includes(k)){const low=provsOf('me').filter(i=>c.pv[i]&&c.pv[i].pop>0&&c.pv[i].sc[k]<60).sort((a,b)=>c.pv[a].sc[k]-c.pv[b].sc[k]).slice(0,3);
    if(low.length)s+=` Each province needs its own, though spare capacity helps neighboring provinces a little. Shortest: ${low.map(i=>{const q=c.pv[i],need=k==='jobs'?q.workers:k==='homes'?q.pop:q.pop,have=k==='homes'?q.homes:q.eff?q.eff[k]:q[k];return`${S.prov[i].name} ${q.sc[k]} (${fmt(have)} for ${fmt(need)})`}).join(', ')}.`}
  const m=modSum(k);if(m)s+=` Temporary effects: ${m>0?'+':''}${Math.round(m)}.`;return s}
// why a shortfall is not being imported
function tradeWhy(r,c){const p=S.trade[r],N=p&&NATIONS[p]?NATIONS[p].n:'';if(!p)return'No trade partner is chosen for it, so nothing is imported: pick one on the Economy tab.';
  if(isFallen(p))return`Your trade partner, ${N}, has fallen: pick another on the Economy tab.`;if(atWarWith(p))return`You are at war with ${N}, your trade partner, so nothing is imported.`;
  if(S.embargo[p])return`${N} has an embargo on you, so nothing is imported.`;if(S.rel[p]<20)return`Relations with ${N} are below 20, too poor to trade.`;
  return'Trade capacity is used up, so the rest cannot be imported: build docks, a canal or trade routes.'}
// a need explained in a sheet, from the Map tab
function needSheet(k){const c=calc(),n=NEEDS.find(x=>x.k===k);if(!n)return;const v=c.sc[k];
  openSheet(`<h3>${n.e} ${n.n}: ${v}</h3>${bar(v)}<p class="hint">${needWhy(k,c)}</p>${v<100?`<p class="hint"><b>To improve:</b> ${n.tip}${needBuild(k)}</p>`:''}<div class="btns"><button class="btn" data-act="needGo">All needs on the People tab</button></div><button class="btn primary wide" data-act="closeSheet">Done</button>`)}

  return opts.length?` You can build: ${opts.map(([,d])=>`${d.e} ${d.n} (${fmt(d[f])} for 🪙${fmt(d.c)})`).join(', ')}.`:''}

  return `<div class="row"><span class="em">${i===0?'👑':P.revolt?'🔥':'🏘️'}</span><div class="grow"><b>${P.name}</b> ${tag}${(P.integ??100)<100?` <span class="tag">${Math.round(P.integ)}% integrated</span>`:''}<small>${fmt(P.pop||0)} people, homes for ${fmt(p.homes)}. Unrest ${u}.</small>${bar(m)}</div><span class="num" style="color:${col(m)}">${m}</span><button class="btn" data-act="provInfo" data-arg="${i}">View</button></div>`}).join('')}
function peopleHTML(){const c=calc(),low=NEEDS.slice().sort((a,b)=>c.sc[a.k]-c.sc[b.k]),hi=low[low.length-1];
  const NAMES=['M. Arden','J. Okafor','L. Brandt','S. Moreau','D. Kowal','R. Silva','A. Lindqvist','T. Hale','N. Petrov','E. Castell'];
  const quotes=[low[0],low[1],hi].map((n,i)=>{const nm=NAMES[(S.turn*3+i*4)%NAMES.length];const good=c.sc[n.k]>=70;return `<div class="row"><span class="em">${n.e}</span><div class="grow"><span class="quote">\u201c${good?n.hi:n.lo}\u201d</span><small>${nm}</small></div></div>`}).join('');
  const classes=Object.entries(CLASSES).map(([k,C])=>{const v=c.cls[k],p=Math.round(S.pop*c.share[k]);const worst=Object.keys(C.w).sort((a,b)=>c.sc[a]-c.sc[b])[0],wn=NEEDS.find(n=>n.k===worst);
    return `<div class="row"><span class="em">${C.e}</span><div class="grow"><b>${C.n}</b> <span class="tag">${fmt(p)} people</span><small>${C.d} Biggest worry: ${wn.n.toLowerCase()}.</small>${bar(v)}</div><span class="num" style="color:${col(v)}">${v}</span></div>`}).join('');
  const needs=NEEDS.map(n=>`<div class="row"><span class="em">${n.e}</span><div class="grow"><b>${n.n}</b>${bar(c.sc[n.k])}<small>${needWhy(n.k,c)}${c.sc[n.k]<70?` <b>To improve:</b> ${n.tip}${needBuild(n.k)}`:''}</small></div><span class="num" style="color:${col(c.sc[n.k])}">${c.sc[n.k]}</span></div>`).join('');
  const lbl={hap:'Approval',inc:'Monthly budget',tour:'Tourism',foodprod:'Food production',leg:'Legitimacy'};
  const mods=S.mods.map(m=>{const nm=m.k.startsWith('ig:')?IGS[m.k.slice(3)].n+' mood':lbl[m.k]||(NEEDS.find(n=>n.k===m.k)||{n:m.k}).n;return `<div class="row"><div class="grow"><b>${m.l}</b><small>${nm} ${m.v>0?'+':''}${m.v}${m.k==='inc'?' a month':m.k==='tour'||m.k==='foodprod'?'%':''} for ${m.m} more month${m.m>1?'s':''}</small></div></div>`}).join('');
  return `<div class="mood"><div class="grow"><div class="big" style="color:${col(S.hap)}">${S.hap}%</div><div class="sub">approval, trending toward ${c.target}%</div></div><button class="btn" data-act="why" data-arg="approval">Why?</button></div>
  <h2>History</h2>${histHTML()}
  <h2>Provinces</h2><p class="hint">Each province has its own people, services and mood. Approval is their average, weighted by population.</p><div class="card">${provRows(c)}</div>
  ${setlHTML()}
  <p class="hint">${fmt(S.pop)} subjects, ${fmt(c.workers)} of working age, ${fmt(c.employed)} employed. Housing for ${fmt(c.t.homes)}. Cost of living is ${c.colIdx>1.05?`${Math.round((c.colIdx-1)*100)}% above normal`:c.colIdx<.95?`${Math.round((1-c.colIdx)*100)}% below normal`:'normal'}.</p>
  <h2>Social classes</h2><div class="card">${classes}</div>
  ${societyHTML(c)}
  <p class="hint">Each class cares about different things, and tax laws weigh on them differently. Approval is the average, weighted by class size.</p>
  <h2>Public opinion</h2><div class="card">${quotes}</div>
  <h2>Needs</h2><div class="card">${needs}</div>
  ${mods?`<h2>Active effects</h2><div class="card">${mods}</div>`:''}`}
function courtHTML(){const c=calc(),m=S.monarch,h=S.heir;
  const igs=IGIDS.map(k=>{const G=IGS[k],md=c.mood[k],[st,sc]=igStatus(md),cl=Math.round(c.clout[k]*100);
    const gp=Math.round(groupPressure(k)),notes=[gp?`Wants reform: −${gp}.`:'',stipend(k)?`Stipend +${stipend(k)*4}.`:'',coopted(k)?'Leaders co-opted.':'',suppressed(k)?'Suppressed.':''].filter(Boolean).join(' ');
    return `<div class="row"><span class="em">${G.e}</span><div class="grow"><b>${G.n}</b> <span class="tag" style="color:${sc}">${st}</span><small>${G.d} Clout ${cl}%. Mood ${md}.${notes?' '+notes:''}</small>${bar(md)}</div><button class="btn" data-act="group" data-arg="${k}">Options</button></div>`}).join('');
  // categories open with the eras; options can open later still; suffrage needs an elected assembly
  const laws=Object.entries(LAWS).filter(([cat])=>(LAW_ERA[cat]||0)<=era()).map(([cat,L])=>{const cur=S.laws[cat],en=S.enact&&S.enact.cat===cat,exps=activeExp().filter(E=>E.cat===cat&&expState(E)!=='met');
    const opts=Object.entries(L.o).map(([k,o])=>{const sup=IGIDS.filter(g=>(IGS[g].likes[cat]||{})[k]>=10).map(g=>IGS[g].e).join(''),opp=IGIDS.filter(g=>(IGS[g].likes[cat]||{})[k]<=-10).map(g=>IGS[g].e).join('');
      const lock=o.era>era()?`Opens in the ${ERAS[o.era].n}`:L.needs&&!L.needs.includes(S.laws.government)?'Needs a parliament':'';
      const tag=exps.some(E=>E.want.includes(k))?' <span class="tag" style="color:var(--good)">Expected in this era</span>':exps.some(E=>(E.half||[]).includes(k))?' <span class="tag">Partly satisfies</span>':'';
      return `<div class="row"><div class="grow"><b>${o.n}${k===cur?' (current)':''}</b>${tag}<small>${o.d}</small>${sup||opp?`<small>${sup?`Supported by ${sup}. `:''}${opp?`Opposed by ${opp}.`:''}</small>`:''}</div>${k===cur?'':en&&S.enact.opt===k?`<span class="tag">${S.enact.left} mo left</span>`:lock?`<span class="tag">${lock}</span>`:`<button class="btn" data-act="enact" data-arg="${cat}" data-n="${k}" ${S.enact?'disabled':''}>Enact</button>`}</div>`}).join('');
    const exp=exps.map(E=>{const s=pr()[E.k]||{},G=IGS[E.g],p=Math.round(pressOf(E)*10)/10,cap=15*(expState(E)==='half'?.5:1)*(expSoft(E)?.5:1);
      const status=s.st==='rejected'?`You rejected this reform: the ${G.n.toLowerCase()}’ anger is fixed at −${p}${tradGroups(E).length?`, and the ${tradGroups(E).map(g=>IGS[g].n.toLowerCase()).join(' and ')} are pleased`:''}.`
        :s.st==='promised'?`Promised: pass it within ${Math.max(0,s.until-S.turn)} months, or the promise breaks.`
        :`${G.e} ${G.n} mood −${p}, growing about 1 a year up to −${Math.round(cap)}.${expState(E)==='half'?' The current law partly satisfies them.':''}${expSoft(E)?' Generous welfare halves this pressure.':''}${coopted(E.g)?' Paused while their leaders are co-opted.':''}`;
      return`<div class="row"><span class="em">⚠️</span><div class="grow"><b>The ${G.n.toLowerCase()} want ${wantTxt(E)}</b><small>${status}</small>${s.st?'':`<div class="btns"><button class="btn" data-act="reject" data-arg="${E.k}" id="rej-${E.k}">Reject the reform</button><button class="btn" data-act="promise" data-arg="${E.k}">Promise reform</button></div>`}</div></div>`}).join('');
    return `<h2>${L.e} ${L.n}</h2><div class="card">${exp}${opts}</div>`}).join('');
  const list=GOALS.map(g=>`<div class="row"><span class="em">${S.goals[g.id]?'✅':'⬜'}</span><div class="grow"><b>${g.d}</b><small>Reward: 🪙${fmt(g.r)}</small></div></div>`).join('');
  return `<h2>The crown</h2><div class="card">
    <div class="row"><span class="em">👑</span><div class="grow"><b>${monarchName(m)}</b><small>${S.aging?`Aged ${m.age}. `:''}Reigning since year ${m.since}. ${TRAITS[m.trait].n}: ${TRAITS[m.trait].d}</small></div>${!h.none&&h.age>=16?`<button class="btn" data-act="abdicate" id="abdBtn">Abdicate</button>`:''}</div>
    ${S.empire?`<div class="row"><span class="em">🏛️</span><div class="grow"><b>An empire since year ${S.empire.y}</b><small>Proclaimed by ${S.empire.who}. Legitimacy +3.</small></div></div>`:empireOK()?`<div class="row"><span class="em">🏛️</span><div class="grow"><b>Proclaim an empire</b><small>${empireWhy()||'Your realm dominates the island. Crown yourself '+(m.g==='f'?'Empress':'Emperor')+': legitimacy +8 for three years and +3 for good, but your neighbors and the overseas powers will resent it.'}</small></div><button class="btn primary" data-act="empire" ${empireWhy()?'disabled':''}>🪙${fmt(EMPIRE_COST)}</button></div>`:''}
    ${S.herit?`<div class="row"><span class="em">${HERIT[S.herit].e}</span><div class="grow"><b>Heritage: ${HERIT[S.herit].n}</b><small>${HERIT[S.herit].d}</small></div></div>`:`<div class="row"><span class="em">🏺</span><div class="grow"><b>Choose your people's heritage</b><small>A lasting mark on your people, chosen once.</small><div class="seg">${Object.entries(HERIT).map(([k,Hh])=>`<button class="btn" data-act="herit" data-arg="${k}">${Hh.e} ${Hh.n}</button>`).join('')}</div></div></div>`}
    <div class="row"><span class="em">⚖️</span><div class="grow"><b>Legitimacy ${S.leg}</b><small>How accepted your rule is. It follows the mood of powerful interest groups and public approval. Trending toward ${c.legT}.</small>${bar(S.leg)}</div><button class="btn" data-act="why" data-arg="legitimacy">Why?</button></div>
    <div class="row"><span class="em">🔥</span><div class="grow"><b>Unrest ${Math.round(S.unrest)}</b><small>Builds when legitimacy falls below 40 or powerful groups turn radical. At 100, revolution breaks out.</small>${bar(100-S.unrest)}</div><button class="btn" data-act="why" data-arg="unrest">Why?</button></div></div>
  ${campHTML()}
  <h2>The royal house</h2>${houseHTML()}
  <h2>The royal family</h2>${familyHTML()}
  <h2>Royal household</h2>${householdHTML()}
  <h2>Interest groups</h2><p class="hint">Groups with more clout matter more to your legitimacy. Granting a favor improves a group\u2019s mood for a year.</p><div class="card">${igs}</div>
  <h2>Laws</h2><p class="hint">${S.enact?`${LAWS[S.enact.cat].o[S.enact.opt].n} passes in ${S.enact.left} month${S.enact.left>1?'s':''}. Opponents are unhappy until then.`:`Only one law can be debated at a time. It takes ${lawMonths()} months to pass.`} ${S.enact?'<button class="btn" data-act="cancelLaw">Withdraw</button>':''}</p>${laws}
  <h2>Royal agenda</h2><div class="card">${list}</div>
  ${S.reigns.length?`<h2>Past rulers</h2><div class="card">${S.reigns.slice(-6).reverse().map(r=>`<div class="row"><div class="grow"><b>${r.emp?(r.g==='f'?'Empress':'Emperor'):(r.g==='f'?'Queen':'King')} ${r.name}${r.num>1?' '+roman(r.num):''}</b><small>Year ${r.from} to ${r.to}. ${r.reason==='abdicated'?'Abdicated':r.reason==='deposed'?'Deposed':'Died'}.</small></div></div>`).join('')}</div>`:''}`}

function householdHTML(){const H=hh(),hc=hhCosts(),filled=Object.keys(OFFICES).filter(k=>officeSkill(k)),built=Object.keys(PALACE).filter(hasPal),maxE=provsOf('me').length,life=courtCost();

    <div class="row"><span class="em">🎩</span><div class="grow"><b>Court life: <span id="courtVal">${COURT[S.court].n}</span></b><input type="range" id="court" min="0" max="4" step="1" value="${S.court}" aria-label="Court life spending"><small id="courtHint">${courtHint(S.court)}</small></div></div>
    <div class="row"><span class="em">🏛️</span><div class="grow"><b>Court offices: ${filled.length} of ${Object.keys(OFFICES).length} filled</b><small>${filled.length?filled.map(k=>`${OFFICES[k].n} ${holder(k)} (${officeSkill(k)})`).join(', ')+'.':'No one holds a court office yet.'}${hc.offices?` Salaries 🪙${fmt(hc.offices)} a month.`:''}</small></div><button class="btn" data-act="offices">Manage</button></div>
    <div class="row"><span class="em">🏰</span><div class="grow"><b>Palace: ${built.length} of ${Object.keys(PALACE).length} improvements</b><small>${built.length?built.map(k=>PALACE[k].n).join(', ')+'.':'The palace has no improvements yet.'}${hc.palace?` Upkeep 🪙${fmt(hc.palace)} a month.`:''}</small></div><button class="btn" data-act="palace">Manage</button></div>
    <div class="row"><span class="em">🌾</span><div class="grow"><b>Royal estates: ${H.estates}</b><small>Each earns 🪙${Math.round(ESTATE_INC*(1+offT('steward')*.05+(lg('stew',2)?.25:0)))} a month. The crown can hold one per province you own (${maxE}).${H.estates>2?` The landowners resent crown land: mood −${2*(H.estates-2)}.`:' Beyond two, the landowners start to resent them.'}</small></div><button class="btn" data-act="estate" ${H.estates>=maxE||S.coins<ESTATE_COST?'disabled':''}>Buy 🪙${fmt(ESTATE_COST)}</button></div>
    <div class="row"><span class="em">👛</span><div class="grow"><b>Allowances for the royal children</b><small>${(ALLOW[H.allow]||ALLOW.fair).d} Costs 🪙${fmt(hc.allow)} a month for ${kids().filter(atHome).length} child${kids().filter(atHome).length===1?'':'ren'} at court.</small><div class="seg">${Object.entries(ALLOW).map(([k,a])=>`<button class="btn ${H.allow===k?'on':''}" data-act="allow" data-arg="${k}" aria-pressed="${H.allow===k}">${a.n}</button>`).join('')}</div></div></div>
    <div class="row"><div class="grow"><b>Household: 🪙${fmt(life+hc.offices+hc.allow+hc.palace+hc.tutors)} a month${hc.estates?`, less 🪙${fmt(hc.estates)} from estates`:''}</b><small>Court life, offices, allowances, tutors and palace upkeep. Shown line by line under Spending in the Economy tab.</small></div></div></div>`}
function officesSheet(){const H=hh();
  openSheet(`<h3>🏛️ Court offices</h3><p class="hint">Each office gives a bonus that grows with its holder’s skill, from 1 to 5. Each also has two tasks to choose between. Hired courtiers draw a salary; a grown prince or princess serves without one, and is better at offices that suit their character.</p>
    <div class="card">${Object.entries(OFFICES).map(([k,O])=>{const s=officeSkill(k),o=H.offices[k];return`<div class="row"><span class="em">${O.e}</span><div class="grow"><b>${O.n}: ${s?(o.kid!=null?kidName(kidById(o.kid)):o.name):'vacant'}</b><small>${s?`Skill ${stars(s)}. ${task(k)?O.a(s):O.d(s)}`:'No bonus while vacant.'}</small><div class="seg">${O.t.map((tn,j)=>`<button class="btn ${task(k)===j?'on':''}" data-act="task" data-arg="${k}" data-n="${j}" aria-pressed="${task(k)===j}">${tn}</button>`).join('')}</div></div><button class="btn" data-act="office" data-arg="${k}">${s?'Change':'Appoint'}</button></div>`}).join('')}</div>

function palaceSheet(){const H=hh();

const spouseFrom=sp=>NATIONS[sp.from]?`of the ${NATIONS[sp.from].n} royal family`:OVP[sp.from]?`of the royal house of ${OVP[sp.from].n}`:'of a great local family';

function kidEm(k){return k===heirOf(S)?'⭐':k.age<3?'👶':k.age<16?(k.g==='f'?'👧':'👦'):k.g==='f'?'👸':'🤴'}
function sibsHTML(){const L=sibs().slice().sort((a,b)=>b.age-a.age),h=heirOf(S),m=S.monarch;if(!L.length)return'';

    return`<div class="row"><span class="em">${k.g==='f'?'👸':'🤴'}</span><div class="grow"><b>${kidName(k)}</b> ${tags}<small>${S.aging?`Aged ${k.age}. `:''}${TRAITS[k.trait].n}.${k.edu?' Well educated.':''}${kidRole(k)?' '+kidRole(k)+'.':''}${k.spouse&&k.role!=='abroad'?` Married to ${k.spouse.name}.`:''}</small></div><button class="btn" data-act="kid" data-arg="${k.id}">Options</button></div>`}).join('')}
// skilled buildings need educated staff: the middle and upper classes, plus literate workers from the lower class
const SKILLED=['school','library','university','polytechnic','clinic','hospital','bank','printhouse','atelier','observatory','broadcaster','tradeco','academy'];
function skillCalc(){const s=soc(),pop=S.pop,sol=Math.min(S.troops,Math.round(pop*.2)),w=Math.max(0,pop*s.adults-sol),mid=s.mid??.15,up=s.up??.05,sw=w*(mid+up+(1-mid-up)*(.08+s.lit/100*.25));
  let sj=0;S.map.forEach(x=>{if(x.o!=='me')return;[x.b,x.sm].forEach(b=>{if(b&&B[b]&&SKILLED.includes(b))sj+=B[b].jobs||0})});return{sw:Math.round(sw),sj,f:sj>sw&&sj>0?Math.max(.4,sw/sj):1}}
function familyHTML(){const f=S.fam,h=heirOf(S),m=S.monarch,sp=f.spouse,list=kids().slice().sort((a,b)=>b.age-a.age||a.id-b.id);

    :`<div class="row"><span class="em">💍</span><div class="grow"><b>${monarchName(m)} is unmarried</b><small>${f.late?`Widowed: ${f.late.name} died in year ${f.late.y}. `:''}Without a consort there will be no more children.</small></div>${m.age>=16?`<button class="btn" data-act="marrySheet" data-arg="monarch">Marry</button>`:''}</div>`;

// The same breakdown feeds the tap-to-explain sheets and the console's "why" command. Rows mirror the formulas in calc() and endMonth().
function whyData(kind){const c=calc(),D=k=>!!S.dec[k],R=[];const add=(l,v,note)=>{if(Math.round(v*10))R.push({l,v,note})};

    add('New provinces not yet integrated',-c.integPen);
    // whatever's left comes from provinces being served unevenly (the rows above use kingdom-wide averages)
    const rest=c.target-R.reduce((a,r)=>a+r.v,0);if(Math.abs(rest)>=1)R.push({l:'Differences between provinces',v:rest,note:'Better- or worse-served provinces pull the average'});
    return{e:'📊',title:'Approval',now:S.hap+'%',intro:'Approval is how happy your subjects are. Each class counts in proportion to its size, and then these effects are added.',

    add(`Approval (${S.hap}%)`,(S.hap-50)*.3);add('Charismatic monarch',trait('charismatic')?6:0);add('Pious monarch',trait('pious')?3:0);add('House legacy: divine right',lg('blood',3)?4:0);add('The ancestral crown',hlHas('crown')?2:0);add('An empire',S.empire?3:0);add('Great cities',Math.min(3,setlCount(4)));add('Metropolises',Math.min(4,setlCount(5)*2));add('Grand projects',(gp('cathedral')?3:0)+(gp('fair')?4:0));add(`House standing: ${standTier().n}`,standTier().leg);add(`House unity: ${unityLvl()[1]}`,unity()>=80?2:unity()<20?-3:0);add('Loyal cadet branches',Math.min(3,cadets().filter(c=>c.loy>=60).length));add('A work celebrating the reign',legendOn()?3:0);
    add('Religion law',law('church').leg||0);add('Press law',law('press').leg||0);add('Royal festivities',D('festival')?2:0);add(`Royal household (${COURT[S.court].n.toLowerCase()})`,COURT[S.court].leg);add('Buildings',c.t.leg);add('Milestones',msLeg());add('Chancellor',offT('chancellor'));add('Royal broadcasts',hasTech('radio')?2:0);add(`Government: ${law('government').n.toLowerCase()}`,law('government').leg||0);add('Suffrage',sufOn()?(law('suffrage').leg||0):0);add('Reforms rejected',Math.min(3,rejected().length),'The traditional groups respect a firm crown');add('Upholding the old ways',3*oldWays());add('Great hall',hasPal('hall')?2:0);
    S.mods.filter(m=>m.k==='leg').forEach(m=>add(m.l,m.v,`${m.m} more month${m.m>1?'s':''}`));
    return{e:'👑',title:'Legitimacy',now:S.leg,intro:'Legitimacy is how accepted your rule is. Powerful interest groups count most: a group above mood 50 adds legitimacy, and a group below 50 takes it away.',

  punrest:(i,n)=>{i=num(i,-1);const P=S.prov[i];if(!P||P.o!=='me')return E('Usage: punrest ID N (one of your provinces)');P.unrest=clamp(num(n,50),0,100);return`${P.name} unrest set to ${P.unrest}`},

  revolt:i=>{i=num(i,-1);const P=S.prov[i];if(!P||P.o!=='me'||i===0)return E('Usage: revolt ID (one of your provinces, not the capital)');P.unrest=100;P.revolt={m:0,prog:0,str:rebelStr(P),sup:false};return`${P.name} rises in revolt`},
  add:n=>{S.coins+=num(n,10000);return`Treasury now ${fmt(S.coins)}`},
  pop:n=>{setPop(Math.max(10,num(n,S.pop)));S.best=Math.max(S.best,S.pop);return`Population set to ${fmt(S.pop)}`},
  approval:n=>{S.hap=clamp(num(n,S.hap),0,100);return`Approval set to ${S.hap}%`},
  legitimacy:n=>{S.leg=clamp(num(n,S.leg),0,100);return`Legitimacy set to ${S.leg}`},
  unrest:n=>{S.unrest=clamp(num(n,0),0,100);return`Unrest set to ${S.unrest}`},
  skip:n=>{const k=clamp(num(n,1),1,240);for(let i=0;i<k;i++)endMonth(true);return`Skipped ${k} months. Now ${MONTHS[S.month]}, year ${S.year}`},
  build:(id,n)=>{if(!B[id]||B[id].fixed)return E('Unknown building. Try buildings.');let k=clamp(num(n,1),1,50),b=0;while(k--){const i=freeTile(id);if(i<0)break;S.map[i][isHousing(id)?'hs':'b']=id;if(!B[id].forest)S.map[i].t='l';b++}return b?`Built ${b} ${B[id].n.toLowerCase()}`:E('No free tile available')},
  buildings:()=>Object.keys(B).filter(k=>!B[k].fixed).join(', '),
  unlock:()=>{TECH.forEach(t=>{if(!hasTech(t.id))S.tech.done.push(t.id)});S.era=3;S.tech.cur=null;S.tech.q=[];S.tech.pp={};return'Every technology researched'},
  tech:id=>{const t=techOf(id);if(!t)return E('Unknown technology. Try techs.');if(!hasTech(id))S.tech.done.push(id);S.tech.q=techQ().filter(x=>x!==id);if(S.tech.pp)delete S.tech.pp[id];if(S.tech.cur===id){S.tech.cur=null;S.tech.prog=0}return`${t.n} researched`},
  techs:()=>TECH.map(t=>t.id).join(', '),
  law:(c,o)=>{if(!LAWS[c]||!LAWS[c].o[o])return E('Try laws for valid options');S.laws[c]=o;if(S.enact&&S.enact.cat===c)S.enact=null;S.lawsPassed++;return`${LAWS[c].o[o].n} is now law`},
  laws:()=>Object.entries(LAWS).map(([c,L])=>`${c}: ${Object.keys(L.o).join(', ')}`),
  mood:(g,n)=>{if(!IGS[g])return E('Use '+IGIDS.join(', '));igM(g,num(n,20),12,'Console');return`${IGS[g].n} mood shifted by ${num(n,20)}`},
  event:id=>{const e=id==='crisis'?crisisEvent(pick(NIDS)):EVENTS.find(x=>x.id===id);if(!e)return E('Unknown event. Try events.');queue.length=0;queue.push(e);$('#conWrap').classList.remove('open');showNext();return`Showing ${id}`},
  events:()=>EVENTS.map(e=>e.id).concat('crisis').join(', '),
  rel:(c,n)=>{if(!NATIONS[c])return E('Use norvik, solenne or aurelia');S.rel[c]=clamp(num(n,50),0,100);return`${NATIONS[c].n} relations: ${S.rel[c]}`},
  tension:(c,n)=>{if(!NATIONS[c])return E('Use norvik, solenne or aurelia');S.tension[c]=clamp(num(n,50),0,100);S.crisisCd[c]=0;return`${NATIONS[c].n} tension: ${S.tension[c]}`},
  age:n=>{S.monarch.age=clamp(num(n,S.monarch.age),0,120);return`${monarchName(S.monarch)} is now ${S.monarch.age}`},
  die:()=>{queue.length=0;const old=succeed('died');queueSuccession(old,'died');$('#conWrap').classList.remove('open');showNext();return`${monarchName(old)} has died`},
  provinces:()=>S.prov.map((P,i)=>`${i}: ${P.name} (${ownName(P.o)})`),
  take:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o==='me')return E('Use provinces to find an ID you don\u2019t own');transfer(i,'me','console');return`${S.prov[i].name} is yours`},
  give:(i,n)=>{i=num(i,-1);if(!S.prov[i]||i===0||!(NATIONS[n]||n==='wild'))return E('Usage: give ID NATION');transfer(i,n,'console');return`${S.prov[i].name} given to ${ownName(n)}`},
  claim:i=>{i=num(i,-1);if(!S.prov[i])return E('Unknown province');S.claims[i]=true;return`Claim on ${S.prov[i].name}`},
  army:n=>{S.army=clamp(num(n,1),0,4);return`Army set to ${ARMY[S.army].n.toLowerCase()}`},
  war:(n,i)=>{if(!NATIONS[n])return E('Usage: war NATION [PROVINCE_ID]');if(S.war)return E('Already at war');const g=i!=null?num(i,-1):(borderOf(n,'me')[0]);if(g==null||!S.prov[g]||S.prov[g].o!==n)return E('No valid target province');startWar(n,g,'me');return`War declared on ${NATIONS[n].n} over ${S.prov[g].name}`},
  invade:n=>{if(!NATIONS[n])return E('Usage: invade NATION');if(S.war)return E('Already at war');const g=borderOf('me',n).filter(i=>i!==0)[0];if(g==null)return E('No border province to attack');startWar(n,g,n);return`${NATIONS[n].n} invades ${S.prov[g].name}`},
  score:n=>{if(!S.war)return E('Not at war');S.war.score=clamp(num(n,0),-100,100);return`War score set to ${S.war.score}`},
  peace:()=>{if(!S.war)return E('Not at war');const r=finishWar('Peace',[],[]);return r.d},
  troops:n=>{S.troops=Math.max(0,num(n,troopTarget()));return`Troops set to ${S.troops}`},
  navy:n=>{S.navy=Math.max(0,num(n,5));return`Navy set to ${S.navy} ships`},
  mobilize:()=>{S.mob=!S.mob;return`Mobilization ${S.mob?'on':'off'}`},
  support:n=>{if(!S.war)return E('Not at war');S.war.support=clamp(num(n,50),0,100);return`War support ${S.war.support}%`},
  occupy:i=>{i=num(i,-1);if(!S.war||!S.prov[i])return E('Usage: occupy ID (during a war)');S.war.occ[i]=S.prov[i].o==='me'?'them':'me';S.war.occd[i]=1;return`${S.prov[i].name} occupied`},
  general:t=>{const k=GTRAITS[t]?t:pick(Object.keys(GTRAITS));S.general={name:pick(GNAMES),trait:k};return`General ${S.general.name} (${GTRAITS[k].n}) appointed`},
  court:n=>{S.court=clamp(num(n,2),0,4);return`Royal household set to ${COURT[S.court].n.toLowerCase()}`},
  aging:v=>{S.aging=v!=='off';return`Aging and succession ${S.aging?'on':'off'}`},
  goals:()=>{GOALS.forEach(g=>S.goals[g.id]=1);return'All objectives marked complete'},
  status:()=>statusLines(),
  province:i=>{i=num(i,-1);const P=S.prov[i];if(!P)return E('Usage: province ID (see provinces)');const tl=provTiles(i),bl=tl.map(t=>S.map[t].b).filter(b=>b&&B[b]);
    return[`${i}: ${P.name}. Owner ${ownName(P.o)}${P.o!==P.core?`, originally ${ownName(P.core)}`:''}.`,`${tl.length} tiles, ${P.pop} foreign residents${P.heart?', a heartland':''}.`,`Buildings: ${bl.length?bl.join(', '):'none'}.`,`Your claim: ${S.claims[i]?'yes':'no'}. Claimed by: ${S.fclaims[i]?NATIONS[S.fclaims[i]].n:'nobody'}.`,
      `Occupied: ${S.war&&S.war.occ[i]?(S.war.occ[i]==='me'?'by you':'by the enemy'):'no'}. Devastated: ${S.dev[i]?S.dev[i]+' months':'no'}. Settling: ${P.settle?P.settle+' months':'no'}.`,NATIONS[P.o]?`Buy price: ${fmt(buyPrice(i))}.`:'']},
  why:w=>w&&w.startsWith('leg')?whyLegitimacy():w&&w.startsWith('app')?whyApproval():w&&w.startsWith('unr')?whyLines('unrest'):E('Usage: why approval, why legitimacy or why unrest'),
  events:v=>{if(v==='off'||v==='on'){S.noEvents=v==='off';return`Random events ${v}`}return EVENTS.map(e=>e.id).concat('crisis').join(', ')},
  date:(m,y)=>{if(m==null)return E('Usage: date MONTH [YEAR]');S.month=monthIdx(m);if(y!=null)S.year=Math.max(1,num(y,S.year));return`Date set to ${MONTHS[S.month]}, year ${S.year}`},
  next:()=>{endMonth(false);return['A month passes. Details are in the news.'].concat(statusLines())},
  gender:g=>{if(!['m','f'].includes(g))return E('Use gender m or gender f');S.monarch.g=g;return`Now ${monarchName(S.monarch)}`},
  consort:g=>{const sp=S.fam.spouse;if(!sp)return E('The monarch is unmarried');if(!['m','f'].includes(g))return E('Use consort m or consort f');sp.g=g;sp.name=royalName(g,new Set([S.monarch.name,...kids().map(k=>k.name)]));return`${sp.name} is now the ${g==='m'?'husband':'wife'}`},
  overseas:()=>{const O=ov();O.known=true;genIslands();return`Overseas powers revealed, with ${O.isl.length} outer islands`},
  empire:()=>{if(S.empire)return E('Already an empire');S.empire={y:S.year,who:''};S.empire.who=monarchName(S.monarch);return`${S.empire.who} rules an empire`},
  heritage:k=>{if(!HERIT[k])return E('Use '+Object.keys(HERIT).join(', '));S.herit=k;return`Heritage: ${HERIT[k].n}`},
  rulers:()=>liveNations().map(n=>`${NATIONS[n].n}: ${rName(n)}, ${ruler(n).age}, ${ruler(n).pers}${ruler(n).heir?`, heir ${ruler(n).heir.name}`:', no heir'}${pact(n)?`, ${pact(n).t}`:''}`),
  nwar:(a,b)=>{if(!NATIONS[a]||!NATIONS[b]||a===b)return E('Usage: nwar norvik solenne');if(nwarOf(a)||nwarOf(b))return E('One of them is already at war');nwars().push({a,b,m:0,sc:0});return`${NATIONS[a].n} declares war on ${NATIONS[b].n}`},
  renown:v=>{addRen(num(v,100));return`Renown ${Math.floor(house().ren)}`},
  heirloom:k=>{if(!HEIRLOOMS[k])return E('Use '+Object.keys(HEIRLOOMS).join(', '));gainHeirloom(k);return`${HEIRLOOMS[k].n} added`},
  pretender:()=>{const g=Math.random()<.5?'m':'f',nm=royalName(g,new Set());addPret(nm,g,20+rnd(20),70,'a claimant from a forgotten branch of the family');return`${nm} claims the throne`},
  bastard:()=>{const g=Math.random()<.5?'m':'f',nm=royalName(g,new Set(kids().map(x=>x.name)));S.fam.bast=S.fam.bast||[];S.fam.bast.push({name:nm,g,age:rnd(14)});return`${nm} is acknowledged`},
  trait:t=>{if(!TRAITS[t])return E('Use '+Object.keys(TRAITS).join(', '));S.monarch.trait=t;return`${monarchName(S.monarch)} is now ${TRAITS[t].n.toLowerCase()}`},
  heir:n=>{const h=heirOf(S);if(!h)return E('No children. Try child.');h.age=clamp(num(n,h.age),0,90);return`${kidName(h)} is now ${h.age}`},
  marry:n=>{if(!NATIONS[n]&&n!=='noble')return E('Usage: marry NATION or marry noble (marries the heir)');const h=heirOf(S);if(!h)return E('No children. Try child.');h.age=Math.max(16,h.age);h.spouse=null;return marryKid(h,n)},
  settle:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o!=='wild')return E('Usage: settle ID (a frontier province)');transfer(i,'me','settled');return`${S.prov[i].name} settled`},
  devastate:(i,m)=>{i=num(i,-1);if(!S.prov[i])return E('Usage: devastate ID [MONTHS]');S.dev[i]=Math.max(1,num(m,12));return`${S.prov[i].name} devastated for ${S.dev[i]} months`},
  rebuild:a=>{if(a!=='all')return E('Usage: rebuild all');const n=Object.keys(S.dev).length;S.dev={};return`${n} province${n===1?'':'s'} rebuilt`},
  demolish:i=>{i=num(i,-1);if(!S.prov[i]||S.prov[i].o!=='me')return E('Usage: demolish ID (one of your provinces)');let k=0;provTiles(i).forEach(t=>{const x=S.map[t];if(x.b&&!B[x.b].fixed){x.b=null;k++}});return`Demolished ${k} building${k===1?'':'s'} in ${S.prov[i].name}`},
  win:()=>{if(!S.war)return E('Not at war');S.war.score=Math.max(S.war.score,60);const r=autoResolve('win');return[r.t+'.',r.d]},
  lose:()=>{if(!S.war)return E('Not at war');S.war.score=Math.min(S.war.score,-60);const r=autoResolve('lose');return[r.t+'.',r.d]},
  enemy:(n,v)=>{if(!NATIONS[n])return E('Usage: enemy NATION N, or enemy NATION off');S.enemyStr=S.enemyStr||{};if(v==='off'||v==null){delete S.enemyStr[n];return`${NATIONS[n].n} strength back to normal (${theirStr(n)})`}S.enemyStr[n]=Math.max(0,num(v,0));return`${NATIONS[n].n} army strength fixed at ${S.enemyStr[n]}`},
  embargo:(n,m)=>{if(!NATIONS[n])return E('Usage: embargo NATION MONTHS (0 lifts it)');const k=Math.max(0,num(m,12));if(k)S.embargo[n]=k;else delete S.embargo[n];return k?`${NATIONS[n].n} embargo for ${k} months`:`${NATIONS[n].n} embargo lifted`},
  situation:(n,st)=>{if(!NATIONS[n]||!['stable','indebted','troubled'].includes(st))return E('Usage: situation NATION stable|indebted|troubled');S.nsit[n]=st;return`${NATIONS[n].n} is now ${st}`},
  god:()=>{S.god=!S.god;if(S.god)S.coins=Math.max(S.coins,999999);return`God mode ${S.god?'on: infinite money, and unrest can\u2019t rise':'off'}`},
  clear:()=>{LOG.length=0;return[]},
  reset:y=>{if(y!=='yes')return E('Type reset yes to start over');S=newState();return'New nation created'}
};

const CHIST=[];let chIdx=-1;
function suggest(){const v=$('#conIn').value.trim().toLowerCase(),box=$('#conSug');if(!v||v.includes(' ')){box.innerHTML='';return}
  const m=Object.keys(CMDS).filter(k=>k.startsWith(v)&&k!==v).slice(0,6);box.innerHTML=m.map(k=>`<button class="btn" data-act="sug" data-arg="${k}">${k}</button>`).join('')}
function runCmd(line){line=line.trim();if(!line)return;if(CHIST[CHIST.length-1]!==line)CHIST.push(line);chIdx=-1;if($('#conSug'))$('#conSug').innerHTML='';out('> '+line,'c');const [c,...a]=line.split(/\s+/);const f=CMDS[c.toLowerCase()];
  if(!f)out('Unknown command. Type help.','e');else{const r=f(...a);if(r&&r.err)out(r.err,'e');else out(r)}render();renderLog()}
function openCon(){$('#sheetWrap').classList.remove('open');$('#conWrap').classList.add('open');renderLog()}

    +box('Research',row(b('Research everything','unlock'))+row(sel('dv-tech',TECH.filter(t=>!hasTech(t.id)).map(t=>[t.id,t.n])),go('Research','tech',['dv-tech'])))
    +box('Game switches',row(lab('Random events'),b('On','events on'),b('Off','events off'))+row(lab('Aging'),b('On','aging on'),b('Off','aging off'))+row(b('Complete all objectives','goals')))
    +box('Reports',row(b('Status','status'),b('Why approval','why approval'),b('Why legitimacy','why legitimacy'),b('Why unrest','why unrest')));
  if(tab==='kingdom')return box(`Era: ${ERAS[era()].n}`,row(...ERAS.map((E,i)=>b(`${E.e} ${E.n.replace('Age of ','')}`,'era '+i,i===era()))))
    +box('Numbers',[['approval','Approval',S.hap],['legitimacy','Legitimacy',S.leg],['unrest','Unrest',Math.round(S.unrest)],['pop','Population',S.pop]].map(([c,l,v])=>row(lab(l),num('dv-'+c,v,0),go('Set',c,['dv-'+c]))).join(''))
    +box('Interest group mood',row(sel('dv-ig',IGIDS.map(k=>[k,IGS[k].n])),num('dv-ign',20),go('Shift','mood',['dv-ig','dv-ign'])),'Positive or negative; it fades over 12 months.')
    +box('Laws',row(sel('dv-law',Object.entries(LAWS).flatMap(([c,L])=>Object.entries(L.o).map(([o,O])=>[`${c} ${o}`,`${L.n}: ${O.n}${S.laws[c]===o?' ✓':''}`]))),go('Enact','law',['dv-law'])))
    +box('Heritage',row(sel('dv-her',Object.entries(HERIT).map(([k,h])=>[k,`${h.e} ${h.n}`]),S.herit),go('Set','heritage',['dv-her'])))
    +(mine.length?box('Your provinces',row(sel('dv-pv',mine))+row(lab('Unrest'),num('dv-pvu',50,0),go('Set','punrest',['dv-pv','dv-pvu']))+row(lab('Integration %'),num('dv-pvi',100,0),go('Set','integ',['dv-pv','dv-pvi']))+row(go('Start a revolt','revolt',['dv-pv']),go('Demolish buildings','demolish',['dv-pv']))):'');
  if(tab==='royal'){const ks=kids(),h=heirOf(S);return box(`${monarchName(S.monarch)}, aged ${S.monarch.age}`,row(lab('Age'),num('dv-age',S.monarch.age,0),go('Set','age',['dv-age']))+row(lab('Gender'),b('King','gender m'),b('Queen','gender f'))
      +row(sel('dv-tr',Object.entries(TRAITS).map(([k,t])=>[k,t.n]),S.monarch.trait),go('Set trait','trait',['dv-tr']))+row(b(S.fam.spouse?'Married':'Find a spouse','spouse'),b('💀 Monarch dies','die')))

      +(ks.length?row(sel('dv-kid',ks.map(k=>[k.id,`${kidName(k)}, ${k.age}${k===h?' (heir)':''}`])),go('Make heir','makeheir',['dv-kid']))+row(lab('Heir’s age'),num('dv-hage',h?h.age:18,0),go('Set','heir',['dv-hage']))
        +row(lab('Marry the heir to'),sel('dv-mar',[['noble','a noble family'],...nats]),go('Marry','marry',['dv-mar'])):''))

const blocking=()=>!!$('#sheet .choice')||!!$('#sheet [data-act=start]')||!!$('#sheet [data-act=nextEvent]');
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap'&&!blocking())closeSheet()});
$('#conWrap').addEventListener('click',e=>{if(e.target.id==='conWrap')$('#conWrap').classList.remove('open')});
$('#conIn').addEventListener('keydown',e=>{const el=e.target;
  if(e.key==='Enter'){runCmd(el.value);el.value='';return}
  if(e.key==='ArrowUp'&&CHIST.length){e.preventDefault();chIdx=chIdx<0?CHIST.length-1:Math.max(0,chIdx-1);el.value=CHIST[chIdx];return}
  if(e.key==='ArrowDown'&&chIdx>=0){e.preventDefault();chIdx++;if(chIdx>=CHIST.length){chIdx=-1;el.value=''}else el.value=CHIST[chIdx];return}
  if(e.key==='Tab'){const f=$('#conSug button');if(f){e.preventDefault();el.value=f.dataset.arg+' ';suggest()}}});
$('#conIn').addEventListener('input',suggest);
document.addEventListener('keydown',e=>{if(e.key==='`'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();openCon()}
  if(e.key==='Escape'){$('#conWrap').classList.remove('open');if($('#sheetWrap').classList.contains('open')&&!blocking())closeSheet()}});
const net=()=>{$('#net').hidden=navigator.onLine};addEventListener('online',net);addEventListener('offline',net);
// Offline support when hosted (https or localhost); a file opened from Drive skips this.
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
let chartT;addEventListener('resize',()=>{clearTimeout(chartT);chartT=setTimeout(()=>{if(tab==='people')drawCharts();renderModes()},150)});
function setPanel(show){document.body.classList.toggle('nopanel',!show);UI.nopanel=!show;saveUI();const b=$('#panelBtn');b.setAttribute('aria-label',show?'Hide the side panel':'Show the side panel');b.textContent=show?'⤢':'⤡'}
$('#modeSel').addEventListener('change',e=>act('mapmode',e.target.value));
// folding or unfolding the phone crosses the wide/narrow line; the key's default follows it
if(window.matchMedia)matchMedia('(min-width:760px)').addEventListener('change',renderModes);
mapInit();renderModes();setPanel(!UI.nopanel);setFull(!!UI.full);const had=load();net();render();if(!had)welcome();if(UI.v3)v3Start(false);
else if(S.migrated){delete S.migrated;save();openSheet(`<div class="event"><div class="pic" aria-hidden="true">🗺️</div><h3>Your kingdom now has neighbors</h3><p>The kingdom has been redrawn on a larger map with land borders. Your buildings have been rebuilt around the capital, and you also hold two more provinces to grow into. Norvik lies to the north, Aurelia to the east and Solenne to the south, with unclaimed frontier between you.</p></div><button class="btn primary wide" data-act="closeSheet">Explore the map</button>`)}
</script>
